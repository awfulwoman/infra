# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: router-4gb-bertha
host_name_medium: router-bertha
host_name_short: bertha
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Primary home dual-NIC Linux router"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.1 # bertha's LAN address (on enp1s0)
host_mac: "1c:61:b4:6d:6f:cd" # enp1s0 (LAN) NIC
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.1
# The WAN (enp2s0) is the netplan "primary" and runs DHCP off the Fritz!Box.
# Making the WAN the DHCP primary is deliberate: static mode would have the role
# emit `default via {{ network_netplan_gateway }}` (192.168.1.1) — a default
# route pointing at bertha ITSELF, which black-holes all outbound traffic. In
# DHCP mode the upstream (Fritz!Box, 192.168.178.1) supplies the default route.
host_primary_interface: "enp2s0"
network_netplan_mode: dhcp
network_netplan_config:
  ethernets:
    enp2s0: # WAN - to Fritz!Box / internet (DHCP supplies default route + gw)
      dhcp4: true
      # Stay IPv4-only on the WAN. Without these, the interface silently
      # SLAAC-autoconfigures a *public, globally-routable* IPv6 address from
      # the Fritz!Box's RAs — and since there's no ip6tables ruleset, that
      # address is completely unfiltered. accept-ra:false stops RA-driven
      # autoconfig; dhcp6:false stops DHCPv6. Link-local (fe80::) remains,
      # which is harmless (not routable off-link).
      dhcp6: false
      accept-ra: false
    enp1s0: # LAN - home side, bertha is the gateway here (NO default route)
      addresses: [192.168.1.1/24]
      # A router must never learn routing from its own LAN clients. A live
      # check found another LAN device (f4:34:f0:2e:f4:c3) sending RAs that
      # this interface was willing to accept. Refuse them.
      accept-ra: false
      nameservers:
        addresses: [192.168.1.1]

# NIC roles for network-routing-basic (must match netplan above)
wan_iface: enp2s0 # WAN - to Fritz!Box / internet
lan_iface: enp1s0 # LAN - home side

# Harden the router: default-DROP INPUT + FORWARD, allow-list management/services
# from the LAN and Tailscale only. WAN cannot reach the router or initiate forwards.
network_routing_firewall: true

# -------------------------------------------------------------------
# DHCP SERVER (infra-dhcpd) — bertha is the LAN's DHCP server
# -------------------------------------------------------------------
# Role default is `false`, which installs the daemon but leaves it stopped.
dhcpd_enabled: true
# Bind to the LAN NIC. The role default is `enp3s0` — which doesn't exist on
# this host, so the server was serving nobody (clients had stale/foreign IPs).
dhcpd_interface: enp1s0
# Hand out ONLY the router as resolver. The role default appends 8.8.8.8 as a
# secondary, which would let clients bypass bertha's authoritative/split-horizon
# DNS whenever they fall through to it.
dhcpd_dns_servers:
  - 192.168.1.1

# -------------------------------------------------------------------
# DNS SERVER (infra-named) — bertha is the LAN's primary authoritative DNS
# -------------------------------------------------------------------
# Role default advertises dns01 -> 192.168.1.2 (deedee). bertha now takes over:
# this also sets the SOA primary (template uses [0]) and its glue A/PTR records.
bind_records_nameservers:
  - name: dns01
    ip: 192.168.1.1
# Apex/www A records now live in group_vars/infra (shared infra-zone topology).

# Keep BIND off the WAN (Fritz!Box) side — bind everywhere EXCEPT that subnet.
# The firewall already blocks WAN:53, this removes the listener too (defence in
# depth). LAN is IPv4-only, so no v6 DNS listener is needed at all.
bind_listen_on: "!192.168.178.0/24; any;"
bind_listen_on_v6: "none;"

# Serve the previous internal domain as a DNAME alias onto the current one, so
# devices still hard-coded to search i.affordablepotatoes.com resolve to the
# ewwww.eu records (e.g. jellyfin.i.affordablepotatoes.com -> jellyfin.ewwww.eu).
bind_dname_aliases:
  - i.affordablepotatoes.com

# -------------------------------------------------------------------
# DNS FILTERING (infra-named RPZ) — network-wide ad/tracker blocking
# -------------------------------------------------------------------
# dhcpd hands out bertha as the ONLY resolver, so filtering here cannot be
# bypassed by a client picking a different DNS server. Role default is `false`;
# this is the one host where it makes sense.
bind_rpz_enabled: true
# HaGeZi Multi Normal: ~181k domains, the balanced tier. See the role README for
# the other tiers and how to layer the malware/phishing list alongside.
bind_rpz_zones:
  - name: rpz.hagezi-multi
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/multi.txt
# Domains a blocklist gets wrong. The internal domain and the DNAME alias above
# are protected automatically — only add genuine false positives here.
bind_rpz_allowlist_extra: []

# -------------------------------------------------------------------
# PUBLIC DNS (infra-named, #272) — bertha is the one host that publishes
# the derived record set to the public Hetzner zone.
# -------------------------------------------------------------------
bind_public_dns_enabled: true

# -------------------------------------------------------------------
# SPLIT-HORIZON VIEWS (infra-named, #262) — LAN clients keep getting
# host_ipv4, Tailscale-only clients (e.g. a phone on mobile data) now get
# host_tailscale_ipv4 for the same names, instead of a LAN address they
# can't route to. bertha is the sole DHCP-advertised LAN resolver, so this
# is the one host where it's meaningful.
bind_split_horizon_enabled: true

# -------------------------------------------------------------------
# ACME
# -------------------------------------------------------------------
acme_path: "/fastpool/acme"

# Production wildcard for the internal domain (#268). Role default is
# staging with throwaway test subdomains — bertha is the one host that
# mints the real thing. distribute: true copies the fullchain + key into
# infra_certbot_distribution_dir, ready for #269 to serve to other hosts.
infra_certbot_domains:
  - domain: "{{ domainname_infra }}"
    subdomain: "*"
    distribute: true
infra_certbot_dir: https://acme-v02.api.letsencrypt.org/directory

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
ansible_user: "{{ vault_server_username }}"
ansible_become_password: "{{ vault_password }}"
