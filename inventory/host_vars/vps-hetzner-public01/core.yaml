# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: virtual
host_name: vps-hetzner-public01
host_name_medium: vps-public01
host_name_short: public01
host_region: hetzner
host_site: cloud
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Hetzner cloud server for public services"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 188.245.37.81 # DHCP assigned IP for this server - may change if server is reprovisioned
host_primary_interface: enp1s0
network_netplan_mode: dhcp
host_ipv4_extra:
  - "{{ hetzner_floating_ip }}/32" # Assign permanent floating IP to this server
network_netplan_nameservers: ["185.12.64.1", "185.12.64.2"]
host_tailscale_ipv4: 100.80.2.1

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
# ansible_host: "{{ host_ipv4 }}"
ansible_host: awfulwoman.com
ansible_user: "{{ vault_server_username }}"


bootstrap_ubuntu_timezone: "Europe/Berlin"


# -------------------------------------------------------------------
# SECURITY
# -------------------------------------------------------------------
# The only host in the estate with SSH exposed to the internet, and it is
# under constant distributed brute-force: ~157 sshd log lines/min from ~185
# distinct source IPs, enough concurrent pre-auth connections to trip sshd's
# MaxStartups throttle. Key-only auth means none of it succeeds, but the
# dropped-connection roulette and the log volume both cost us.
bootstrap_ubuntu_fail2ban_enabled: true
security_fail2ban_maxretry: 3
security_fail2ban_bantime: 1d
security_fail2ban_bantime_maxtime: 4w


# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------

zfs:
  fastpool:
    device:
    vdevs:
      - type: stripe
        disks:
          - /dev/disk/by-id/scsi-0HC_Volume_104390137
    datasets:
      compositions:
        policy: critical
        snapshots_discover_children: true
      sites:
        datasets:
          awfulwoman:
            policy: critical
          pixelfed:
            policy: critical
          gotosocial:
            policy: critical

# -------------------------------------------------------------------
# SITES
# -------------------------------------------------------------------
# REVERSEPROXY (#276 - dual mode: wildcard default + scoped ACME)
#
# The one host in the estate that needs both mechanisms at once. The
# letsencrypt resolver stays alive here, but only for the genuinely public
# names that the internal *.ewwww.eu wildcard can never cover:
#   - gts.awfulwoman.com          (gotosocial file provider, below)
#   - awfulwoman.com + the two old redirect domains
#                                 (composition-awfulwoman's "beta" router)
# Every internal name on this host now takes the wildcard as Traefik's default
# certificate instead. No internal router references the resolver: the
# certresolver labels are guarded on reverseproxy_wildcard_cert estate-wide.
reverseproxy_use_letsencrypt: true
reverseproxy_wildcard_cert: true

traefik_providers:
  - gotosocial
  - wildcard-cert

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_healthchecksio_enabled: true
system_zfs_policy_mqtt_enabled: true

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named) instead of a hand-maintained cnames: list.
# reverseproxy's default labels (whoami/traefik) are suppressed here: they
# were never actually registered as cnames on this host, and exposing a
# Traefik dashboard/debug endpoint should be a deliberate call, not a side
# effect of this migration.
# -------------------------------------------------------------------
compositions:
  - composition: reverseproxy
    labels: []
  - container-management
  - awfulwoman
  - zfs-api
  - logtide-agent
