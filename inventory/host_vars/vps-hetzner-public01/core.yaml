# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: virtual
host_name: vps-hetzner-public01
host_name_medium: vps-public01
host_name_short: public01
host_region: hetzner
host_site: cloud
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Hetzner cloud server for public services"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 188.245.37.81 # DHCP assigned IP for this server - may change if server is reprovisioned
host_primary_interface: enp1s0
network_netplan_mode: dhcp
host_ipv4_extra:
  - "{{ hetzner_floating_ip }}/32" # Assign permanent floating IP to this server
network_netplan_nameservers: ["185.12.64.1", "185.12.64.2"]
host_tailscale_ipv4: 100.80.2.1

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
# ansible_host: "{{ host_ipv4 }}"
ansible_host: awfulwoman.com
ansible_user: "{{ vault_server_username }}"


bootstrap_ubuntu_timezone: "Europe/Berlin"


# -------------------------------------------------------------------
# SECURITY
# -------------------------------------------------------------------
# The only host in the estate with SSH exposed to the internet, and it is
# under constant distributed brute-force: ~157 sshd log lines/min from ~185
# distinct source IPs, enough concurrent pre-auth connections to trip sshd's
# MaxStartups throttle. Key-only auth means none of it succeeds, but the
# dropped-connection roulette and the log volume both cost us.
bootstrap_ubuntu_fail2ban_enabled: true
security_fail2ban_maxretry: 3
security_fail2ban_bantime: 1d
security_fail2ban_bantime_maxtime: 4w


# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------

zfs:
  fastpool:
    device:
    vdevs:
      - type: stripe
        disks:
          - /dev/disk/by-id/scsi-0HC_Volume_104390137
    datasets:
      compositions:
        # Every composition states its own policy; see ADR-0001. The parent
        # stays low so anything Docker creates and nobody declared is
        # snapshotted briefly and never replicated.
        policy: low
        snapshots_discover_children: true
        datasets:
          # Holds nothing that cannot be redeployed: certificates come from
          # bertha. A local snapshot covers a bad deploy.
          reverseproxy:
            policy: low
          # Serves fastpool/sites/awfulwoman, which is critical in its own
          # right below. This dataset is just the container's config.
          awfulwoman:
            policy: low
          # SQLite holds IndieAuth tokens and the share queue; the posts
          # themselves live in git, so a lost DB only costs a re-login.
          micropub-server:
            policy: low
          container-management:
            policy: none
          zfs-api:
            policy: none
          logtide-agent:
            policy: none
      sites:
        datasets:
          awfulwoman:
            policy: critical
          pixelfed:
            policy: critical
          gotosocial:
            policy: critical

# -------------------------------------------------------------------
# SITES
# -------------------------------------------------------------------
# REVERSEPROXY
#
# No ACME here. This host is on the internet, and answering DNS challenges
# meant keeping a read-write Hetzner token on it. Every certificate it serves
# is issued on bertha and handed over by client-cert-distribution:
#   - the internal wildcard, Traefik's default, for the internal names
#   - the personal domain, apex and wildcard (the wildcard covers gts. and
#     any later subdomain; it does not cover the apex)
#   - the two old redirect domains
# The public ones share a key that only bertha and this host hold.
reverseproxy_use_letsencrypt: false
reverseproxy_wildcard_cert: true

client_cert_distribution_bundles:
  - name: "*.{{ domainname_infra }}"
    install_dir: /etc/ssl/internal-wildcard
  - name: "{{ domainname_personal }}"
    install_dir: /etc/ssl/public/personal-apex
  - name: "*.{{ domainname_personal }}"
    install_dir: /etc/ssl/public/personal-wildcard
  - name: "{{ vault_domainname_wc }}"
    install_dir: /etc/ssl/public/redirect-wc
  - name: "{{ vault_domainname_se }}"
    install_dir: /etc/ssl/public/redirect-se
reverseproxy_extra_cert_dirs: "{{ client_cert_distribution_bundles[1:] | map(attribute='install_dir') | list }}"

traefik_providers:
  - gotosocial
  - wildcard-cert

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_healthchecksio_enabled: true
system_zfs_policy_mqtt_enabled: true

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named) instead of a hand-maintained cnames: list.
# reverseproxy's default labels (whoami/traefik) are suppressed here: they
# were never actually registered as cnames on this host, and exposing a
# Traefik dashboard/debug endpoint should be a deliberate call, not a side
# effect of this migration.
# -------------------------------------------------------------------
compositions:
  - composition: reverseproxy
    labels: []
  - container-management
  - awfulwoman
  - micropub-server
  - zfs-api
  - logtide-agent
