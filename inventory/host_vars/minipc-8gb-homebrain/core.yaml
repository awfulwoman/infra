# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: minipc-8gb-homebrain
host_name_medium: minipc-homebrain
host_name_short: homebrain
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Home automation hub"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.130
host_primary_interface: "enp1s0"
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.130
host_mac: "f0:d4:e2:f4:30:6f"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
ansible_user: "{{ vault_server_username }}"
ansible_become_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: true

# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------

zfs:
  fastpool:
    vdevs:
      - type: stripe
        disks: /dev/disk/by-id/scsi-SATA_INTENSO_SSD_AA000000000000001079
    datasets:
      misc:
        datasets:
          syncthing:
            policy: critical
      compositions:
        state: present
        policy: critical
        snapshots_discover_children: true

# -------------------------------------------------------------------
# MISC
# -------------------------------------------------------------------

composition_motioneye_usbdevice: /dev/video0

docker_port_open: true

traefik_providers:
  - homeassistant
  - esphome
  - watchyourlan
  - gateway
  - wildcard-cert

# -------------------------------------------------------------------
# REVERSEPROXY (#271 - internal wildcard cert rollout)
# Internal-only host: no genuinely public router on this host, so no
# scoped ACME exception is needed (unlike public01, see #271).
# -------------------------------------------------------------------
reverseproxy_use_letsencrypt: false
reverseproxy_wildcard_cert: true

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named) instead of a hand-maintained cnames: list.
# reverseproxy's default labels (whoami/traefik) are suppressed here, plus
# the extra 'gateway' this host used to override in: none of the three were
# ever actually registered as cnames, and exposing a Traefik dashboard/debug
# endpoint should be a deliberate call, not a side effect of this migration.
# mqtt must derive before owntracks and zigbee2mqtt (unchanged from the old
# role order — those compositions depend on mqtt already being up).
# -------------------------------------------------------------------
compositions:
  - mqtt
  - composition: reverseproxy
    labels: []
  - container-management
  - homeassistant
  - homeassistant-personal
  - esphome
  - matter
  - owntracks
  - zigbee2mqtt
  - watchyourlan
  - zfs-api

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_healthchecksio_enabled: true
system_zfs_policy_mqtt_enabled: true
