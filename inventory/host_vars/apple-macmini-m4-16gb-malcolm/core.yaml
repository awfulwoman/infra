# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: apple-macmini-m4-16gb-malcolm
host_name_medium: macmini-malcolm
host_name_short: malcolm
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Mac Mini M4 16GB - used for LLM and MacOS-specific workloads"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_primary_interface: "en0"
host_ipv4: 192.168.1.99
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.99
host_mac: "1c:f6:4c:3e:51:a5"

# Headless tailscaled from the brew formula (system-tailscale-macos).
tailscale_bin: /opt/homebrew/bin/tailscale

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
# ansible_host: "{{ host_fqdn }}"
ansible_user: "{{ vault_server_username }}"
ansible_become_password: "{{ vault_password }}"
ansible_path: "{{ ansible_facts.user_dir }}/ansible"
ansible_log_path: "{{ ansible_path }}/logs"
ansible_vault_password_file: "{{ ansible_path }}/.vaultpassword"
ansible_roles_path: "{{ ansible_path }}/galaxy/roles"
ansible_collections_path: "{{ ansible_path }}/galaxy/collections"
ansible_infra_dir: "{{ ansible_facts.user_dir }}/Code/awfulwoman/infra"

# -------------------------------------------------------------------
# HARDWARE
# -------------------------------------------------------------------
hardware_apple_bluetooth: false
hardware_apple_wifi: false
hardware_apple_wifi_interface: en1

# -------------------------------------------------------------------
# CHATTERBOX
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# MONITORING
# pocket-tts is a LAN-only Wyoming/TCP service with no cname (it isn't
# HTTP, and isn't a composition), so it's invisible to
# composition-gatus's cname-derived endpoints. List it explicitly here —
# the same escape hatch cnames_additional provides elsewhere for HTTP
# services with no owning composition.
# Port must match system_pocket_tts_port in roles/system-tts-pocket-tts.
# -------------------------------------------------------------------
tcp_monitors_additional:
  - name: pocket-tts
    host: "{{ host_ipv4 }}"
    port: 10222

# -------------------------------------------------------------------
# OLLAMA
# -------------------------------------------------------------------
system_ollama_env:
  OLLAMA_HOST: "0.0.0.0:11434"
  OLLAMA_NUM_PARALLEL: 4
  OLLAMA_MAX_LOADED_MODELS: 4
  OLLAMA_ORIGINS: "*"
  OLLAMA_CONTEXT_LENGTH: 8192
  OLLAMA_KEEP_ALIVE: -1 # Keep models loaded indefinitely
  OLLAMA_FLASH_ATTENTION: 1 # Reduce VRAM usage at the cost of some speed
  OLLAMA_KV_CACHE_TYPE: q8_0 # f16 (default), q8_0, q4_0

system_ollama_models:
  - "{{ llm_default_model }}"
  # Used by composition-translation-server on storage.
  - "translategemma:4b"
  # Embeddings for composition-agentmemory (semantic recall), local on malcolm.
  - "embeddinggemma"
  # The Ollama Cloud catalogue (https://ollama.com/search?c=cloud), offered to
  # opencode on camina, which offers whatever /api/tags returns. Each :cloud
  # tag is a ~300-byte manifest: the weights stay on Ollama Cloud and malcolm's
  # own sign-in proxies every request. One entry per family, preferring the
  # generic :cloud alias, so the model picker does not show one model twice.
  # gemma4 (31b) is covered by llm_default_model above.
  - "beam:cloud"
  # Decision-only: pulled for completeness, never offered by opencode.
  - "clef:cloud"
  - "deepseek-v4.1-flash:cloud"
  - "deepseek-v4-pro:cloud"
  - "glm-5.2:cloud"
  - "glm-5.3:cloud"
  - "glm-5.3-flash:cloud"
  - "gpt-oss:20b-cloud"
  - "gpt-oss:120b-cloud"
  - "inkling-2-small:cloud"
  - "kimi-k2.6:cloud"
  - "kimi-k2.7-code:cloud"
  - "kimi-k3:cloud"
  - "kimi-k3.1-pro:cloud"
  - "mimo-v2.6-flash:cloud"
  - "mimo-v2.6-pro:cloud"
  - "minimax-m3:cloud"
  - "minimax-m3.1-flash:cloud"
  - "mistral-large-4:cloud"
  - "muse-spark-open:cloud"
  - "nemotron-3-super:cloud"
  - "nemotron-3-ultra:cloud"
  # TTS (meta#23): dedicated models, one per language. phonon (English,
  # Apache 2.0) carries the US/UK/character voices; phonon:40m-de is German,
  # CC BY-NC 4.0 (non-commercial) — fine for home use.
  - "phonon"
  - "phonon:40m-de"

# -------------------------------------------------------------------
# CLAUDE
# -------------------------------------------------------------------
system_claude_settings_group: "staff"
system_claude_profile_file: ".zshrc"

# -------------------------------------------------------------------
# SYNCTHING
# Native (system-syncthing-macos), outside ~/Documents so the launchd agent
# isn't blocked by TCC. Desktop Obsidian opens the vaults from here and
# bridges them to Obsidian Sync for the iPhone (system-obsidian-desktop).
# camina reaches the API directly; Syncthing serves a self-signed cert.
# -------------------------------------------------------------------
syncthing_folder_root: "/Users/{{ vault_server_username }}/Syncthing"
syncthing_api_url: "https://{{ host_fqdn }}:8384"
syncthing_api_validate_certs: false

# -------------------------------------------------------------------
# APPLE REMINDERS SERVER
# -------------------------------------------------------------------
# Login-keychain password, used only to headlessly provision the code-signing
# cert that keeps the Reminders TCC grant stable. On macOS the login keychain is
# unlocked with the account login password — the same secret already used for
# ansible_become_password above.
system_apple_reminders_server_keychain_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# APPLE CALENDAR SERVER
# -------------------------------------------------------------------
# Same login-keychain password, for the calendar server's own signing cert.
system_apple_calendar_server_keychain_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# APPLE CONTACTS SERVER
# -------------------------------------------------------------------
# Same login-keychain password, for the contacts server's own signing cert.
system_apple_contacts_server_keychain_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# HOMEBREW
# -------------------------------------------------------------------
system_homebrew_formulae:
  - jq
  - git
  - watch
  - direnv
  - ffmpeg
  - macmon
  - wget
  - herdr
  - pocket-tts

system_homebrew_casks:
  - obsidian
