# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: raspberry-pi4-2gb-deedee
host_name_medium: pi-deedee
host_name_short: deedee
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Runs infrastructure tasks"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.2
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.2
host_primary_interface: "eth0"
host_mac: "e4:5f:01:7e:4a:4e"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
ansible_user: "{{ vault_server_username }}"

# -------------------------------------------------------------------
# HARDWARE
# -------------------------------------------------------------------
raspberry_pi_wifi: false
raspberry_pi_bluetooth: false
raspberry_pi_boot_config_location: /boot/firmware/config.txt

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: false

# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------

zfs:
  fastpool:
    vdevs:
      - type: stripe
        disks: "/dev/disk/by-id/usb-USB_SanDisk_3.2Gen1_0101085aa99be2f8a662a41def4f69ad14c549ec7c1478b16ee8f5755444f2bb6e040000000000000000000042340285ff0c2b009155810791aaab60-0:0"
    datasets:
      compositions:
        policy: critical
        children_inherit_policy: true
        snapshots_discover_children: true
        datasets:
          awfulwoman:
            policy: none
          container-management:
            policy: none
          reverseproxy:
            policy: none
      acme:
        policy: critical
      terraform:
        policy: critical
      claude:
        policy: critical
      repos:
        policy: critical

# -------------------------------------------------------------------
# MISC
# -------------------------------------------------------------------

acme_path: "/fastpool/acme"
terraform_working_dir: "/fastpool/terraform"

# -------------------------------------------------------------------
# COMPOSITIONS
# -------------------------------------------------------------------
# #271 - internal wildcard cert rollout: was already ACME-off with no
# wildcard set (leaving Traefik's own self-signed fallback in place until
# now).
reverseproxy_use_letsencrypt: false
reverseproxy_wildcard_cert: true
traefik_providers:
  - wildcard-cert

# -------------------------------------------------------------------
# AUTOMATION INFRA
# -------------------------------------------------------------------
automation_infra_ansible_playbook_bin: /fastpool/repos/infra/.venv/bin/ansible-playbook

# -------------------------------------------------------------------
# CLAUDE
# -------------------------------------------------------------------
system_claude_settings_path: "/fastpool/claude/settings"

# -------------------------------------------------------------------
# APT
# -------------------------------------------------------------------
# bootstrap_ubuntu_apt_packages_extra:
#   - terraform

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_healthchecksio_enabled: true
system_zfs_policy_mqtt_enabled: true

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named) instead of a hand-maintained cnames: list.
# reverseproxy's default labels (whoami/traefik) are suppressed here: they
# were never actually registered as cnames for this host, and exposing a
# Traefik dashboard/debug endpoint should be a deliberate call, not a side
# effect of this migration.
# -------------------------------------------------------------------
compositions:
  - composition: reverseproxy
    labels: []
  - container-management
  - zfs-api
