# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: server-64gb-storage
host_name_medium: server-storage
host_name_short: storage
host_description: "Central storage device"
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.116
host_primary_interface: "enp3s0"
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.116
host_mac: "34:60:f9:bb:3d:16"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}" # How to access the host
ansible_user: "{{ vault_server_username }}" # Account to connect as
ansible_become_password: "{{ vault_password }}" # Account password (for sudo)

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: true

# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------
zfs:
  fastpool:
    pool_properties: {}
    # SATA SSDs, so Ubuntu's monthly TRIM cron skips this pool unless opted in.
    root_dataset_properties:
      "org.debian:periodic-trim": enable
    vdevs:
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_CT1000BX500SSD1_2216E629AC18
          - /dev/disk/by-id/scsi-SATA_SanDisk_SDSSDH3_22087N455301
    datasets:
      compositions:
        # Every composition states its own policy; see ADR-0001. The parent
        # stays low so anything Docker creates and nobody declared is
        # snapshotted briefly and never replicated.
        policy: low
        snapshots_discover_children: true
        datasets:
          # Irreplaceable: the originals, the scans, the money and the mail.
          immich:
            policy: critical
          paperless-ngx:
            policy: critical
          finances:
            policy: critical
          karakeep:
            policy: critical
          # Holds mail that has been deleted server-side and exists nowhere
          # else. See meta#6.
          mail-archive-server:
            policy: critical

          # Worth a second copy, but GitHub, the fediverse or a re-sync
          # already holds a version of it.
          gitea:
            policy: high
          audiobookshelf:
            policy: high
          syncthing:
            policy: high
          matrix:
            policy: high
          freshrss:
            policy: high
          gotosocial:
            policy: high
          n8n:
            policy: high
          memorybank:
            policy: high
          gateway:
            policy: high
          vikunja:
            policy: high
          github2karakeep:
            policy: high

          # A monitoring history database is rewritten constantly, so every
          # snapshot pins a fresh copy of the whole file. Peekaping's 326M
          # of data had accumulated 10.2G across 45 critical-policy
          # snapshots. The history is not worth that, so: fewer copies.
          gatus:
            policy: low
          # Same shape as gatus: small live data, constant rewrites.
          logtide:
            policy: low
          loki:
            policy: low
          victoriametrics:
            policy: low
          scrutiny:
            policy: low
          # Rebuildable from OSM extracts, and the largest thing on the pool.
          nominatim:
            policy: low
          # Metadata and cache. A rebuild re-scans the library.
          jellyfin:
            policy: low
          downloads:
            policy: low
          tubesync:
            policy: low
          podderton:
            policy: low
          jarvis:
            policy: low
          nabu:
            policy: low
          reverseproxy:
            policy: low

          # Rebuilt by Ansible, or re-downloaded. Nothing here is state.
          zfs-api:
            policy: none
          logtide-agent:
            policy: none
          container-management:
            policy: none
          gitea-runners:
            policy: none
          llm-inference-calculator:
            policy: none
          homepage:
            policy: none
          piper:
            policy: none
          libretranslate:
            policy: none
          kiwix:
            policy: none
          searxng:
            policy: none
          mcp-kagisearch:
            policy: none
          # Named for composition_name in composition-mcp-openzim.
          openzim-mcp:
            policy: none
          mcp-searxng:
            policy: none
          mcp-weather:
            policy: none
      shared:
        datasets:
          nominatim:
  slowpool:
    vdevs:
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_ST16000NT001-3LV_ZR61CRHS
          - /dev/disk/by-id/scsi-SATA_WDC_WD160EDGZ-11_3ZG3X08J
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_WDC_WD40EFZX-68A_WD-WX12DA0R1V78
          - /dev/disk/by-id/scsi-SATA_WDC_WD40EFZX-68A_WD-WX82DA1RHH08
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_ST4000VN008-2DR1_ZDHB6E35
          - /dev/disk/by-id/scsi-SATA_ST4000VN008-2DR1_ZDHB880S
      - type: mirror
        disks:
          - "/dev/disk/by-id/{{ vault_ironwolfpro_16tb_alpha }}"
          - "/dev/disk/by-id/{{ vault_ironwolfpro_16tb_beta }}"
    datasets:
      shared:
        datasets:
          zim:
            policy: high
          documents:
            policy: critical
            datasets:
              # Holds 18.8M of this dataset's 19.1M: the documents themselves.
              # With no stated policy it resolved to none, so it was never
              # snapshotted and could never be replicated, while its parent
              # was faithfully backed up holding almost nothing.
              paperless-ngx:
                policy: critical
          models:
            policy: high
          photos:
            policy: critical
          syncthing:
          logs:
            datasets:
              loki:
                policy: high
                extra_zfs_properties:
                  compression: lz4
                  recordsize: 128K
          metrics:
            datasets:
              zfs:
                policy: high
          media:
            datasets:
              shows:
                policy: low
              movies:
                policy: low
              music:
                policy: critical
              books:
                policy: critical
              audiobooks:
                policy: critical
              downloads:
                datasets:
                  torrents:
              podcasts:
                policy: critical
              youtube:
      charlie:
        policy: none
        datasets:
          syncthing:
            policy: critical
          photos:
            policy: critical
          financial:
            policy: critical

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_mqtt_enabled: true
system_zfs_policy_healthchecksio_enabled: true

# -------------------------------------------------------------------
# MAIL ARCHIVE
#
# IMAP accounts synced and indexed by composition-mail-archive-server
# (system-emailbackup was retired 2026-09-18, awfulwoman/meta#9; its old
# Maildir stays at /slowpool/charlie/email as a historical copy).
#
# `name` is the account's Maildir directory and its name in the archive API:
# never rename `personal` — that re-downloads ~29k messages and orphans the
# old copy.
# -------------------------------------------------------------------
charlie_email_accounts:
  - name: personal
    host: "imap.{{ vault_mailprovider_domain }}"
    username: "{{ vault_mailprovider_user }}"
    password: "{{ vault_mailprovider_password }}"
  # Gmail App Passwords are shown and often stored as "xxxx xxxx xxxx xxxx";
  # Google accepts them without the spaces, and mbsync's config parser rejects
  # an unquoted value containing spaces (it fails the whole file, taking every
  # account down, not just this one) — hence replace(' ', '').
  #
  # patterns excludes Gmail's [Gmail]/All Mail, which mirrors every message in
  # every other folder — without it each message is archived twice. Confirm the
  # exact folder name per account once credentials exist: older UK accounts
  # present it as [Google Mail]/All Mail, and the pattern is a literal match.
  - name: gmail_seuk
    host: imap.gmail.com
    username: "{{ vault_gmail_seuk_username }}"
    password: "{{ vault_gmail_seuk_app_password | replace(' ', '') }}"
    patterns: '* !"[Gmail]/All Mail"'
  - name: gmail_taw
    host: imap.gmail.com
    username: "{{ vault_gmail_taw_username }}"
    password: "{{ vault_gmail_taw_app_password | replace(' ', '') }}"
    patterns: '* !"[Gmail]/All Mail"'
  - name: gmail_se
    host: imap.gmail.com
    username: "{{ vault_gmail_se_username }}"
    password: "{{ vault_gmail_se_app_password | replace(' ', '') }}"
    patterns: '* !"[Gmail]/All Mail"'
  - name: shared
    host: "imap.{{ vault_mailprovider_domain }}"
    username: "{{ vault_mail_shared_username }}"
    password: "{{ vault_mail_shared_password }}"

composition_mail_archive_server_imap_accounts: "{{ charlie_email_accounts }}"

# -------------------------------------------------------------------
# REVERSEPROXY (#271 - internal wildcard cert rollout)
# gotosocial/awfulwoman.com are terminated by public01's Traefik, which
# reverse-proxies to this host's container ports directly - storage's own
# Traefik has no genuinely public router, so no scoped ACME exception
# is needed here (unlike public01, see #271).
# -------------------------------------------------------------------
reverseproxy_use_letsencrypt: false
reverseproxy_wildcard_cert: true
traefik_providers:
  - wildcard-cert

# -------------------------------------------------------------------
# OBSIDIAN
# -------------------------------------------------------------------
system_obsidian_headless_vaults:
  - name: "Charlie"
    path: "{{ ansible_facts['user_dir'] }}/obsidian-vaults/Charlie"
    password: "{{ vault_obsidian_vault_key }}"

# -------------------------------------------------------------------
# MCP GATEWAY
# -------------------------------------------------------------------
composition_gateway_obsidian_vault_path: "{{ ansible_facts['user_dir'] }}/obsidian-vaults/Charlie"

# -------------------------------------------------------------------
# MISC
# -------------------------------------------------------------------
# Media storage
shared_media_path: /slowpool/shared/media

paperless_ngx_translate_media_path: "/slowpool/shared/documents/paperless-ngx"

# -------------------------------------------------------------------
# NFS
# -------------------------------------------------------------------
zfs_nfs_exports:
  - dataset: slowpool/shared/media
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"
  - dataset: slowpool/charlie/photos
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"
  - dataset: slowpool/shared/models
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"

# -------------------------------------------------------------------
# CNAMES ADDITIONAL
# wallabag and musicassistant have no composition-* role on this host today
# (dangling — the services predate or outlived their role), so there's
# nothing for the dns_records filter to derive them from. A permanent,
# narrow escape hatch for names with no owning composition — not the main
# mechanism, which is the compositions: list below.
# -------------------------------------------------------------------
cnames_additional:
  - musicassistant.{{ domainname_infra }}

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named), for every composition except the two above.
# Overrides below all reproduce exactly what's live today:
#   - reverseproxy: only traefik-{host} was ever registered, never whoami.
#     (Originally traefik.<pfqdn>, an older multi-label format - updated to
#     the single-label traefik-{host} default in #271, since a *.ewwww.eu
#     wildcard cert can't cover a multi-level name.)
#   - mcp-openzim: its declared default was never registered here.
#   - nabu, jarvis: composition_dns_subdomains: [] on their own roles -
#     neither name resolves via any mechanism today despite both having
#     their own Traefik routing already templated (confirmed empirically
#     before splitting composition-chives into these two roles). Preserved
#     exactly as-is; giving them real DNS is a separate, deliberate decision
#     for later, not a side effect of this refactor.
# jellyfin-vue has NO override: it's declared by the jellyfin composition but
# was missing from the old hand-written list — the exact drift #262 exists
# to fix, so it's allowed to appear now that derivation is authoritative.
# -------------------------------------------------------------------
compositions:
  - zfs-api
  - scrutiny
  - victoriametrics
  - composition: loki
    state: absent
  - logtide
  - logtide-agent
  - composition: reverseproxy
    labels:
      - "traefik-{{ host_name }}"
  - container-management
  - github2karakeep
  - finances
  - gitea
  - gitea-runners
  - jellyfin
  - immich
  - llm-inference-calculator
  - audiobookshelf
  - downloads
  - syncthing
  - karakeep
  - matrix
  - freshrss
  - tubesync
  - podderton
  - homepage
  - piper
  - gotosocial
  - libretranslate
  - n8n
  - memorybank
  - mail-archive-server
  - gateway
  - paperless-ngx
  - vikunja
  - gatus
  - mcp-kagisearch
  - composition: mcp-openzim
    labels: []
  - searxng
  - mcp-searxng
  - mcp-weather
  - kiwix
  - nabu
  - jarvis
  - nominatim
