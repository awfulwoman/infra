# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: server-64gb-storage
host_name_medium: server-storage
host_name_short: storage
host_description: "Central storage device"
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.116
host_primary_interface: "enp3s0"
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.116
host_mac: "34:60:f9:bb:3d:16"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}" # How to access the host
ansible_user: "{{ vault_server_username }}" # Account to connect as
ansible_become_password: "{{ vault_password }}" # Account password (for sudo)

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: true

# -------------------------------------------------------------------
# ZFS
# -------------------------------------------------------------------
zfs:
  fastpool:
    pool_properties: {}
    vdevs:
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_CT1000BX500SSD1_2216E629AC18
          - /dev/disk/by-id/scsi-SATA_SanDisk_SDSSDH3_22087N455301
    datasets:
      compositions:
        policy: critical
        snapshots_discover_children: true
        datasets: {}
      shared:
        datasets:
          nominatim:
      pools:
        datasets:
          vms:
            policy: critical
            datasets:
              vm-claude-dev:
                policy: critical
              vm-homeassistant:
                policy: critical
              vm-downloads:
                policy: critical
              vm-media:
                policy: critical
  slowpool:
    vdevs:
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_ST16000NT001-3LV_ZR61CRHS
          - /dev/disk/by-id/scsi-SATA_WDC_WD40EFZX-68A_WD-WX12DA08KR45
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_WDC_WD40EFZX-68A_WD-WX12DA0R1V78
          - /dev/disk/by-id/scsi-SATA_WDC_WD40EFZX-68A_WD-WX82DA1RHH08
      - type: mirror
        disks:
          - /dev/disk/by-id/scsi-SATA_ST4000VN008-2DR1_ZDHB6E35
          - /dev/disk/by-id/scsi-SATA_ST4000VN008-2DR1_ZDHB880S
      - type: mirror
        disks:
          - "/dev/disk/by-id/{{ vault_ironwolfpro_16tb_alpha }}"
          - "/dev/disk/by-id/{{ vault_ironwolfpro_16tb_beta }}"
    datasets:
      shared:
        datasets:
          zim:
            policy: high
          documents:
            policy: critical
            datasets:
              paperless-ngx:
          models:
            policy: high
          photos:
            policy: critical
          syncthing:
          logs:
            datasets:
              loki:
                policy: high
                extra_zfs_properties:
                  compression: lz4
                  recordsize: 128K
          metrics:
            datasets:
              zfs:
                policy: high
          media:
            datasets:
              shows:
                policy: low
              movies:
                policy: low
              music:
                policy: critical
              books:
                policy: critical
              audiobooks:
                policy: critical
              downloads:
                datasets:
                  torrents:
              podcasts:
                policy: critical
              youtube:
      charlie:
        policy: none
        datasets:
          syncthing:
            policy: critical
          photos:
            policy: critical
          email:
            policy: critical

# -------------------------------------------------------------------
# ZFS POLICY
# -------------------------------------------------------------------
system_zfs_policy_mqtt_enabled: true
system_zfs_policy_healthchecksio_enabled: true

# -------------------------------------------------------------------
# OBSIDIAN
# -------------------------------------------------------------------
system_obsidian_headless_vaults:
  - name: "Charlie"
    path: "{{ ansible_facts['user_dir'] }}/obsidian-vaults/Charlie"
    password: "{{ vault_obsidian_vault_key }}"

# -------------------------------------------------------------------
# MCP GATEWAY
# -------------------------------------------------------------------
composition_gateway_obsidian_vault_path: "{{ ansible_facts['user_dir'] }}/obsidian-vaults/Charlie"

# -------------------------------------------------------------------
# MISC
# -------------------------------------------------------------------
# Media storage
shared_media_path: /slowpool/shared/media

paperless_ngx_translate_media_path: "/slowpool/shared/documents/paperless-ngx"

# -------------------------------------------------------------------
# NFS
# -------------------------------------------------------------------
zfs_nfs_exports:
  - dataset: slowpool/shared/media
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"
  - dataset: slowpool/charlie/photos
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"
  - dataset: slowpool/shared/models
    options: "rw=100.64.0.0/10:192.168.1.0/24:192.168.122.0/24,anonuid=1000,anongid=1000,no_root_squash,all_squash"

# -------------------------------------------------------------------
# CNAMES
# wallabag and musicassistant have no composition-* role on this host today
# (dangling — the services predate or outlived their role), so there's
# nothing for the dns_records filter to derive them from. Left hand-written
# rather than silently dropped, which would be a real regression, not a
# no-op — both resolve correctly today via this list.
# -------------------------------------------------------------------
cnames:
  - musicassistant.{{ domainname_infra }}
  - wallabag.{{ domainname_infra }}

# -------------------------------------------------------------------
# COMPOSITIONS
# Internal DNS for this host is derived from this list by the dns_records
# filter (roles/infra-named), for every composition except the two above.
# Overrides below all reproduce exactly what's live today:
#   - reverseproxy: only traefik.<pfqdn> was ever registered (a different,
#     older format than the {host}-based default), never whoami.
#   - syncthing: the live cname predates the {host}-suffixed default.
#   - uptime-kuma: only the UI was registered, never -api.
#   - kiwix, mcp-openzim: their declared defaults were never registered here.
# chives (nabu/jarvis) isn't in this list at all: it has no default
# composition_name (every other role's composition_name matches its own
# name; chives has neither, supplying a different one at each of its two
# invocations) and no default subdomains — nabu/jarvis are exposed only via
# their own self-registration task, unrelated to this list or the internal
# zone. Folding it into this generic loop would mean giving every other
# composition an explicit composition_name too (vars: can't conditionally
# omit a key the way module parameters can via omit — confirmed by testing),
# which would silently override composition-mcp-openzim's real
# composition_name (openzim-mcp) to the wrong value. Kept as its own two
# tasks in the playbook instead, unchanged from the old static role entries.
# jellyfin-vue has NO override: it's declared by the jellyfin composition but
# was missing from the old hand-written list — the exact drift #262 exists
# to fix, so it's allowed to appear now that derivation is authoritative.
# -------------------------------------------------------------------
compositions:
  - zfs-api
  - victoriametrics
  - loki
  - composition: reverseproxy
    labels:
      - "traefik.{{ host_pfqdn }}"
  - container-management
  - github2karakeep
  - finances
  - gitea
  - gitea-runners
  - jellyfin
  - immich
  - llm-inference-calculator
  - audiobookshelf
  - downloads
  - composition: syncthing
    labels: [syncthing]
  - karakeep
  - freshrss
  - tubesync
  - homepage
  - piper
  - gotosocial
  - libretranslate
  - n8n
  - memorybank
  - gateway
  - paperless-ngx
  - vikunja
  - composition: uptime-kuma
    labels: [uptime-kuma]
  - mcp-kagisearch
  - composition: mcp-openzim
    labels: []
  - searxng
  - mcp-searxng
  - composition: kiwix
    labels: []
  # chives (nabu/jarvis) is deliberately NOT in this list — see the playbook.
  - open-webui
  - nominatim
