# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: minipc-8gb-camina
host_name_medium: minipc-camina
host_name_short: camina
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Control node — Ansible controller and loopback-only 1Password Connect host"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.23
host_primary_interface: "enp1s0"
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.23
host_mac: "6c:2b:59:65:a8:53"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
ansible_user: "{{ vault_server_username }}"
ansible_become_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: true

# -------------------------------------------------------------------
# REPOS
# Cloned so automation-infra and ansible-core have a local checkout to
# run playbooks and install Galaxy dependencies from.
# -------------------------------------------------------------------
system_repos:
  - repo: awfulwoman/infra
    deploy_key: true

# -------------------------------------------------------------------
# ZFS
# fastpool: the third partition of the internal 256GB SATA SSD as a
# single-disk stripe vdev — no redundancy. Same layout as homebrain:
# part1 /boot/efi, part2 /, part3 fastpool. The Wyse 5070 implements a
# single SATA port, so the OS and the pool necessarily share one device.
#
# It carries the compositions dataset, so the 1Password Connect config
# and (via onepassword_connect_data_bind_mount below) its sync database
# sit on ZFS.
# -------------------------------------------------------------------
zfs_pools_create: true
zfs:
  fastpool:
    vdevs:
      - type: stripe
        disks: /dev/disk/by-id/scsi-SATA_Intenso_SSD_Sata_AA000000000000005228-part3
    datasets:
      compositions:
        policy: critical
        children_inherit_policy: true
        snapshots_discover_children: true

# -------------------------------------------------------------------
# REVERSEPROXY
# Serves the client-cert-distribution wildcard rather than running its own
# ACME: camina is not reachable from the internet, so an HTTP-01 challenge
# here cannot complete. Same arrangement as randolph (#270).
#
# Nothing behind it routes yet — it was added for a composition since removed,
# and kept for whatever lands here next. Only `traefik-{host}` is registered.
# Camina publishes no other host ports, so 80 and 443 are free.
# -------------------------------------------------------------------
reverseproxy_use_letsencrypt: false
reverseproxy_wildcard_cert: true
traefik_providers:
  - wildcard-cert

# -------------------------------------------------------------------
# COMPOSITIONS
# Connect publishes no host port, so the API is reachable only from the
# shared Docker network. Its compose file carries Traefik router labels and
# camina now runs a Traefik, so that router exists — but nothing routes to
# it, because `labels: []` suppresses the role default
# `composition_dns_subdomains: [connect]`, so no CNAME is derived. Randolph
# still owns `connect` until its cutover.
#
# onepassword_connect_data_bind_mount: keep the sync database on fastpool
# (bind mount at {{ composition_config }}/data) instead of a Docker named
# volume on the OS drive.
# -------------------------------------------------------------------
onepassword_connect_data_bind_mount: true
compositions:
  - composition: 1password-connect
    labels: []
  - composition: reverseproxy
    labels:
      - "traefik-{host}"
