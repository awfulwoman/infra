# -------------------------------------------------------------------
# IDENTITY
# -------------------------------------------------------------------
host_type: baremetal
host_name: minipc-8gb-camina
host_name_medium: minipc-camina
host_name_short: camina
host_region: ber
host_site: xberg
host_pfqdn: "{{ host_name }}.{{ host_site }}.{{ host_region }}"
host_fqdn: "{{ host_pfqdn }}.{{ domainname_infra }}"
host_description: "Control node — Ansible controller and loopback-only 1Password Connect host"

# -------------------------------------------------------------------
# NETWORK
# Hint: Use `network_netplan_config:` for more fine-grained control
# Docs: roles/network-netplan/README.md
# -------------------------------------------------------------------
host_ipv4: 192.168.1.120
host_primary_interface: "enp1s0"
host_ipv4_subnet: 24
host_tailscale_ipv4: 100.80.1.120
host_mac: "6c:2b:59:65:a8:53"

# -------------------------------------------------------------------
# ANSIBLE
# -------------------------------------------------------------------
ansible_host: "{{ host_ipv4 }}"
ansible_user: "{{ vault_server_username }}"
ansible_become_password: "{{ vault_password }}"

# -------------------------------------------------------------------
# UBUNTUPRO
# -------------------------------------------------------------------
ubuntupro_attach: true

# -------------------------------------------------------------------
# REPOS
# Cloned so automation-infra and ansible-core have a local checkout to
# run playbooks and install Galaxy dependencies from.
# -------------------------------------------------------------------
system_repos:
  - repo: awfulwoman/infra

# -------------------------------------------------------------------
# ZFS
# fastpool: one 238GB USB SSD (JMicron enclosure) as a single-disk
# stripe vdev — no redundancy. It carries the compositions dataset, so
# the 1Password Connect config and (via onepassword_connect_data_bind_mount
# below) its sync database sit on ZFS, off the 64GB OS drive. The by-id
# path uses the enclosure's generic serial; do not attach a second
# generic JMicron enclosure to this host.
# -------------------------------------------------------------------
zfs_pools_create: true
zfs:
  fastpool:
    vdevs:
      - type: stripe
        disks: /dev/disk/by-id/usb-JMicron_Generic_0123456789ABCDEF-0:0
    datasets:
      compositions:
        policy: critical
        children_inherit_policy: true
        snapshots_discover_children: true

# -------------------------------------------------------------------
# COMPOSITIONS
# Connect publishes no host port and camina runs no Traefik, so the API is
# reachable only from the shared Docker network. The compose file still
# carries Traefik router labels, but they are inert here. `labels: []`
# suppresses the role default `composition_dns_subdomains: [connect]`, so no
# CNAME is derived — randolph still owns `connect` until its cutover.
#
# onepassword_connect_data_bind_mount: keep the sync database on fastpool
# (bind mount at {{ composition_config }}/data) instead of a Docker named
# volume on the OS drive.
# -------------------------------------------------------------------
onepassword_connect_data_bind_mount: true
compositions:
  - composition: 1password-connect
    labels: []
