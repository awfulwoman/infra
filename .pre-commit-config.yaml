repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^roles/.*/templates/.*\.yaml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: validate-dns-records
        name: Validate derived DNS records (no duplicate labels)
        entry: scripts/validate-dns-records.sh
        language: system
        pass_filenames: false
        files: ^(inventory/|plugins/filters/dns_records\.py)
      - id: validate-zfs-policies
        name: Validate ZFS policy declarations
        entry: scripts/validate-zfs-policies.sh
        language: system
        pass_filenames: false
        files: ^(inventory/|plugins/filters/zfs_datasets\.py)
      - id: domain-guard
        name: Keep private domain names out of commits
        # The names live in a file outside the repo (written by Ansible from the
        # vault), so they are never committed. Without that file the hook only
        # warns, which keeps this config usable in an isolated VM or container.
        language: system
        entry: >-
          bash -c 'f="${DOMAIN_GUARD_FILE:-$HOME/.config/domain-guard/domains}";
          [ -s "$f" ] || { echo "domain-guard: no domain list at $f, skipping" >&2; exit 0; };
          hits=$(grep -I -i -F -l -f "$f" -- "$@");
          [ -z "$hits" ] || { printf "domain-guard: a private domain name appears in:\n%s\nUse the Ansible variable or a placeholder instead.\n" "$hits"; exit 1; }'
          domain-guard
