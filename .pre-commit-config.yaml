repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^roles/.*/templates/.*\.yaml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: validate-dns-records
        name: Validate derived DNS records (no duplicate labels)
        entry: scripts/validate-dns-records.sh
        language: system
        pass_filenames: false
        files: ^(inventory/|plugins/filters/dns_records\.py)
