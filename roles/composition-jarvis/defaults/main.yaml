# Composition name (used by composition-common dependency)
composition_name: jarvis

composition_dns_subdomains:
  - jarvis

# Ollama-compatible port for direct LAN/Tailscale clients (e.g. Home
# Assistant's Ollama integration) that expect the standard Ollama port
# rather than the Traefik-routed hostname. nabu already claims 11434 on
# the shared host, so jarvis takes the next one up.
composition_jarvis_openai_port: 11435

composition_jarvis_llm_base_url: "{{ llm_default_openai_uri }}"
composition_jarvis_llm_model: "{{ llm_default_model }}"
composition_jarvis_llm_api_key: "ollama"

composition_jarvis_event_reminder_minutes: 15
composition_jarvis_idle_checkin_hours: 0

# Telegram is what makes this instance "jarvis" rather than a second nabu -
# real, not optional, unlike composition_nabu_telegram_token.
composition_jarvis_telegram_token: "{{ vault_chives_telegram_token }}"
composition_jarvis_telegram_chat_id: "{{ vault_chives_telegram_chat_id }}"

# Profile markdown editor at /editor is optional — leave blank to disable
composition_jarvis_editor_username: "charlie"
composition_jarvis_editor_password: "{{ vault_jarvis_editor_password }}"

composition_jarvis_mcps:
  - url: "http://gateway:4000/mcp" # on same host
    auth_key: "{{ vault_gateway_mcp_token }}"
  - url: "http://mcp-searxng:3000/mcp" # on same host
    auth_key: "{{ vault_mcp_searxng_auth_token }}"
  - url: "http://mcp-weather:8000/mcp"

# Home Assistant MCP. Appended to the list above by config.yaml.j2, not listed
# in it, so an empty token drops the server from config.yaml entirely.
#
# The path must be /api/mcp - HA's Streamable HTTP endpoint. Do NOT copy
# /mcp_server/sse from composition-hermes-*: that is the legacy HTTP+SSE
# transport, which opens a GET stream and then POSTs to a session URL read
# back off it. Chives' MCP client only POSTs JSON-RPC to one fixed URL, and HA
# answers POST /mcp_server/sse with 405. Both endpoints front the same tools.
#
# The token is a long-lived HA access token minted for this bot alone, so it
# can be revoked without touching nabu's or either hermes bot's. Chives sends
# auth_key as `Authorization: Bearer`, which is what HA wants.
composition_jarvis_homeassistant_url: "https://homeassistant.{{ domainname_infra }}/api/mcp"
composition_jarvis_homeassistant_token: "{{ vault_chives_jarvis_homeassistant_token | default('') }}"
