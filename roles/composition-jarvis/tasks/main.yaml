# code: language=ansible

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: "Create config.yaml"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ composition_config }}/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create state directory"
  ansible.builtin.file:
    path: "{{ composition_config }}/state"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: "Create profile directory"
  ansible.builtin.file:
    path: "{{ composition_config }}/profile"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Seeds the default profile from github.com/awfulwoman/chives/tree/main/profile.
# force: false means an existing file (including one edited via /editor) is
# never overwritten - this only fills in what's missing.
- name: "Seed default profile files"
  ansible.builtin.copy:
    src: "profile/{{ profile_file }}"
    dest: "{{ composition_config }}/profile/{{ profile_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    force: false
  loop:
    - CHECKIN.md
    - PERSONALITY.md
    - PROTOCOLS.md
    - USER.md
  loop_control:
    loop_var: profile_file

- name: "Start Docker Compose project"
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: always
    remove_orphans: true
  notify: Restart Traefik
