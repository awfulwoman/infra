# code: language=ansible

- name: Obtain a Tailscale API token
  ansible.builtin.include_role:
    name: network-tailscale-token

- name: Generate one-time Tailscale auth key
  ansible.builtin.uri:
    url: "{{ tailscale_api_base }}/tailnet/-/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_api_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: "{{ tailscale_node_tags }}"
      expirySeconds: "{{ tailscale_authkey_expiry_seconds | int }}"
    status_code: 200
  register: tailscale_key_response
  no_log: true

- name: Set tailscale_authkey fact
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ tailscale_key_response.json.key }}"
  no_log: true
