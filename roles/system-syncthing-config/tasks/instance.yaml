# code: language=ansible
---
- name: "Derive config for {{ _syncthing_host }}"
  ansible.builtin.set_fact:
    _syncthing_url: "{{ _syncthing_peers[_syncthing_host].url }}"
    _syncthing_validate: "{{ _syncthing_peers[_syncthing_host].validate_certs }}"
    _syncthing_config: >-
      {{ syncthing_folders | syncthing_host_config(_syncthing_peers, _syncthing_host,
         _syncthing_peers[_syncthing_host].folder_root) }}

- name: "Apply devices on {{ _syncthing_host }}"
  ansible.builtin.include_tasks: object.yaml
  vars:
    _kind: device
    _key: "{{ item.deviceID }}"
  loop: "{{ _syncthing_config.devices }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Apply folders on {{ _syncthing_host }}"
  ansible.builtin.include_tasks: object.yaml
  vars:
    _kind: folder
    _key: "{{ item.id }}"
  loop: "{{ _syncthing_config.folders }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Read ignore patterns on {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/db/ignores?folder={{ item.key }}"
    validate_certs: "{{ _syncthing_validate }}"
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
  register: _syncthing_ignores
  loop: "{{ _syncthing_config.ignores | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "Apply ignore patterns on {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/db/ignores?folder={{ item.item.key }}"
    method: POST
    validate_certs: "{{ _syncthing_validate }}"
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
    body_format: json
    body:
      ignore: "{{ item.item.value }}"
  changed_when: true
  when: (item.json.ignore or []) != item.item.value
  loop: "{{ _syncthing_ignores.results }}"
  loop_control:
    label: "{{ item.item.key }}"

# The API key bypasses GUI auth, so a request with only basic auth tells us
# whether the declared login already works. The stored password is a bcrypt
# hash, so comparing config would never match.
- name: "Check web UI login on {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/system/ping"
    validate_certs: "{{ _syncthing_validate }}"
    url_username: "{{ syncthing_gui_user }}"
    url_password: "{{ syncthing_gui_password }}"
    force_basic_auth: true
    status_code: [200, 401, 403]
  register: _syncthing_login
  no_log: true

# Syncthing bcrypt-hashes a plaintext password it receives through the API.
- name: "Set web UI login on {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/config/gui"
    method: PATCH
    validate_certs: "{{ _syncthing_validate }}"
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
    body_format: json
    body:
      user: "{{ syncthing_gui_user }}"
      password: "{{ syncthing_gui_password }}"
  changed_when: true
  when: _syncthing_login.status != 200
  no_log: true

- name: "Check restart-required on {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/config/restart-required"
    validate_certs: "{{ _syncthing_validate }}"
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
  register: _syncthing_restart

- name: "Restart {{ _syncthing_host }}"
  ansible.builtin.uri:
    url: "{{ _syncthing_url }}/rest/system/restart"
    method: POST
    validate_certs: "{{ _syncthing_validate }}"
    headers:
      X-API-Key: "{{ syncthing_api_key }}"
  changed_when: true
  when: _syncthing_restart.json.requiresRestart
