---
# Composition name (used by composition-common dependency)
composition_name: scrutiny

# Single label before {host} (hyphen, not dot) - a *.ewwww.eu wildcard cert
# cannot cover a multi-level name like "scrutiny.<host>.ewwww.eu". See #271.
# Scrutiny reports on one machine's physical drives, so the name is
# host-scoped: several hosts can run it without colliding.
composition_dns_subdomains:
  - "scrutiny-{host}"

composition_scrutiny_port: 8080

# Collector schedule (cron). Upstream default is daily at midnight; the
# omnibus entrypoint also runs one collection at container start.
composition_scrutiny_cron_schedule: "0 0 * * *"

# Which block devices to hand to the container. Matching on whole-disk names
# excludes partitions, loop devices, ZFS zvols (zd*) and device-mapper nodes,
# none of which have SMART data. NVMe is deliberately absent from the pattern
# - see the rotational filter below.
composition_scrutiny_device_pattern: '^(sd[a-z]+|hd[a-z]+|vd[a-z]+)$'

# Spinning disks only. rotational comes from /sys/block/<dev>/queue/rotational
# and Ansible reports it as the string '1' (HDD) or '0' (SSD, NVMe, zvol), so
# SSDs drop out here and NVMe never matches the pattern in the first place.
# Override composition_scrutiny_devices outright to monitor something else.
composition_scrutiny_devices: >-
  {{ ansible_facts['devices'] | dict2items
     | selectattr('key', 'match', composition_scrutiny_device_pattern)
     | selectattr('value.rotational', 'defined')
     | selectattr('value.rotational', 'eq', '1')
     | map(attribute='key') | map('regex_replace', '^', '/dev/') | sort }}
