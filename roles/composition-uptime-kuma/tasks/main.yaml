# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0660"

- name: Run Configure DNS role
  ansible.builtin.include_role:
    name: "network-register-subdomain"
  vars:
    configure_dns_subdomains: "{{ composition_dns_subdomains }}"

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: never
    pull: always
    remove_orphans: true
  notify: Restart Traefik

# ----------------------------
# Sync monitors from inventory
# ----------------------------

- name: "Wait for uptime-kuma-api /health"
  ansible.builtin.uri:
    url: "http://localhost:5001/health"
    method: GET
    status_code: 200
  delegate_to: "{{ inventory_hostname }}"
  register: uptime_kuma_api_health
  retries: 30
  delay: 5
  until: uptime_kuma_api_health.status == 200

- name: "Reset desired monitors list"
  ansible.builtin.set_fact:
    composition_uptime_kuma_desired_monitors: []

- name: "Append ping monitors for each infra host"
  ansible.builtin.set_fact:
    composition_uptime_kuma_desired_monitors: >-
      {{ composition_uptime_kuma_desired_monitors + [{
           'name': hostvars[ping_host]['host_name_short'],
           'type': 'ping',
           'hostname': hostvars[ping_host]['host_ipv4'],
         }] }}
  loop: "{{ groups['infra'] }}"
  loop_control:
    loop_var: ping_host

# Hosts on the data-driven compositions: list (see roles/infra-named) don't
# carry a cnames_additional entry unless they have a name with no owning
# composition — derive the rest the same way infra-named does, via the
# dns_records filter, or monitors for those services silently disappear.
- name: Build dns_records filter input from hosts using data-driven compositions
  ansible.builtin.set_fact:
    composition_uptime_kuma_dns_records_hosts: >-
      {{
        (composition_uptime_kuma_dns_records_hosts | default({})) | combine({
          dns_host: {
            'fqdn': hostvars[dns_host].host_pfqdn,
            'tailscale_ipv4': hostvars[dns_host].host_tailscale_ipv4,
            'compositions': hostvars[dns_host].compositions,
          }
        })
      }}
  loop: "{{ groups['infra'] }}"
  loop_control:
    loop_var: dns_host
  when: hostvars[dns_host].compositions is defined

- name: Derive cnames for hosts using data-driven compositions
  ansible.builtin.set_fact:
    composition_uptime_kuma_derived_cnames: >-
      {{
        ((composition_uptime_kuma_dns_records_hosts | default({}))
          | dns_records(lookup('composition_dns_subdomains'))
        ).cnames.keys() | map('regex_replace', '$', '.' + domainname_infra) | list
      }}

- name: "Append HTTP monitors for each cname"
  ansible.builtin.set_fact:
    composition_uptime_kuma_desired_monitors: >-
      {{ composition_uptime_kuma_desired_monitors + [{
           'name': cname_item,
           'type': 'http',
           'url': 'https://' ~ cname_item,
         }] }}
  loop: >-
    {{
      (groups['infra']
        | map('extract', hostvars)
        | selectattr('cnames_additional', 'defined')
        | map(attribute='cnames_additional')
        | flatten)
      + composition_uptime_kuma_derived_cnames
    }}
  loop_control:
    loop_var: cname_item

- name: "Sync monitors to uptime-kuma-api"
  ansible.builtin.uri:
    url: "http://localhost:5001/monitors/sync"
    method: POST
    headers:
      X-API-Key: "{{ vault_uptime_kuma_api_key }}"
    body_format: json
    body:
      monitors: "{{ composition_uptime_kuma_desired_monitors }}"
    status_code: 200
    timeout: 120
  delegate_to: "{{ inventory_hostname }}"
  register: composition_uptime_kuma_sync_result
  retries: 6
  delay: 15
  until: composition_uptime_kuma_sync_result.status == 200

- name: "Show monitor sync summary"
  ansible.builtin.debug:
    msg: >-
      Uptime Kuma sync — created: {{ composition_uptime_kuma_sync_result.json.created }},
      updated: {{ composition_uptime_kuma_sync_result.json.updated }},
      deleted: {{ composition_uptime_kuma_sync_result.json.deleted }},
      skipped: {{ composition_uptime_kuma_sync_result.json.skipped }},
      errors: {{ composition_uptime_kuma_sync_result.json.errors | length }}
