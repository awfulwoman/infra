# code: language=ansible

# ----------------------------
# Remove composition (state: absent)
# ----------------------------

- name: Stop and remove Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: absent
    remove_orphans: true
  ignore_errors: true
  when: state == 'absent'

- name: Remove Loki config directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/config"
    state: absent
  when: state == 'absent'

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"
  when: state == 'present'

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"
  when: state == 'present'

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create config directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"
  when: state == 'present'

- name: "Create Loki configuration"
  become: true
  ansible.builtin.template:
    src: loki-config.yaml.j2
    dest: "{{ composition_config }}/config/loki-config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"
  when: state == 'present'

- name: Ensure Loki storage directory has correct ownership
  become: true
  ansible.builtin.file:
    path: "{{ composition_loki_storage_path }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"
    recurse: true
  when: state == 'present'

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: always
    remove_orphans: true
  notify: Restart Traefik
  when: state == 'present'
