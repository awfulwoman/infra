# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create Dockerfile"
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ composition_root }}/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ----------------------------
# Start composition
# ----------------------------

# Layer cache keeps this cheap when the Dockerfile and build args are unchanged.
- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: always
    remove_orphans: true
  notify: Restart Traefik
