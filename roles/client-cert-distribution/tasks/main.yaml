# code: language=ansible

- name: Ensure install directory exists
  become: true
  ansible.builtin.file:
    dest: "{{ client_cert_distribution_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Download candidate fullchain
  become: true
  ansible.builtin.get_url:
    url: "http://{{ client_cert_distribution_server }}:{{ client_cert_distribution_port }}/{{ client_cert_distribution_bundle_name }}.fullchain.crt"
    dest: "{{ client_cert_distribution_install_dir }}/.fullchain.crt.new"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Download candidate private key
  become: true
  ansible.builtin.get_url:
    url: "http://{{ client_cert_distribution_server }}:{{ client_cert_distribution_port }}/{{ client_cert_distribution_bundle_name }}.key"
    dest: "{{ client_cert_distribution_install_dir }}/.key.new"
    owner: root
    group: root
    mode: "0600"
    force: true

- name: Read candidate certificate details
  become: true
  community.crypto.x509_certificate_info:
    path: "{{ client_cert_distribution_install_dir }}/.fullchain.crt.new"
  register: candidate_cert_info

- name: Read candidate private key details
  become: true
  community.crypto.openssl_privatekey_info:
    path: "{{ client_cert_distribution_install_dir }}/.key.new"
  register: candidate_key_info

# Refuses the whole play here if invalid - nothing past this point runs, so
# the currently-installed bundle is never touched and the healthchecksio
# ping below is never reached.
- name: Refuse an invalid or mismatched candidate bundle
  ansible.builtin.assert:
    that:
      - not candidate_cert_info.expired
      - candidate_cert_info.public_key_fingerprints.sha256 == candidate_key_info.public_key_fingerprints.sha256
    fail_msg: >-
      Downloaded cert bundle failed validation - refusing to install.
      expired={{ candidate_cert_info.expired }},
      key_matches_cert={{ candidate_cert_info.public_key_fingerprints.sha256 == candidate_key_info.public_key_fingerprints.sha256 }}
    success_msg: "Candidate bundle validated: not expired, key matches certificate."

# ansible.builtin.copy with remote_src always writes to a temp file in the
# destination directory and renames it into place - the same atomic pattern
# infra-certbot's own distribute step uses (#268).
- name: Atomically install validated fullchain
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: "{{ client_cert_distribution_install_dir }}/.fullchain.crt.new"
    dest: "{{ client_cert_distribution_install_dir }}/fullchain.crt"
    owner: root
    group: root
    mode: "0644"

- name: Atomically install validated private key
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: "{{ client_cert_distribution_install_dir }}/.key.new"
    dest: "{{ client_cert_distribution_install_dir }}/privkey.key"
    owner: root
    group: root
    mode: "0600"

- name: Remove temp download files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ client_cert_distribution_install_dir }}/.fullchain.crt.new"
    - "{{ client_cert_distribution_install_dir }}/.key.new"

# Dead-man's switch: only pinged once a validated bundle is actually
# installed. A broken pull/validate stops the ping while the previously
# installed cert is still valid for weeks (infra-certbot renews at
# remaining_days: 60), so this alarms well ahead of actual expiry.
- name: Healthchecks block (reached only after a validated install)
  when: client_cert_distribution_healthcheck
  block:
    - name: Ensure that Healthchecks.io check is present
      community.healthchecksio.checks:
        state: present
        api_key: "{{ vault_healthchecks_rw_apikey }}"
        name: "{{ client_cert_distribution_healthcheck_name }}"
        unique: ["name"]
        tags:
          - autogenerated
          - "{{ host_type }}"
          - "{{ inventory_hostname }}"
        schedule: "0 8 * * *"
        grace: 86400 # one day
        tz: Europe/Berlin
      register: cert_distribution_healthcheck

    - name: Ping Healthchecks.io
      community.healthchecksio.ping:
        state: present
        api_key: "{{ vault_healthchecks_rw_apikey }}"
        signal: success
        uuid: "{{ cert_distribution_healthcheck.uuid }}"
      when: cert_distribution_healthcheck is defined and cert_distribution_healthcheck.uuid is defined and cert_distribution_healthcheck.uuid is not false
      changed_when: false
  rescue:
    - name: All is good if the first task failed
      when: ansible_failed_task.name == 'Ensure that Healthchecks.io check is present'
      ansible.builtin.debug:
        msg: "Healthchecks.io module couldn't run"
