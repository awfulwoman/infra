# code: language=ansible

- name: Ensure install directory exists
  become: true
  ansible.builtin.file:
    dest: "{{ cert_bundle.install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Read the candidate bundle from the certificate host
  ansible.builtin.slurp:
    src: "{{ client_cert_distribution_source_dir }}/{{ cert_bundle.name }}.{{ item }}"
  delegate_to: "{{ client_cert_distribution_source_host }}"
  loop: [fullchain.crt, key]
  register: candidate_bundle
  no_log: true

- name: Write candidate fullchain
  become: true
  ansible.builtin.copy:
    content: "{{ candidate_bundle.results[0].content | b64decode }}"
    dest: "{{ cert_bundle.install_dir }}/.fullchain.crt.new"
    owner: root
    group: root
    mode: "0644"

- name: Write candidate private key
  become: true
  ansible.builtin.copy:
    content: "{{ candidate_bundle.results[1].content | b64decode }}"
    dest: "{{ cert_bundle.install_dir }}/.key.new"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Read candidate certificate details
  become: true
  community.crypto.x509_certificate_info:
    path: "{{ cert_bundle.install_dir }}/.fullchain.crt.new"
  register: candidate_cert_info

- name: Read candidate private key details
  become: true
  community.crypto.openssl_privatekey_info:
    path: "{{ cert_bundle.install_dir }}/.key.new"
  register: candidate_key_info

# Refuses the whole play here if invalid - nothing past this point runs, so
# the currently-installed bundle is never touched and the healthchecksio
# ping below is never reached.
- name: Refuse an invalid or mismatched candidate bundle
  ansible.builtin.assert:
    that:
      - not candidate_cert_info.expired
      - candidate_cert_info.public_key_fingerprints.sha256 == candidate_key_info.public_key_fingerprints.sha256
    fail_msg: >-
      Downloaded cert bundle {{ cert_bundle.name }} failed validation - refusing to install.
      expired={{ candidate_cert_info.expired }},
      key_matches_cert={{ candidate_cert_info.public_key_fingerprints.sha256 == candidate_key_info.public_key_fingerprints.sha256 }}
    success_msg: "Candidate bundle validated: not expired, key matches certificate."

# ansible.builtin.copy with remote_src always writes to a temp file in the
# destination directory and renames it into place - the same atomic pattern
# infra-certbot's own distribute step uses (#268).
- name: Atomically install validated fullchain
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: "{{ cert_bundle.install_dir }}/.fullchain.crt.new"
    dest: "{{ cert_bundle.install_dir }}/fullchain.crt"
    owner: root
    group: root
    mode: "0644"

- name: Atomically install validated private key
  become: true
  ansible.builtin.copy:
    remote_src: true
    src: "{{ cert_bundle.install_dir }}/.key.new"
    dest: "{{ cert_bundle.install_dir }}/privkey.key"
    owner: root
    group: root
    mode: "0600"

- name: Remove temp download files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ cert_bundle.install_dir }}/.fullchain.crt.new"
    - "{{ cert_bundle.install_dir }}/.key.new"
