# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .environment_vars file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create podcast media directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_podderton_media_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0775"

# Seed a starter config only if the user has not created one. The config
# directory is mounted read-only into the containers, so this file must
# exist before first start or Podderton crashes trying to write its default.
- name: Seed starter feeds.yaml
  ansible.builtin.template:
    src: feeds.yaml.j2
    dest: "{{ composition_config }}/feeds.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    force: false

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  notify: Restart Traefik
