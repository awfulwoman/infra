# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .environment_vars file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create podcast media directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_podderton_media_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0775"

# The image's entrypoint only chowns /podcasts when the top directory is not
# owned by its "podderton" user. That user is uid 1000, the same as the media
# directory owner above, so the chown is skipped and a feeds/ directory made
# earlier as root stays root-owned. The generator runs as uid 1000 and then
# fails with "Permission denied" on feeds/feeds.xml, and restarts in a loop.
- name: Make the generated feeds directory writable by the podderton user
  become: true
  ansible.builtin.file:
    path: "{{ composition_podderton_media_path }}/feeds"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true

# Seed a starter config only if the user has not created one. The config
# directory is mounted read-only into the containers, so this file must
# exist before first start or Podderton crashes trying to write its default.
- name: Seed starter feeds.yaml
  ansible.builtin.template:
    src: feeds.yaml.j2
    dest: "{{ composition_config }}/feeds.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    force: false

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: always
    remove_orphans: true
  notify: Restart Traefik
