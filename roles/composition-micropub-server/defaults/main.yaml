# code: language=ansible
composition_name: micropub-server

# Public name (indie.<personal domain>) lives in the public Hetzner zone
# (infra-public-resources), not in internal DNS, so no internal labels.
composition_dns_subdomains: []
composition_micropub_server_hostname: "indie.{{ domainname_personal }}"

# Our own image, built and tested by GitHub Actions. Tracks latest (pulled on every run);
# pin a sha-<short> tag to roll back.
composition_micropub_server_image: ghcr.io/awfulwoman/micropub-server:latest

# The site published to: the IndieAuth identity ("me").
composition_micropub_server_publication_url: "https://awfulwoman.com"

composition_micropub_server_secret: "{{ vault_composition_micropub_server_secret }}"
# bcrypt hash accepted as is; replace with an argon2 PASSWORD_HASH later.
composition_micropub_server_password_secret: "{{ vault_composition_micropub_server_password_secret }}"
composition_micropub_server_github_token: "{{ vault_github_micropub_server_token }}"
# Shared with the GitHub webhook on the site repo. Empty: the webhook endpoint is off.
composition_micropub_server_webhook_secret: "{{ vault_github_webhook_micropub_server_secret | default('') }}"
# Empty until a Mastodon token exists; syndication to Mastodon is skipped without it.
# The Mastodon-API server to share to (GoToSocial works).
composition_micropub_server_mastodon_url: https://gts.awfulwoman.com
composition_micropub_server_mastodon_user: charlie
composition_micropub_server_mastodon_service_name: GoToSocial
composition_micropub_server_mastodon_character_limit: 5000
composition_micropub_server_mastodon_token: "{{ vault_composition_micropub_server_mastodon_token | default('') }}"
