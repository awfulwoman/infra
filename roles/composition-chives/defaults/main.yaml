composition_chives_llm_base_url: "{{ llm_default_openai_uri }}"

composition_chives_llm_model: "{{ llm_default_model }}"
composition_chives_llm_api_key: "ollama"

composition_chives_event_reminder_minutes: 15
composition_chives_idle_checkin_hours: 0

# composition-chives is the one composition deployed more than once on the
# same host with a distinct identity each time (composition_name: nabu /
# jarvis, ...) - so unlike every other composition's config, its
# per-instance settings can't just be a flat default here. Each instance's
# own config lives in composition_chives_instances (host_vars), keyed by
# composition_name, which system-compositions always sets explicitly (see
# roles/system-compositions/tasks/main.yaml).
#
# Telegram is optional — leave blank to run without it
composition_chives_telegram_token: "{{ composition_chives_instances[composition_name].telegram_token | default('') }}"
composition_chives_telegram_chat_id: "{{ composition_chives_instances[composition_name].telegram_chat_id | default('') }}"

# Profile markdown editor at /editor is optional — leave blank to disable
composition_chives_editor_username: ""
composition_chives_editor_password: ""

# Gateway MCP server URL (Malcolm runs the HTTP gateway at port 4000)
composition_chives_mcps: "{{ composition_chives_instances[composition_name].mcps | default([]) }}"
