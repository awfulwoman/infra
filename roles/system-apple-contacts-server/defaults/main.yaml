---
system_apple_contacts_server_repo: awfulwoman/apple-contacts-server
system_apple_contacts_server_git_host: github.com
system_apple_contacts_server_repo_version: HEAD
system_apple_contacts_server_repo_update: true
system_apple_contacts_server_repo_dir: "{{ system_repos_base_dir }}/awfulwoman/apple-contacts-server"
system_apple_contacts_server_plist_label: com.awfulwoman.apple-contacts-server

# 0.0.0.0 so composition-gateway (a different host) can connect. Binding one
# address would pick a side: bertha answers Malcolm's name split-horizon, so the
# caller reaches whichever of the LAN or Tailscale address it can route to, and
# the service has to answer on both. Every endpoint requires a bearer token
# regardless of interface.
system_apple_contacts_server_host: 0.0.0.0
system_apple_contacts_server_port: 4102
system_apple_contacts_server_db_path: "{{ ansible_facts.user_dir }}/.local/state/apple-contacts-server/meta.db"

# Shared with composition-gateway, which authenticates to this same service.
system_apple_contacts_server_bearer_tokens: "{{ vault_gateway_contacts_server_token }}"

# Login-keychain password, needed ONLY the first time the signing cert is
# provisioned (to run `security set-key-partition-list` non-interactively so
# codesign can later use the key headlessly). After the cert exists this is
# unused. Set in Malcolm's host_vars from vault, e.g.
#   system_apple_contacts_server_keychain_password: "{{ vault_malcolm_login_keychain_password }}"
# Left empty: cert provisioning is skipped and must be run by hand once
# (scripts/setup_signing_cert.sh on Malcolm) — signing on later deploys still works.
system_apple_contacts_server_keychain_password: ""
