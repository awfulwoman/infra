---
- name: Install Ansible (macOS)
  ansible.builtin.include_tasks: install-macos.yaml
  when: ansible_facts['os_family'] == 'Darwin'

- name: Install Ansible (Ubuntu/Debian)
  ansible.builtin.include_tasks: install-ubuntu.yaml
  when: ansible_facts['os_family'] == 'Debian'

# Must precede the Galaxy install. ansible-galaxy writes straight into
# ansible_roles_path and ansible_collections_path, so on a fresh host those
# directories have to exist and be writable by the connecting user first.
# become is needed because ansible_path is typically under /opt, which is
# root-owned; owner/group then hand the tree to the unprivileged user that
# actually runs ansible-galaxy.
- name: Ensure Ansible CLI paths exist
  when: ansible_path is defined
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else ansible_user }}"
    mode: "0755"
  loop: >-
    {{
      [ansible_path, ansible_log_path, ansible_collections_path] +
      (ansible_roles_path.split(':') | select('match', '^/') | list)
    }}

# Copied from the controller running this play, so the host needs no checkout
# of this repo.
- name: Copy Galaxy requirements
  when: ansible_path is defined
  ansible.builtin.copy:
    src: "{{ role_path }}/../../meta/requirements.yaml"
    dest: "{{ ansible_path }}/requirements.yaml"
    mode: "0644"

- name: Install Ansible Galaxy dependencies
  when: ansible_path is defined
  ansible.builtin.command:
    cmd: ansible-galaxy install -r {{ ansible_path }}/requirements.yaml
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
    ANSIBLE_ROLES_PATH: "{{ ansible_roles_path }}"
    ANSIBLE_COLLECTIONS_PATH: "{{ ansible_collections_path }}"
  changed_when: false
