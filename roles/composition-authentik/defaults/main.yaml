# code: language=ansible
# Composition name (used by composition-common dependency)
composition_name: authentik

# DNS labels: read by the composition_dns_subdomains lookup, not by this role.
composition_dns_subdomains:
  - authentik

composition_authentik_secret_key: "{{ lookup('onepassword_connect', 'App - Authentik', 'secret key') }}"
composition_authentik_db_password: "{{ lookup('onepassword_connect', 'App - Authentik', 'db password') }}"
