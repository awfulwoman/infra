# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Create .environment_vars file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create data directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop_control:
    loop_var: dir_item
  loop:
    - data
    - certs
    - custom-templates

- name: Create postgres data directory
  ansible.builtin.file:
    path: "{{ composition_config }}/postgres"
    state: directory
    owner: "70"
    group: "70"
    mode: "0700"
  become: true

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: missing
    remove_orphans: true
  notify: Restart Traefik
