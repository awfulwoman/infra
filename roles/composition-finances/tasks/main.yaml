# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Create firefly core .env file"
  ansible.builtin.template:
    src: environment_vars_core.j2
    dest: "{{ composition_root }}/.environment_vars_core"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Create firefly db .env file"
  ansible.builtin.template:
    src: environment_vars_db.j2
    dest: "{{ composition_root }}/.environment_vars_db"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# Fetched at runtime, never stored in the repo: these credentials reach live
# bank data. Delegated so the Connect token stays on the controller.
- name: "Fetch Enable Banking credentials from 1Password"
  ansible.builtin.uri:
    url: >-
      {{ onepassword_connect_host }}/v1/vaults/{{ onepassword_connect_vault_id
      }}/items/{{ firefly_enablebanking_item_id }}
    headers:
      Authorization: "Bearer {{ onepassword_connect_token }}"
  delegate_to: localhost
  register: firefly_enablebanking_item
  no_log: true

# The key is passed through as the ordinary multi-line PEM it is stored as.
# Compose quotes the value in the env file and preserves the newlines, so the
# importer receives real PEM and parses it directly.
- name: "Extract Enable Banking fields"
  ansible.builtin.set_fact:
    firefly_enablebanking_app_id: "{{ firefly_enablebanking_fields | selectattr('label', 'eq', 'App ID') | map(attribute='value') | first }}"
    firefly_enablebanking_private_key: "{{ firefly_enablebanking_fields | selectattr('label', 'eq', 'Private Key') | map(attribute='value') | first | trim }}"
  vars:
    # Not every field carries a label (notes, for one), and selectattr raises on
    # the missing attribute rather than skipping it.
    firefly_enablebanking_fields: "{{ firefly_enablebanking_item.json.fields | selectattr('label', 'defined') }}"
  no_log: true

- name: "Create firefly importer .env file"
  ansible.builtin.template:
    src: environment_vars_importer.j2
    dest: "{{ composition_root }}/.environment_vars_importer"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
  loop_control:
    loop_var: dir_item
  loop:
    - firefly-db
    - firefly-upload
    - firefly-importer

# - name: Copy over files
#   become: true
#   ansible.builtin.copy:
#     src: filename.txt
#     dest: "{{ composition_config }}/filename.txt

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: always
    remove_orphans: true
  notify: Restart Traefik
