# Composition name (used by composition-common dependency)
composition_name: finances

composition_dns_subdomains:
  - firefly
  - firefly-importer

vault_firefly_cron_token: null
vault_firefly_db_password: null
vault_firefly_app_key: null
vault_firefly_access_token: null

# Enable Banking credentials are read from 1Password at playbook runtime rather
# than stored in the repo — they reach live financial data. See README.
#
# Note that 1Password reassigns an item's UUID when it moves between vaults, so
# this changes if the item is ever relocated.
firefly_enablebanking_item_id: fisnhyavlrcztjznla55kuzdu4

# Firefly builds password-reset links from APP_URL, so it must match the
# Traefik router host or the emailed link points at localhost.
firefly_app_url: "https://firefly.{{ domainname_infra }}"

# Firefly needs working mail: a password reset is the only recovery path for
# a locked-out account, since the 16-character password minimum cannot be
# lowered and there is no artisan command to set a password. Reuses the same
# mailbox.org relay as nullmailer.
firefly_mail_mailer: smtp
firefly_mail_host: "smtp.{{ vault_mailprovider_domain }}"
firefly_mail_port: 465
firefly_mail_username: "{{ vault_mailprovider_user }}"
firefly_mail_password: "{{ vault_mailprovider_password }}"

# Port 465 is implicit TLS. Laravel only infers the smtps scheme when
# encryption is exactly `tls` and the port is 465, so pin the scheme
# outright rather than depending on that inference.
firefly_mail_scheme: smtps
firefly_mail_encryption: tls

# mailbox.org only accepts a From address belonging to the account.
firefly_mail_from: "{{ vault_mailprovider_user }}"
firefly_site_owner: "{{ vault_mailprovider_user }}"

# Raise to `debug` only to recover a reset link from the container log when
# SMTP itself is broken; see README.
firefly_log_level: notice
