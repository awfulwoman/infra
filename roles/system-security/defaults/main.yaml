# Unattended Upgrades
security_autoupdate_enabled: true
security_autoupdate_blacklist: []
security_autoupdate_additional_origins:
  - "Docker:{{ ansible_facts['distribution_release'] }}"
  - "Tailscale:{{ ansible_facts['distribution_release'] }}"
  - "HashiCorp:{{ ansible_facts['distribution_release'] }}"
security_autoupdate_mail_on_error: true
security_autoupdate_mail_to: "unattended@{{ domainname_personal }}"
security_autoupdate_reboot: true
security_autoupdate_reboot_time: 03:00

# Sudo and such
security_sudoers_passwordless:
  - "{{ vault_server_username }}"
security_sudoers_passworded: []

# SSH hardening
security_ssh_port: 22
security_ssh_password_authentication: false
security_ssh_permit_root_login: false
security_ssh_usedns: false
security_ssh_permit_empty_password: false
security_ssh_challenge_response_auth: false
security_ssh_gss_api_authentication: false
security_ssh_x11_forwarding: false
security_sshd_state: started
security_ssh_restart_handler_state: restarted
security_ssh_allowed_users: []
security_ssh_allowed_groups: []

security_fail2ban_enabled: true
security_fail2ban_custom_configuration_template: "jail.local.j2"

# Jail tuning. Without these the jail inherits Debian's jail.conf defaults
# (10 minute ban, 5 retries), which barely slows a botnet rotating through
# hundreds of source addresses.
security_fail2ban_bantime: "1h"
security_fail2ban_findtime: "10m"
security_fail2ban_maxretry: 5
# Ban repeat offenders for progressively longer, up to bantime_maxtime.
security_fail2ban_bantime_increment: true
security_fail2ban_bantime_maxtime: "1w"
# Never ban ourselves: loopback, plus the Tailscale CGNAT range that every
# host in this estate is reachable on.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 100.64.0.0/10
