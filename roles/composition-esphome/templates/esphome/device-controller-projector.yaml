substitutions:
  name: device-controller-projector
  friendly_name: Projector Controller

esphome:
  name: ${name}
  includes:
    - uart_read_line_sensor.h

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

# Enable logging
logger:
  level: VERBOSE # makes uart stream available in esphome logstream
  baud_rate: 0 # disable logging over uart

# Enable Home Assistant API
api:
  encryption:
    key: "{{ vault_esphome_projector_api_key }}"

ota:
  password: "{{ vault_esphome_projector_ota_password }}"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .i.affordablepotatoes.com

captive_portal:

uart:
  tx_pin: 22
  rx_pin: 23
  # tx_pin: 21
  # rx_pin: 22
  baud_rate: 115200
  # baud_rate: 9600
  data_bits: 8
  parity: NONE
  id: external_uart
  stop_bits: 1

  debug:
    direction: BOTH
    dummy_receiver: false
    after:
        bytes: 4
    sequence:
      - lambda: |-
          UARTDebug::log_int(direction, bytes, ',');
    # UARTDebug::log_hex(direction, bytes, ':');


