# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Create .environment_vars file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

# ----------------------------
# Specific tasks
# ----------------------------

# The container entrypoint chowns /data to its own `node` user (UID 1000),
# so the directory only has to exist.
- name: Create data directory
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    mode: "0755"

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: missing
    remove_orphans: true
  notify: Restart Traefik
