---
- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0755"

- name: Ensure the opencode secrets directory exists
  ansible.builtin.file:
    path: "{{ system_opencode_secrets_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0700"
  when: system_opencode_agentmemory or system_opencode_gateway or system_opencode_searxng or system_opencode_github

# opencode merges every opencode.json(c) it finds, so a leftover .json from
# before the move to JSONC would still apply.
- name: Remove legacy opencode.json
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}/opencode.json"
    state: absent

- name: Write opencode config
  ansible.builtin.template:
    src: opencode.jsonc.j2
    dest: "{{ system_opencode_config_dir }}/opencode.jsonc"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0644"

- name: Sandbox opencode with nono
  when: system_opencode_sandbox
  block:
    - name: Install the nono opencode pack
      ansible.builtin.command: "{{ system_opencode_nono_binary }} pull {{ system_opencode_nono_pack }}"
      args:
        creates: "{{ ansible_facts.user_dir }}/.config/nono/packages/{{ system_opencode_nono_pack }}"

    - name: Ensure nono profiles directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/.config/nono/profiles"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0755"

    - name: Write nono profile extending the opencode pack
      ansible.builtin.template:
        src: nono-profile.json.j2
        dest: "{{ ansible_facts.user_dir }}/.config/nono/profiles/{{ system_opencode_nono_profile }}.jsonc"
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0644"

    - name: Install sandboxing opencode wrapper
      ansible.builtin.template:
        src: opencode-wrapper.sh.j2
        dest: "{{ system_opencode_wrapper_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0755"

    # Interactive bash runs `brew shellenv` after ~/.local/bin is added, which
    # puts Homebrew's bin first and shadows the wrapper. An alias wins over PATH.
    - name: Alias opencode to the sandboxing wrapper in interactive shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.user_dir }}/.bashrc"
        regexp: "^alias opencode="
        line: "alias opencode={{ system_opencode_wrapper_path | quote }}"
        create: true
        mode: "0644"

- name: Ensure the opencode-quota settings directory exists
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}/opencode-quota"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0700"
  when: system_opencode_plugins | length > 0

- name: Write opencode-quota settings
  ansible.builtin.template:
    src: quota-settings.jsonc.j2
    dest: "{{ system_opencode_config_dir }}/opencode-quota/settings.jsonc"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0644"
  when: system_opencode_plugins | length > 0

- name: Wire opencode to agentmemory
  when: system_opencode_agentmemory
  block:
    - name: Ensure opencode plugin and command directories exist
      ansible.builtin.file:
        path: "{{ system_opencode_config_dir }}/{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0755"
      loop:
        - plugins
        - commands

    - name: Check the installed agentmemory MCP shim
      ansible.builtin.shell: |
        . "{{ ansible_facts.user_dir }}/.nvm/nvm.sh"
        npm ls --global --depth=0 @agentmemory/mcp
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts.user_dir }}"
        NVM_DIR: "{{ ansible_facts.user_dir }}/.nvm"
      register: system_opencode_agentmemory_shim
      changed_when: false
      failed_when: false

    - name: Install the agentmemory MCP shim with nvm's npm
      ansible.builtin.shell: |
        . "{{ ansible_facts.user_dir }}/.nvm/nvm.sh"
        npm install --global @agentmemory/mcp@{{ system_opencode_agentmemory_version }}
      args:
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts.user_dir }}"
        NVM_DIR: "{{ ansible_facts.user_dir }}/.nvm"
      when: "('@agentmemory/mcp@' ~ system_opencode_agentmemory_version) not in system_opencode_agentmemory_shim.stdout"

    - name: Fetch the agentmemory capture plugin and slash commands
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/rohitg00/agentmemory/v{{ system_opencode_agentmemory_version }}/{{ item.src }}"
        dest: "{{ system_opencode_config_dir }}/{{ item.dest }}"
        checksum: "sha256:{{ item.sha256 }}"
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0644"
      loop: "{{ system_opencode_agentmemory_files }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Write the agentmemory environment file
      ansible.builtin.template:
        src: agentmemory.env.j2
        dest: "{{ system_opencode_agentmemory_env_file }}"
        owner: "{{ ansible_user }}"
        group: "{{ system_opencode_group }}"
        mode: "0600"
      no_log: true

- name: Write the gateway environment file
  ansible.builtin.template:
    src: gateway.env.j2
    dest: "{{ system_opencode_gateway_env_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0600"
  no_log: true
  when: system_opencode_gateway

- name: Write the SearXNG environment file
  ansible.builtin.template:
    src: searxng.env.j2
    dest: "{{ system_opencode_searxng_env_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0600"
  no_log: true
  when: system_opencode_searxng

- name: Remove the old in-config-dir App key (now lives outside the allow path)
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}/github-app.pem"
    state: absent
  when: system_opencode_github

- name: Remove old in-config-dir secret files (now in the secrets dir)
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}/{{ item }}"
    state: absent
  loop:
    - agentmemory.env
    - gateway.env
    - searxng.env
  when: system_opencode_agentmemory or system_opencode_gateway or system_opencode_searxng

- name: Write the GitHub App private key
  ansible.builtin.copy:
    content: "{{ vault_github_app_private_key }}"
    dest: "{{ system_opencode_github_app_key_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0600"
  no_log: true
  when: system_opencode_github

- name: Write the GitHub token mint helper
  ansible.builtin.template:
    src: mint-github-token.sh.j2
    dest: "{{ system_opencode_github_mint_helper }}"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0700"
  when: system_opencode_github

- name: Write the git credential helper
  ansible.builtin.template:
    src: git-credential-github.sh.j2
    dest: "{{ system_opencode_github_credential_helper }}"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0700"
  when: system_opencode_github

- name: Ensure gh's sandbox-local config directory exists
  ansible.builtin.file:
    path: "{{ system_opencode_gh_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0700"
  when: system_opencode_github
