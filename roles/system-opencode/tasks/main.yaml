---
- name: Ensure opencode config directory exists
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0755"

# opencode merges every opencode.json(c) it finds, so a leftover .json from
# before the move to JSONC would still apply.
- name: Remove legacy opencode.json
  ansible.builtin.file:
    path: "{{ system_opencode_config_dir }}/opencode.json"
    state: absent

- name: Write opencode config
  ansible.builtin.template:
    src: opencode.jsonc.j2
    dest: "{{ system_opencode_config_dir }}/opencode.jsonc"
    owner: "{{ ansible_user }}"
    group: "{{ system_opencode_group }}"
    mode: "0644"
