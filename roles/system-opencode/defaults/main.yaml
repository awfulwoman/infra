---
# OpenAI-compatible endpoint of the Ollama server (malcolm). opencode v2
# discovers models from the native Ollama API at the same host and port.
system_opencode_ollama_base_url: "{{ llm_default_openai_uri }}"

# opencode plugins (npm package names). Loaded by opencode at start-up.
system_opencode_plugins:
  - "@slkiser/opencode-quota"

# Default model as provider/model, e.g. "ollama/kimi-k3:cloud". Empty leaves
# the choice to opencode.
system_opencode_model: ""

# Config directory and file. opencode follows XDG, so ~/.config on both OSes.
system_opencode_config_dir: "{{ ansible_facts.user_dir }}/.config/opencode"
# Secret files (tokens, the GitHub App key) live here, a sibling of the config
# dir. The nono profile grants ~/.config/opencode but not this directory, so
# the agent cannot read them by default.
system_opencode_secrets_dir: "{{ ansible_facts.user_dir }}/.config/opencode-secrets"
system_opencode_group: "{{ ansible_user }}"

# --- nono sandbox ---------------------------------------------------------
# opencode runs inside a nono (Landlock) sandbox via a wrapper in
# system_opencode_wrapper_path. See README.
system_opencode_sandbox: true

# Real opencode binary the wrapper executes. Homebrew-installed.
system_opencode_binary: "{{ '/home/linuxbrew/.linuxbrew/bin/opencode' if ansible_facts['os_family'] == 'Debian' else '/opt/homebrew/bin/opencode' }}"
system_opencode_nono_binary: "{{ '/home/linuxbrew/.linuxbrew/bin/nono' if ansible_facts['os_family'] == 'Debian' else '/opt/homebrew/bin/nono' }}"

# Must sit earlier on PATH than the Homebrew binary (~/.local/bin does).
system_opencode_wrapper_path: "{{ ansible_facts.user_dir }}/.local/bin/opencode"

# nono pack providing the base profile, and the local profile extending it.
system_opencode_nono_pack: nolabs-ai/opencode
system_opencode_nono_profile: opencode-local

# Extra read+write paths on top of the pack, beyond the current directory.
system_opencode_sandbox_allow:
  - "$HOME/Code"
# Extra read-only paths.
system_opencode_sandbox_read: []
# Paths denied even inside the allowed ones.
system_opencode_sandbox_deny: []

# CLI (terminal client) settings the wrapper applies through
# OPENCODE_CLI_CONFIG_CONTENT. opencode merges them over ~/.config/opencode/cli.json,
# which the TUI itself rewrites, so only keys owned here belong in this dict.
# Dropping ctrl+c from app.exit stops it quitting; it still clears the prompt.
system_opencode_cli_config:
  keybinds:
    app.exit: [ctrl+d, "<leader>q"]

# --- permissions ----------------------------------------------------------
# opencode v2 `permissions` rules, written to opencode.jsonc. The last matching
# rule wins, so the defaults come first and the allow-list after. A trailing
# " *" also matches the bare command.
system_opencode_permissions_default:
  - {action: external_directory, resource: "*", effect: ask}
  - {action: shell, resource: "*", effect: ask}

# Shell commands allowed without asking.
system_opencode_shell_allow:
  - "actionlint *"
  - "bats *"
  - "cat *"
  - "command -v *"
  - "cut *"
  - "date *"
  - "diff *"
  - "docker ps *"
  - "docker image ls *"
  - "docker network ls *"
  - "echo *"
  - "exit *"
  - "git *"
  - "gh issue list *"
  - "gh issue status *"
  - "gh issue view *"
  - "gh pr diff *"
  - "gh pr list *"
  - "gh pr status *"
  - "gh pr view *"
  - "gh repo view *"
  - "gh run list *"
  - "gh run view *"
  - "gh search *"
  - "gh workflow list *"
  - "gh workflow view *"
  - "grep *"
  - "halfpipe *"
  - "head *"
  - "ls *"
  - "man *"
  - "mkdir *"
  - "mktemp *"
  - "nono why *"
  - "opencode --version"
  - "orb info *"
  - "orb list *"
  - "otool *"
  - "paste *"
  - "printf *"
  - "pwd *"
  - "rg *"
  - "sed *"
  - "shasum *"
  - "shellcheck *"
  - "strings *"
  - "sleep *"
  - "sort *"
  - "tail *"
  - "tee *"
  - "test *"
  - "touch *"
  - "tr *"
  - "true *"
  - "uniq *"
  - "wc *"
  - "which *"
  - "awk *"
  - "chmod *"
  - "env *"
  - "find *"
  - "jq *"
  - "xargs *"
  - "make *"
  - "mise *"
  - "npm *"
  - "uv *"
  - "node *"
  - "python3 *"

# Rules appended last (so they win), e.g. hard denies.
system_opencode_permissions_extra: []

# --- policies ------------------------------------------------------------
# opencode v2 `policies`, written to opencode.jsonc. Deny the built-in
# `opencode` provider so its free-tier and Zen models (iceman-free, big-pickle,
# ...) don't clutter the model picker. We use Ollama exclusively. Set to [] to
# restore them.
system_opencode_policies:
  - {action: provider.use, resource: opencode, effect: deny}

# --- opencode-quota -------------------------------------------------------
# The plugin shows Ollama Cloud session/weekly quota. Ollama on malcolm signs
# its cloud requests with its own sign-in, so /api/balance works through
# ollama.<domain> without an API key. The plugin only accepts HTTPS (or
# loopback) and always sends a bearer key, so a placeholder satisfies it.
# Ollama ignores the Authorization header.
system_opencode_ollama_placeholder_key: unused

# Contents of ~/.config/opencode/opencode-quota/settings.jsonc.
# providerId must be "ollama", our configured provider ("ollama-cloud" shows
# nothing). Only settings that differ from the plugin's defaults belong here.
system_opencode_quota_settings:
  providers:
    custom:
      - id: ollama-malcolm
        providerId: ollama
        label: Ollama Cloud (via malcolm)
        mode: remote-api
        url: "{{ llm_default_ollama_base_url }}/api/balance"
        format: json-v1
        adapter:
          mappings:
            - resultType: quota
              name: Session
              label: "Session:"
              resetTime: {path: [included, session, resets_at], encoding: iso-8601}
              metric:
                type: percentage
                meaning: remaining
                percentage: {path: [included, session, remaining_percent]}
            - resultType: quota
              name: Weekly
              label: "Weekly:"
              resetTime: {path: [included, weekly, resets_at], encoding: iso-8601}
              metric:
                type: percentage
                meaning: remaining
                percentage: {path: [included, weekly, remaining_percent]}

# --- agentmemory ----------------------------------------------------------
# Wires composition-agentmemory (https://agentmemory.<domain>) into opencode
# twice: the @agentmemory/mcp stdio shim for the memory tools, and the
# agentmemory-capture plugin plus /recall and /remember for auto-capture.
# Both read AGENTMEMORY_URL / AGENTMEMORY_SECRET from the environment. The
# wrapper exports them from a 0600 env file, so unwrapped runs of the Homebrew
# binary have no memory.
system_opencode_agentmemory: true
system_opencode_agentmemory_url: "https://agentmemory.{{ domainname_infra }}"
system_opencode_agentmemory_secret: "{{ vault_composition_agentmemory_secret }}"
# Keep in step with the image tag in composition-agentmemory.
system_opencode_agentmemory_version: "0.9.33"
system_opencode_agentmemory_env_file: "{{ system_opencode_secrets_dir }}/agentmemory.env"

# Files fetched from the upstream repo at the tag above, with their checksums.
# Update the checksums when the version changes.
system_opencode_agentmemory_files:
  - src: plugin/opencode/agentmemory-capture.ts
    dest: plugins/agentmemory-capture.ts
    sha256: 64c4fdb4129ef53dd7c2cfca6a413ab8f4c47fe59159ebeb108422adcd4af944
  - src: plugin/opencode/commands/recall.md
    dest: commands/recall.md
    sha256: 3b05701dbade65e1192726592b922faace26bf0b659f31e7b54a6a584880e97b
  - src: plugin/opencode/commands/remember.md
    dest: commands/remember.md
    sha256: 8e27caf25ba2d2f1fd7944f0454c90cf9b4b5ff24054a91c5baeb242025fa6a9

# --- gateway --------------------------------------------------------------
# Registers the gateway MCP server (https://gateway.<domain>/mcp: email,
# calendar, notes, bookmarks, reminders) as a remote server. opencode has its
# own client token, `opencode` in composition_gateway_server_auth_clients, so it
# can be revoked on its own. The wrapper exports it from a 0600 file.
system_opencode_gateway: true
system_opencode_gateway_url: "https://gateway.{{ domainname_infra }}/mcp"
system_opencode_gateway_token: "{{ vault_gateway_mcp_token_opencode }}"
system_opencode_gateway_env_file: "{{ system_opencode_secrets_dir }}/gateway.env"

# --- searxng --------------------------------------------------------------
# Web search through composition-mcp-searxng (https://searchmcp.<domain>/mcp).
# The service has one shared bearer token, not per-client ones.
system_opencode_searxng: true
system_opencode_searxng_url: "https://searchmcp.{{ domainname_infra }}/mcp"
system_opencode_searxng_token: "{{ vault_mcp_searxng_auth_token }}"
system_opencode_searxng_env_file: "{{ system_opencode_secrets_dir }}/searxng.env"

# --- github ----------------------------------------------------------------
# Lets the agent push to the awfulwoman repos and drive `gh` without ever
# reading a long-lived credential. A helper mints a 1-hour GitHub App
# installation token from a vaulted App private key; git and gh use that.
# The App key lives OUTSIDE every sandbox allow path (a sibling directory,
# not ~/.config/opencode), so the agent cannot read it by default — nono
# cannot deny a file inside an allowed directory. Disabled until the App
# exists and vault_github_app_private_key is set.
system_opencode_github: false
system_opencode_github_app_id: "{{ vault_github_app_id }}"
system_opencode_github_installation_id: "{{ vault_github_app_installation_id }}"
system_opencode_github_app_key_file: "{{ system_opencode_secrets_dir }}/github-app.pem"
system_opencode_github_mint_helper: "{{ system_opencode_config_dir }}/mint-github-token.sh"
system_opencode_github_credential_helper: "{{ system_opencode_config_dir }}/git-credential-github.sh"
# gh's own config dir, kept inside the sandbox (under ~/.config/opencode, which
# is r+w there) rather than the user's ~/.config/gh. That keeps the long-lived
# OAuth token in ~/.config/gh/hosts.yml out of the sandbox: gh creates a minimal
# config here and authenticates with GH_TOKEN (the minted App token) alone.
system_opencode_gh_config_dir: "{{ system_opencode_config_dir }}/gh"
