---
# OpenAI-compatible endpoint of the Ollama server (malcolm). opencode v2
# discovers models from the native Ollama API at the same host and port.
system_opencode_ollama_base_url: "{{ llm_default_openai_uri }}"

# Default model as provider/model, e.g. "ollama/kimi-k3:cloud". Empty leaves
# the choice to opencode.
system_opencode_model: ""

# Config directory and file. opencode follows XDG, so ~/.config on both OSes.
system_opencode_config_dir: "{{ ansible_facts.user_dir }}/.config/opencode"
system_opencode_group: "{{ ansible_user }}"
