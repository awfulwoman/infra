# Composition name (used by composition-common dependency)
composition_name: gateway

composition_dns_subdomains:
  - gateway

composition_gateway_imap_host: "imap.{{ vault_mailprovider_domain }}"
composition_gateway_imap_port: 993
composition_gateway_imap_username: "{{ vault_mailprovider_user }}"
composition_gateway_imap_password: "{{ vault_mailprovider_password }}"

# Absolute path on the host to a synced Obsidian vault (e.g. from
# system-obsidian-headless). Must be set per-host; there is no sane default.
composition_gateway_obsidian_vault_path: ""

# Malcolm's name in the infra zone that bertha serves, not a Tailscale MagicDNS
# name. bertha answers it split-horizon, so the same name resolves to whichever
# address the querying host can actually route to. This keeps the backends
# working if MagicDNS is ever turned off tailnet-wide, and it removes the
# dependency on the vaulted tailnet name.
#
# This requires Malcolm's Tailscale address to match `host_tailscale_ipv4` in its
# host_vars, because every managed host resolves through bertha's `tailscale`
# view (Tailscale claims the `~.` routing domain). `network-tailscale-address`
# holds Malcolm to that address — see bootstrap-macos-server.
composition_gateway_malcolm_host: "{{ hostvars['apple-macmini-m4-16gb-malcolm'].host_fqdn }}"

# apple-calendar-server (real Apple Calendar via EventKit) — storage backend for
# Calendar, running natively on Malcolm (a different host — EventKit needs a macOS
# GUI session, so it can't run in this container). Reached over the infra zone,
# not the shared Docker network. Token is shared with system-apple-calendar-server,
# which provisions this same service. Replaces the old Google Calendar OAuth backend.
composition_gateway_calendar_server_base_url: "http://{{ composition_gateway_malcolm_host }}:4101"
composition_gateway_calendar_server_bearer_token: "{{ vault_gateway_calendar_server_token }}"

composition_gateway_karakeep_base_url: "https://karakeep.{{ domainname_infra }}"
composition_gateway_karakeep_api_key: "{{ vault_karakeep_api }}"

composition_gateway_owntracks_base_url: "https://owntracks-recorder.{{ domainname_infra }}"
composition_gateway_owntracks_username: ""
composition_gateway_owntracks_password: ""
composition_gateway_owntracks_user: charlie
composition_gateway_owntracks_device: iphone

composition_gateway_reminders_api_tokens: "{{ vault_gateway_reminders_api_token_iphone }}"
composition_gateway_reminders_nominatim_url: "https://nominatim.{{ domainname_infra }}"

# apple-contacts-server (real macOS Contacts via the Contacts framework) — storage
# backend for Contacts, running natively on Malcolm (a different host — the
# Contacts framework needs a macOS GUI session, so it can't run in this container).
# Reached over the infra zone, not the shared Docker network. Token is shared
# with system-apple-contacts-server, which provisions this same service.
composition_gateway_contacts_server_base_url: "http://{{ composition_gateway_malcolm_host }}:4102"
composition_gateway_contacts_server_bearer_token: "{{ vault_gateway_contacts_server_token }}"

# apple-reminders-server (real Apple Reminders via EventKit) — storage backend for
# Reminders, running natively on Malcolm (a different host — EventKit needs a macOS
# GUI session, so it can't run in this container). Reached over the infra zone,
# not the shared Docker network. Token is shared with system-apple-reminders-server,
# which provisions this same service.
composition_gateway_reminders_server_base_url: "http://{{ composition_gateway_malcolm_host }}:4100"
composition_gateway_reminders_server_bearer_token: "{{ vault_gateway_reminders_server_token }}"

# Same secret as the CLI token used on Malcolm — the server enforces it on /mcp.
composition_gateway_server_auth_tokens: "{{ vault_gateway_mcp_token }}"

# GitHub token for the Issues tool. Fetched from 1Password Connect at playbook
# runtime rather than vaulted in the repo — it is a live GitHub PAT, and the
# same approach as composition-finances keeps it out of git entirely.
# Reference: op://Infra/Github/gateway_issues_token
composition_gateway_github_item_id: 5edooob5a7kzxkuv5ttu5vdexu
composition_gateway_github_token_field: gateway_issues_token

# Repo the issues tools read and write. The app defaults to this same value, but
# pin it here so the target is visible in the role rather than buried in the
# image — changing repo is then a variable change, not an image change.
composition_gateway_github_repo: awfulwoman/meta
