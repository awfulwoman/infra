# code: language=ansible

- name: Assert Obsidian vault path is configured
  ansible.builtin.assert:
    that:
      - composition_gateway_obsidian_vault_path | length > 0
    fail_msg: >-
      composition_gateway_obsidian_vault_path must point at a synced vault on
      this host (a Syncthing folder, see system-syncthing-config).
    quiet: true

# Docker would create a missing bind-mount source as root, leaving a folder
# Syncthing (running as this user) cannot write into.
- name: Ensure Obsidian vault directory exists
  ansible.builtin.file:
    path: "{{ composition_gateway_obsidian_vault_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create usage-log directory"
  ansible.builtin.file:
    path: "{{ composition_root }}/logs"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# Fetched at runtime, never stored in the repo: this is a live GitHub PAT.
# The lookup runs on the controller, so the Connect token stays there.
- name: "Fetch GitHub token from 1Password"
  ansible.builtin.set_fact:
    composition_gateway_github_token: >-
      {{ lookup('onepassword_connect', composition_gateway_github_item, composition_gateway_github_token_field) }}
  no_log: true

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: always
    remove_orphans: true
  notify: Restart Traefik
