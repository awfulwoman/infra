# code: language=ansible
---
- name: "Assert macOS"
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Darwin'
    fail_msg: "system-apple-reminders-server is macOS-only"

- name: "Ensure state directory exists"
  ansible.builtin.file:
    path: "{{ system_apple_reminders_server_state_dir }}"
    state: directory
    mode: "0755"

# meta.db is opened once at startup and never revalidated. If it is removed while
# the service runs, every write fails ("attempt to write a readonly database")
# and the process never exits. Snapshot it before we touch anything so a bad
# deploy or a hand-deletion is recoverable.
- name: "Stat sidecar meta.db"
  ansible.builtin.stat:
    path: "{{ system_apple_reminders_server_db_path }}"
  register: reminders_metadb

- name: "Back up sidecar meta.db"
  ansible.builtin.command:
    cmd: >-
      cp -p {{ system_apple_reminders_server_db_path }}
      {{ system_apple_reminders_server_db_path }}.bak-{{ ansible_facts.date_time.iso8601_basic_short }}
  changed_when: true
  when:
    - system_apple_reminders_server_backup_enabled | bool
    - reminders_metadb.stat.exists
    - reminders_metadb.stat.size | default(0) | int > 0

- name: "Prune old meta.db backups"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      ls -1t {{ system_apple_reminders_server_db_path }}.bak-* 2>/dev/null \
        | tail -n +{{ (system_apple_reminders_server_backup_keep | int) + 1 }} \
        | tr '\n' '\0' | xargs -0 -r rm -f
  changed_when: false
  failed_when: false
  when: system_apple_reminders_server_backup_enabled | bool

- name: "Install meta.db protection marker"
  ansible.builtin.copy:
    dest: "{{ system_apple_reminders_server_state_dir }}/DO-NOT-DELETE.txt"
    mode: "0444"
    content: |
      meta.db in this directory is authoritative state for apple-reminders-server:
      the caller-id -> EventKit-identifier map, last-write-wins timestamps and
      deletion tombstones. It is NOT a rebuildable cache.

      The service opens meta.db once at startup and never reopens it. If you
      delete meta.db while the service is running, it does not crash - every
      write silently fails with "attempt to write a readonly database" and
      GET /reminders returns 500.

      If you must remove or replace meta.db, restart the service immediately:

        launchctl kickstart -k gui/$(id -u)/{{ system_apple_reminders_server_plist_label }}

      Timestamped backups (meta.db.bak-*) are written here before every Ansible
      deploy. This file and the watchdog script are managed by the
      system-apple-reminders-server Ansible role.

- name: "Ensure uv is installed"
  community.general.homebrew:
    name: uv
    state: present

- name: "Check if git host is in known_hosts"
  ansible.builtin.command:
    cmd: "ssh-keygen -F {{ system_apple_reminders_server_git_host }}"
  register: reminders_known_hosts_check
  changed_when: false
  failed_when: false

- name: "Add git host to known_hosts"
  ansible.builtin.shell: >
    ssh-keyscan {{ system_apple_reminders_server_git_host }}
    >> {{ ansible_facts.user_dir }}/.ssh/known_hosts
  when: reminders_known_hosts_check.rc != 0
  changed_when: true

- name: "Ensure repo parent directory exists"
  ansible.builtin.file:
    path: "{{ system_apple_reminders_server_repo_dir | dirname }}"
    state: directory
    mode: "0755"

- name: "Clone/update apple-reminders-server repo"
  ansible.builtin.git:
    repo: "git@{{ system_apple_reminders_server_git_host }}:{{ system_apple_reminders_server_repo }}.git"
    dest: "{{ system_apple_reminders_server_repo_dir }}"
    version: "{{ system_apple_reminders_server_repo_version }}"
    update: "{{ system_apple_reminders_server_repo_update }}"

- name: "Sync Python dependencies"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/uv sync
    chdir: "{{ system_apple_reminders_server_repo_dir }}"
  changed_when: false
  when: not ansible_check_mode

# TCC grants Reminders access to a *code identity*. An ad-hoc-signed interpreter
# is identified only by its cdhash, which changes on every `uv sync`/Python bump,
# so the grant silently reverts to denied. Signing the interpreter with a stable
# self-signed cert + fixed identifier makes TCC match on the Designated
# Requirement instead, so the grant survives rebuilds. See the service repo's
# scripts/{setup_signing_cert,sign_runtime}.sh and README.
- name: "Provision stable code-signing identity"
  ansible.builtin.command:
    cmd: ./scripts/setup_signing_cert.sh
    chdir: "{{ system_apple_reminders_server_repo_dir }}"
  environment:
    KEYCHAIN_PASSWORD: "{{ system_apple_reminders_server_keychain_password }}"
  register: signing_cert
  changed_when: "'Created self-signed' in signing_cert.stdout"
  # Only headless-provision when we have the keychain password to run
  # set-key-partition-list; otherwise run setup_signing_cert.sh by hand on Malcolm
  # once (the sign step below then succeeds). Avoids creating a cert whose key
  # codesign can't reach non-interactively.
  when:
    - not ansible_check_mode
    - system_apple_reminders_server_keychain_password | length > 0

- name: "Stat the signing cert on disk"
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.local/state/apple-reminders-server/signing-cert.pem"
  register: reminders_signing_cert

- name: "Check if signing cert is already trusted (System keychain)"
  ansible.builtin.command:
    cmd: security find-certificate -c awfulwoman-apple-reminders-server-signing /Library/Keychains/System.keychain
  register: reminders_cert_trusted
  changed_when: false
  failed_when: false

# A self-signed codesigning cert isn't trusted by default, so codesign refuses to
# use it ("no identity found"). macOS blocks setting trust settings over SSH even
# as root, so trust_signing_cert.sh briefly relaxes the trust-settings auth right,
# adds the trusted cert (admin domain), and restores the right. become = root;
# the private key stays in the user's login keychain, only the public cert is
# trusted, scoped to codeSign.
- name: "Trust signing cert for code signing (headless, admin domain)"
  become: true
  ansible.builtin.command:
    cmd: ./scripts/trust_signing_cert.sh {{ ansible_facts.user_dir }}/.local/state/apple-reminders-server/signing-cert.pem
    chdir: "{{ system_apple_reminders_server_repo_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - reminders_signing_cert.stat.exists
    - reminders_cert_trusted.rc != 0

- name: "Re-sign interpreter with the stable identity"
  ansible.builtin.command:
    cmd: ./scripts/sign_runtime.sh
    chdir: "{{ system_apple_reminders_server_repo_dir }}"
  environment:
    KEYCHAIN_PASSWORD: "{{ system_apple_reminders_server_keychain_password }}"
  changed_when: false
  when: not ansible_check_mode

- name: "Write .env file"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ system_apple_reminders_server_repo_dir }}/.env"
    mode: "0600"

- name: "Ensure log directory exists"
  ansible.builtin.file:
    path: "{{ system_apple_reminders_server_repo_dir }}/logs"
    state: directory
    mode: "0755"

- name: "Deploy LaunchAgent plist"
  ansible.builtin.template:
    src: apple-reminders-server.plist.j2
    dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_reminders_server_plist_label }}.plist"
    mode: "0644"
  notify: Reload apple-reminders-server launchd agent

- name: "Check if launchd agent is bootstrapped"
  ansible.builtin.shell: launchctl print gui/$(id -u)/{{ system_apple_reminders_server_plist_label }}
  register: launchd_check
  failed_when: false
  changed_when: false

- name: "Bootstrap launchd agent"
  ansible.builtin.shell: launchctl bootstrap gui/$(id -u) {{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_reminders_server_plist_label }}.plist
  when: launchd_check.rc != 0

# --- Liveness watchdog --------------------------------------------------------
# KeepAlive only relaunches on process exit. The meta.db-unlink failure wedges
# the service while it stays "running", so a periodic authenticated probe that
# kickstarts (-k) on a bad response is what actually recovers it.
- name: "Watchdog block"
  when: system_apple_reminders_server_watchdog_enabled | bool
  block:
    # Best-effort: if the API can't be reached the watchdog still restarts the
    # service, it just can't alert. Don't fail the deploy over it.
    - name: "Ensure Healthchecks.io check for the watchdog"
      community.healthchecksio.checks:
        state: present
        api_key: "{{ vault_healthchecks_rw_apikey }}"
        name: "{{ system_apple_reminders_server_healthchecksio_name }}"
        unique: ["name"]
        tags:
          - autogenerated
          - "{{ inventory_hostname }}"
          - apple-reminders-server
        timeout: "{{ system_apple_reminders_server_watchdog_interval | int }}"
        grace: "{{ (system_apple_reminders_server_watchdog_interval | int) * 3 }}"
        tz: Europe/Berlin
      register: reminders_watchdog_check
      failed_when: false
      when: system_apple_reminders_server_healthchecksio_enabled | bool

    - name: "Set watchdog Healthchecks.io ping URL"
      ansible.builtin.set_fact:
        reminders_watchdog_hc_url: "https://hc-ping.com/{{ reminders_watchdog_check.uuid }}"
      when:
        - reminders_watchdog_check is defined
        - reminders_watchdog_check.uuid is defined
        - reminders_watchdog_check.uuid is not false

    - name: "Deploy watchdog script"
      ansible.builtin.template:
        src: reminders-watchdog.sh.j2
        dest: "{{ system_apple_reminders_server_state_dir }}/reminders-watchdog.sh"
        mode: "0755"

    - name: "Deploy watchdog LaunchAgent plist"
      ansible.builtin.template:
        src: reminders-watchdog.plist.j2
        dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_reminders_server_watchdog_plist_label }}.plist"
        mode: "0644"
      notify: Reload apple-reminders-server watchdog launchd agent

    - name: "Check if watchdog launchd agent is bootstrapped"
      ansible.builtin.shell: launchctl print gui/$(id -u)/{{ system_apple_reminders_server_watchdog_plist_label }}
      register: watchdog_launchd_check
      failed_when: false
      changed_when: false

    - name: "Bootstrap watchdog launchd agent"
      ansible.builtin.shell: launchctl bootstrap gui/$(id -u) {{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_reminders_server_watchdog_plist_label }}.plist
      when: watchdog_launchd_check.rc != 0
