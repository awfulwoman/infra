# code: language=ansible
# Composition name (used by composition-common dependency)
composition_name: indiekit

# Public name (indie.<personal domain>) lives in the public Hetzner zone
# (infra-public-resources), not in internal DNS, so no internal labels.
composition_dns_subdomains: []
composition_indiekit_hostname: "indie.{{ domainname_personal }}"

# No image is published to ghcr.io/getindiekit/indiekit yet, so build from a
# pinned upstream commit (the Dockerfile only exists on main, not on tags).
composition_indiekit_build_context: "https://github.com/getindiekit/indiekit.git#5308a2f58b63c11bccad13d65fc5d07ce0465a8f"
composition_indiekit_image: indiekit:local
composition_indiekit_mongo_image: mongo:8

# The site Indiekit publishes to. This is the IndieAuth identity ("me"), not
# the Indiekit endpoint itself; the site's <head> must link to the endpoints.
composition_indiekit_publication_url: "https://awfulwoman.com"

# Content store: commits land on main and trigger the site's own build.
composition_indiekit_github_user: awfulwoman
composition_indiekit_github_repo: awfulwoman.com
composition_indiekit_github_branch: main

composition_indiekit_secret: "{{ vault_composition_indiekit_secret }}"
# Empty on first deploy. Visit /auth/new-password, copy the hash, vault it.
composition_indiekit_password_secret: "{{ vault_composition_indiekit_password_secret | default('') }}"
composition_indiekit_github_token: "{{ vault_composition_indiekit_github_token }}"
