- name: Add rtl-433 packages
  become: true
  ansible.builtin.apt:
    name:
      - rtl-433
    state: present

- name: Ensure config dir exists
  become: true
  ansible.builtin.file:
    path: /etc/rtl_433
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure rtl_433 config exists
  become: true
  ansible.builtin.template:
    src: service.conf
    dest: /etc/rtl_433/service.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rtl_433

- name: Ensure systemd unit exists
  become: true
  ansible.builtin.copy:
    src: rtl_433.service
    dest: /etc/systemd/system/rtl_433.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart rtl_433

- name: Ensure service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: rtl_433
    state: started
    enabled: true
    daemon_reload: true
