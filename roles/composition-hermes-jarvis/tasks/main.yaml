# code: language=ansible

# ----------------------------
# Remove composition (state: absent)
# ----------------------------

- name: Stop and remove Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: absent
    remove_orphans: true
  register: _hermes_compose_down
  failed_when:
    - _hermes_compose_down is failed
    - "'no such file or directory' not in (_hermes_compose_down.msg | default('') | lower)"
  when: state | default('present') == 'absent'

# The agent's whole state lives here: config.yaml, memories, skills, cron,
# sessions, logs. Removing the composition removes it. The ZFS dataset itself
# is left behind - destroying it is not something a play should do silently.
- name: Remove the Hermes data directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: absent
  when: state | default('present') == 'absent'

- name: Remove compose and environment files
  become: true
  ansible.builtin.file:
    path: "{{ composition_root }}/{{ absent_file }}"
    state: absent
  loop_control:
    loop_var: absent_file
  loop:
    - docker-compose.yaml
    - .environment_vars
  when: state | default('present') == 'absent'

# ----------------------------
# Preflight
# ----------------------------

- name: Assert dashboard credentials are set
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_dashboard_username | length > 0
      - composition_hermes_jarvis_dashboard_password | length > 0
      - composition_hermes_jarvis_dashboard_secret | length > 0
    fail_msg: >-
      The Hermes dashboard binds beyond loopback so Traefik can reach it, and
      Hermes fails closed unless an auth provider is configured. Set
      vault_hermes_jarvis_dashboard_username, _password and _secret in the
      vault, or set composition_hermes_jarvis_dashboard to false.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_dashboard

- name: Assert API server key is set when the API server is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_api_server_key | length > 0
    fail_msg: >-
      composition_hermes_jarvis_api_server is true but no key is set. Without
      API_SERVER_KEY anything on {{ default_docker_network }} could drive the
      agent. Set vault_hermes_jarvis_api_server_key.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_api_server

- name: Assert Matrix connection details are set when the platform is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_matrix_homeserver | length > 0
      - composition_hermes_jarvis_matrix_access_token | length > 0
      - composition_hermes_jarvis_matrix_user_id | length > 0
    fail_msg: >-
      composition_hermes_jarvis_matrix is true but homeserver, access token
      and/or user id is unset. Hermes requires all three
      (hermes_cli/web_server_messaging.py required_env) - set
      composition_hermes_jarvis_matrix_homeserver and _user_id, and
      vault_hermes_jarvis_matrix_access_token in the vault.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_matrix

# The image remaps its internal `hermes` user to HERMES_UID/HERMES_GID, so the
# data directory has to be owned by whoever Ansible connects as.
- name: Look up the deploy user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"
  when: state | default('present') == 'present'

- name: Set the container uid and gid
  ansible.builtin.set_fact:
    composition_hermes_jarvis_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] }}"
    composition_hermes_jarvis_gid: "{{ ansible_facts.getent_passwd[ansible_user][2] }}"
  when: state | default('present') == 'present'

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present'

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  # Holds the dashboard password and cookie secret, which --diff would
  # otherwise print in full.
  no_log: true
  when: state | default('present') == 'present'

# ----------------------------
# Specific tasks
# ----------------------------

- name: Ensure the Hermes data directory exists
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes' bootstrap chmods /opt/data to 0700 on every start; match it so
    # the play stays idempotent.
    mode: "0700"
  when: state | default('present') == 'present'

# This container has exactly one Hermes identity: the built-in "default"
# profile. config.yaml.j2 reads composition_hermes_jarvis_* directly, so no
# per-call vars are needed here (unlike composition-hermes-agent, which
# multiplexed several profiles through one container - see README for why
# that's gone).
- name: Deploy Hermes config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ composition_config }}/data/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes normalises this file to 0640 on start; match it for idempotency.
    mode: "0640"
  when: state | default('present') == 'present' and composition_hermes_jarvis_manage_config
  notify: Restart Hermes

# The noreply email needs the account's numeric ID; the login alone only
# works for accounts created before July 2017.
- name: Look up the GitHub account the agent commits as
  ansible.builtin.uri:
    url: "https://api.github.com/users/{{ composition_hermes_jarvis_git_github_login }}"
    return_content: true
  register: _hermes_jarvis_git_github_user
  when: state | default('present') == 'present' and composition_hermes_jarvis_git_github_login | length > 0

- name: Deploy git config for the agent
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ composition_config }}/data/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present' and composition_hermes_jarvis_git_github_login | length > 0

# hermes_cli/env_loader.py loads /opt/data/.env with override=True, so that
# file beats the container environment for any key it defines - the reverse
# of what this role's .environment_vars assumes. The image ships .env as a
# 545-line commented example, and `hermes setup` appends a generated
# API_SERVER_KEY to it, which then silently shadows ours: the API server
# answers 401 to the key Ansible handed to every client.
#
# Deleting the line puts .environment_vars back in charge. Safe to do: no
# code path regenerates the key (the server refuses to start without one
# rather than minting one), and API_SERVER_KEY is not in env_loader's
# narrow _PROFILE_MANAGED_ENV_KEYS clear-list, so dropping it from .env
# does not also strip the inherited value.
#
# It is the only key that collides today - MATRIX_*, GATEWAY_MCP_TOKEN and
# HERMES_DASHBOARD_* appear in .env as comments only.
- name: Stop /opt/data/.env shadowing the API server key from .environment_vars
  ansible.builtin.lineinfile:
    path: "{{ composition_config }}/data/.env"
    regexp: '^\s*API_SERVER_KEY\s*='
    state: absent
  when: state | default('present') == 'present' and composition_hermes_jarvis_api_server
  notify: Restart Hermes

- name: Deploy basic-memory plugin config
  ansible.builtin.template:
    src: basic-memory.json.j2
    dest: "{{ composition_config }}/data/basic-memory.json"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present' and composition_hermes_jarvis_basic_memory_path | length > 0
  notify: Restart Hermes

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  when: state | default('present') == 'present'
  notify: Restart Traefik

# ----------------------------
# Basic Memory plugin
# Installed with Hermes' own installer and uv, inside the running container,
# as the hermes user. Both land under /opt/data, so they survive image pulls.
# Enabling is config.yaml's job (plugins.enabled, memory.provider).
# ----------------------------

- name: Read installed plugin metadata
  ansible.builtin.slurp:
    src: "{{ composition_config }}/data/plugins/.install-metadata.json"
  register: _hermes_jarvis_plugin_meta
  failed_when: false
  when: state | default('present') == 'present' and composition_hermes_jarvis_basic_memory_path | length > 0

- name: Install the basic-memory Hermes plugin at the pinned commit
  community.docker.docker_container_exec:
    container: "{{ composition_name }}"
    user: hermes
    env:
      HOME: /opt/data
    argv:
      - hermes
      - plugins
      - install
      - basicmachines-co/basic-memory/integrations/hermes
      - --ref
      - "{{ composition_hermes_jarvis_basic_memory_plugin_ref }}"
      - --force
      - --no-enable
  when:
    - state | default('present') == 'present'
    - composition_hermes_jarvis_basic_memory_path | length > 0
    - >-
      ((_hermes_jarvis_plugin_meta.content | default('e30=') | b64decode | from_json)
        ['basic-memory'] | default({})).revision | default('')
      != composition_hermes_jarvis_basic_memory_plugin_ref
  notify: Restart Hermes

- name: Check the installed bm CLI and sqlite-vec versions
  community.docker.docker_container_exec:
    container: "{{ composition_name }}"
    user: hermes
    argv:
      - /opt/data/.local/share/uv/tools/basic-memory/bin/python
      - -c
      - >-
        import importlib.metadata as m;
        print(*(p + "==" + m.version(p) for p in ("basic-memory", "sqlite-vec")))
  register: _hermes_jarvis_bm_version
  changed_when: false
  failed_when: false
  when: state | default('present') == 'present' and composition_hermes_jarvis_basic_memory_path | length > 0

# The plugin would otherwise self-install the latest prerelease on first use.
- name: Install the pinned bm CLI
  community.docker.docker_container_exec:
    container: "{{ composition_name }}"
    user: hermes
    env:
      HOME: /opt/data
    argv:
      - uv
      - tool
      - install
      - --force
      # Releases depend on pre-release fastmcp builds, but allowing
      # pre-releases wholesale also pulls sqlite-vec alphas built for AVX,
      # which agatha's Celeron lacks (SIGILL on first DB access). Pin the
      # stable build basic-memory's own image locks to.
      - --prerelease=allow
      - --with
      - "sqlite-vec=={{ composition_hermes_jarvis_basic_memory_sqlite_vec_version }}"
      - "basic-memory=={{ composition_hermes_jarvis_basic_memory_version }}"
  when:
    - state | default('present') == 'present'
    - composition_hermes_jarvis_basic_memory_path | length > 0
    - >-
      (_hermes_jarvis_bm_version.stdout | default('') | trim) !=
      'basic-memory==' ~ composition_hermes_jarvis_basic_memory_version
      ~ ' sqlite-vec==' ~ composition_hermes_jarvis_basic_memory_sqlite_vec_version
  notify: Restart Hermes
