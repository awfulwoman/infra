# code: language=ansible

# ----------------------------
# Remove composition (state: absent)
# ----------------------------

- name: Stop and remove Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: absent
    remove_orphans: true
  register: _hermes_compose_down
  failed_when:
    - _hermes_compose_down is failed
    - "'no such file or directory' not in (_hermes_compose_down.msg | default('') | lower)"
  when: state | default('present') == 'absent'

# The agent's whole state lives here: config.yaml, memories, skills, cron,
# sessions, logs. Removing the composition removes it. The ZFS dataset itself
# is left behind - destroying it is not something a play should do silently.
- name: Remove the Hermes data directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: absent
  when: state | default('present') == 'absent'

- name: Remove compose and environment files
  become: true
  ansible.builtin.file:
    path: "{{ composition_root }}/{{ absent_file }}"
    state: absent
  loop_control:
    loop_var: absent_file
  loop:
    - docker-compose.yaml
    - .environment_vars
    - github-app.pem
    - gh-shim.sh
    - mint-github-token.sh
  when: state | default('present') == 'absent'

- name: Remove GitHub token timer and units
  become: true
  block:
    - name: Stop the timer
      ansible.builtin.systemd:
        name: "{{ composition_name }}-github-token.timer"
        state: stopped
        enabled: false
      failed_when: false
    - name: Remove the unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ composition_name }}-github-token.{{ unit }}"
        state: absent
      loop: [service, timer]
      loop_control:
        loop_var: unit
  when: state | default('present') == 'absent'

# ----------------------------
# Preflight
# ----------------------------

- name: Assert dashboard credentials are set
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_dashboard_username | length > 0
      - composition_hermes_jarvis_dashboard_password | length > 0
      - composition_hermes_jarvis_dashboard_secret | length > 0
    fail_msg: >-
      The Hermes dashboard binds beyond loopback so Traefik can reach it, and
      Hermes fails closed unless an auth provider is configured. Set
      vault_hermes_jarvis_dashboard_username, _password and _secret in the
      vault, or set composition_hermes_jarvis_dashboard to false.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_dashboard

- name: Assert API server key is set when the API server is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_api_server_key | length > 0
    fail_msg: >-
      composition_hermes_jarvis_api_server is true but no key is set. Without
      API_SERVER_KEY anything on {{ default_docker_network }} could drive the
      agent. Set vault_hermes_jarvis_api_server_key.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_api_server

- name: Assert Matrix connection details are set when the platform is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_matrix_homeserver | length > 0
      - composition_hermes_jarvis_matrix_access_token | length > 0
      - composition_hermes_jarvis_matrix_user_id | length > 0
    fail_msg: >-
      composition_hermes_jarvis_matrix is true but homeserver, access token
      and/or user id is unset. Hermes requires all three
      (hermes_cli/web_server_messaging.py required_env) - set
      composition_hermes_jarvis_matrix_homeserver and _user_id, and
      vault_hermes_jarvis_matrix_access_token in the vault.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_matrix

- name: Assert GitHub App details are set when the App is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_jarvis_github_app_slug | length > 0
      - composition_hermes_jarvis_github_app_id | length > 0
      - composition_hermes_jarvis_github_app_installation_id | length > 0
      - vault_github_app_private_key | default('') | length > 0
      - composition_hermes_jarvis_github_app or not composition_hermes_jarvis_gh
    fail_msg: >-
      composition_hermes_jarvis_github_app is true but the App slug, id,
      installation id or vault_github_app_private_key is unset.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

# The image remaps its internal `hermes` user to HERMES_UID/HERMES_GID, so the
# data directory has to be owned by whoever Ansible connects as.
- name: Look up the deploy user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"
  when: state | default('present') == 'present'

- name: Set the container uid and gid
  ansible.builtin.set_fact:
    composition_hermes_jarvis_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] }}"
    composition_hermes_jarvis_gid: "{{ ansible_facts.getent_passwd[ansible_user][2] }}"
  when: state | default('present') == 'present'

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present'

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  # Holds the dashboard password and cookie secret, which --diff would
  # otherwise print in full.
  no_log: true
  when: state | default('present') == 'present'

# ----------------------------
# Specific tasks
# ----------------------------

- name: Ensure the Hermes data directory exists
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes' bootstrap chmods /opt/data to 0700 on every start; match it so
    # the play stays idempotent.
    mode: "0700"
  when: state | default('present') == 'present'

# This container has exactly one Hermes identity: the built-in "default"
# profile. config.yaml.j2 reads composition_hermes_jarvis_* directly, so no
# per-call vars are needed here (unlike composition-hermes-agent, which
# multiplexed several profiles through one container - see README for why
# that's gone).
- name: Deploy Hermes config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ composition_config }}/data/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes normalises this file to 0640 on start; match it for idempotency.
    mode: "0640"
  when: state | default('present') == 'present' and composition_hermes_jarvis_manage_config
  notify: Restart Hermes

# GitHub App token: key and mint helper on the host (outside the container
# mount), refreshed by a systemd timer into /opt/data/.gh-token.
- name: Deploy the GitHub App private key
  ansible.builtin.copy:
    content: "{{ vault_github_app_private_key }}"
    dest: "{{ composition_hermes_jarvis_github_app_key_file }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

- name: Deploy the GitHub App token mint helper
  ansible.builtin.template:
    src: mint-github-token.sh.j2
    dest: "{{ composition_hermes_jarvis_github_mint_helper }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

- name: Deploy GitHub token systemd units
  become: true
  ansible.builtin.template:
    src: "github-token.{{ unit }}.j2"
    dest: "/etc/systemd/system/{{ composition_name }}-github-token.{{ unit }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  loop_control:
    loop_var: unit
  register: _hermes_jarvis_github_units
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

- name: Mint the first GitHub token now
  become: true
  ansible.builtin.systemd:
    name: "{{ composition_name }}-github-token.service"
    state: started
    daemon_reload: "{{ _hermes_jarvis_github_units is changed }}"
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

- name: Enable the GitHub token refresh timer
  become: true
  ansible.builtin.systemd:
    name: "{{ composition_name }}-github-token.timer"
    state: started
    enabled: true
  when: state | default('present') == 'present' and composition_hermes_jarvis_github_app

# gh CLI: static binary on the data volume plus a token-reading shim that the
# compose file bind-mounts at /usr/local/bin/gh.
- name: Create the gh bin directory
  ansible.builtin.file:
    path: "{{ composition_hermes_jarvis_gh_bin_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: state | default('present') == 'present' and composition_hermes_jarvis_gh

- name: Check the installed gh version
  ansible.builtin.command: "{{ composition_hermes_jarvis_gh_bin_dir }}/gh-real --version"
  register: _hermes_jarvis_gh_current
  changed_when: false
  failed_when: false
  when: state | default('present') == 'present' and composition_hermes_jarvis_gh

- name: Install gh
  when:
    - state | default('present') == 'present'
    - composition_hermes_jarvis_gh
    - composition_hermes_jarvis_gh_version not in (_hermes_jarvis_gh_current.stdout | default(''))
  block:
    # Scratch dir, not bin_dir: something else may already have left a `gh`
    # there, and a `creates` guard on it would skip the download.
    - name: Create a scratch directory for the gh release
      ansible.builtin.tempfile:
        state: directory
        prefix: gh-
      register: _hermes_jarvis_gh_tmp
    - name: Download and extract the gh release
      ansible.builtin.unarchive:
        src: "https://github.com/cli/cli/releases/download/v{{ composition_hermes_jarvis_gh_version }}/gh_{{ composition_hermes_jarvis_gh_version }}_linux_{{ composition_hermes_jarvis_gh_arch }}.tar.gz"
        dest: "{{ _hermes_jarvis_gh_tmp.path }}"
        remote_src: true
        extra_opts:
          - --strip-components=2
          - --wildcards
          - "*/bin/gh"
    - name: Put the binary at its final name
      ansible.builtin.copy:
        src: "{{ _hermes_jarvis_gh_tmp.path }}/gh"
        dest: "{{ composition_hermes_jarvis_gh_bin_dir }}/gh-real"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
  always:
    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ _hermes_jarvis_gh_tmp.path }}"
        state: absent
      when: _hermes_jarvis_gh_tmp.path is defined

- name: Deploy the gh shim
  ansible.builtin.template:
    src: gh-shim.sh.j2
    dest: "{{ composition_hermes_jarvis_gh_shim }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: state | default('present') == 'present' and composition_hermes_jarvis_gh

# The noreply email needs the account's numeric ID; the login alone only
# works for accounts created before July 2017.
- name: Look up the GitHub account the agent commits as
  ansible.builtin.uri:
    url: "https://api.github.com/users/{{ (composition_hermes_jarvis_github_app_slug ~ '%5Bbot%5D') if composition_hermes_jarvis_github_app else composition_hermes_jarvis_git_github_login }}"
    return_content: true
  register: _hermes_jarvis_git_github_user
  when: state | default('present') == 'present' and (composition_hermes_jarvis_github_app or composition_hermes_jarvis_git_github_login | length > 0)

- name: Deploy git config for the agent
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ composition_config }}/data/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present' and (composition_hermes_jarvis_github_app or composition_hermes_jarvis_git_github_login | length > 0)

# hermes_cli/env_loader.py loads /opt/data/.env with override=True, so that
# file beats the container environment for any key it defines - the reverse
# of what this role's .environment_vars assumes. The image ships .env as a
# 545-line commented example, and `hermes setup` appends a generated
# API_SERVER_KEY to it, which then silently shadows ours: the API server
# answers 401 to the key Ansible handed to every client.
#
# Deleting the line puts .environment_vars back in charge. Safe to do: no
# code path regenerates the key (the server refuses to start without one
# rather than minting one), and API_SERVER_KEY is not in env_loader's
# narrow _PROFILE_MANAGED_ENV_KEYS clear-list, so dropping it from .env
# does not also strip the inherited value.
#
# It is the only key that collides today - MATRIX_*, GATEWAY_MCP_TOKEN and
# HERMES_DASHBOARD_* appear in .env as comments only.
- name: Stop /opt/data/.env shadowing the API server key from .environment_vars
  ansible.builtin.lineinfile:
    path: "{{ composition_config }}/data/.env"
    regexp: '^\s*API_SERVER_KEY\s*='
    state: absent
  when: state | default('present') == 'present' and composition_hermes_jarvis_api_server
  notify: Restart Hermes

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  when: state | default('present') == 'present'
  notify: Restart Traefik
