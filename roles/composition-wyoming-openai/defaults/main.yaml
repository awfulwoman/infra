# code: language=ansible
# Composition name (used by composition-common dependency)
composition_name: wyoming-openai

# Wyoming is a TCP protocol, not HTTP — no Traefik subdomain.
composition_dns_subdomains: []

# TTS backend: malcolm's Ollama, over its OpenAI-compatible /v1 endpoint.
composition_wyoming_openai_tts_url: "{{ llm_default_openai_uri }}"

# Two dedicated models, one per language, each its own shim service. The
# multilingual model normalizes numbers/times with the voice's language, so
# non-English voices read English text's numbers natively; a dedicated model
# normalizes correctly for its own language. The proxy applies every voice to
# every model, so the two disjoint voice sets cannot share one instance.
#
# English (US + UK + character voices), phonon:latest — Apache 2.0, 43.5M.
composition_wyoming_openai_en_port: 10300
composition_wyoming_openai_en_model: "phonon:latest"
composition_wyoming_openai_en_voices:
  # US English
  Zoey: "US - Zoey"
  Juniper: "US - Juniper"
  Everly: "US - Everly"
  Harper: "US - Harper"
  Hadley: "US - Hadley"
  Delia: "US - Delia"
  Easton: "US - Easton"
  Micah: "US - Micah"
  Trevor: "US - Trevor"
  Russell: "US - Russell"
  Preston: "US - Preston"
  Miles: "US - Miles"
  # UK English
  Maeve: "UK - Maeve"
  Freya: "UK - Freya"
  Pippa: "UK - Pippa"
  Elodie-Rose: "UK - Elodie-Rose"
  Imogen: "UK - Imogen"
  Lottie: "UK - Lottie"
  Bryony: "UK - Bryony"
  Alfie: "UK - Alfie"
  Hugh: "UK - Hugh"
  Edwin: "UK - Edwin"
  Spencer: "UK - Spencer"
  Toby: "UK - Toby"
  Teddy: "UK - Teddy"
  # Character voices
  Captain Silas Blackwater: "CHAR - Captain Silas Blackwater"
  Morwenna of the Deep: "CHAR - Morwenna of the Deep"
  Old Mortlake: "CHAR - Old Mortlake"
  Azgorath: "CHAR - Azgorath"
  Fennick the Young Elf: "CHAR - Fennick the Young Elf"
  The Thing Under the Stairs: "CHAR - The Thing Under the Stairs"
  Vyrmathrax the Ancient: "CHAR - Vyrmathrax the Ancient"
  Grub the Ogre: "CHAR - Grub the Ogre"
  Master Aldric: "CHAR - Master Aldric"
  The Snow Queen: "CHAR - The Snow Queen"
  Sir Bramwell: "CHAR - Sir Bramwell"
  Fairy Godmother: "CHAR - Fairy Godmother"

# German, phonon:40m-de — CC BY-NC 4.0 (non-commercial, fine for home use).
composition_wyoming_openai_de_port: 10301
composition_wyoming_openai_de_model: "phonon:40m-de"
composition_wyoming_openai_de_voices:
  Nele: "DE - Nele"
  Jette: "DE - Jette"
  Annika: "DE - Annika"
  Jule: "DE - Jule"
  Lotta: "DE - Lotta"
  Josefine: "DE - Josefine"
