# code: language=ansible
# Composition name (used by composition-common dependency)
composition_name: wyoming-openai

# Wyoming is a TCP protocol, not HTTP — no Traefik subdomain.
composition_dns_subdomains: []

# Wyoming TCP port, published on the host for HA's Wyoming integration to
# reach. The container always listens on 10300.
composition_wyoming_openai_port: 10300

# TTS backend: malcolm's Ollama, over its OpenAI-compatible /v1 endpoint.
# Phonon is text-to-speech only, so this composition exposes TTS and no STT.
composition_wyoming_openai_tts_url: "{{ llm_default_openai_uri }}"

# One model, phonon:40m-multilingual, carries every voice (US/UK English,
# German, French, Spanish, Portuguese), so a single shim instance can offer
# them all — the proxy applies every configured voice to every model, which
# breaks disjoint per-model voice sets. CC BY-NC 4.0 (non-commercial), fine
# for home use.
composition_wyoming_openai_tts_models: "phonon:40m-multilingual"

# Region-prefixed display names for HA's voice picker. Keys are the phonon
# voice names (also used as TTS_VOICES); values are what HA shows. Names must
# stay single-word: the shim parses TTS_VOICES with .split(), so the multi-word
# English "character" voices (Captain Silas Blackwater, ...) cannot be included.
composition_wyoming_openai_tts_voice_labels:
  # US English
  Zoey: "US - Zoey"
  Juniper: "US - Juniper"
  Everly: "US - Everly"
  Harper: "US - Harper"
  Hadley: "US - Hadley"
  Delia: "US - Delia"
  Easton: "US - Easton"
  Micah: "US - Micah"
  Trevor: "US - Trevor"
  Russell: "US - Russell"
  Preston: "US - Preston"
  Miles: "US - Miles"
  # UK English
  Maeve: "UK - Maeve"
  Freya: "UK - Freya"
  Pippa: "UK - Pippa"
  Elodie-Rose: "UK - Elodie-Rose"
  Imogen: "UK - Imogen"
  Lottie: "UK - Lottie"
  Bryony: "UK - Bryony"
  Alfie: "UK - Alfie"
  Hugh: "UK - Hugh"
  Edwin: "UK - Edwin"
  Spencer: "UK - Spencer"
  Toby: "UK - Toby"
  Teddy: "UK - Teddy"
  # German
  Nele: "DE - Nele"
  Jette: "DE - Jette"
  Annika: "DE - Annika"
  Jule: "DE - Jule"
  Lotta: "DE - Lotta"
  Josefine: "DE - Josefine"
  Svea: "DE - Svea"
  Anton: "DE - Anton"
  Mirko: "DE - Mirko"
  Mats: "DE - Mats"
  Henrik: "DE - Henrik"
  Leon: "DE - Leon"
  Mika: "DE - Mika"

composition_wyoming_openai_languages: "en de"
