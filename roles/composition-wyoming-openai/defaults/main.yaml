# code: language=ansible
# Composition name (used by composition-common dependency)
composition_name: wyoming-openai

# Wyoming is a TCP protocol, not HTTP — no Traefik subdomain.
composition_dns_subdomains: []

# Wyoming TCP port, published on the host for HA's Wyoming integration to
# reach. The container always listens on 10300.
composition_wyoming_openai_port: 10300

# TTS backend: malcolm's Ollama, over its OpenAI-compatible /v1 endpoint.
# Phonon is text-to-speech only, so this composition exposes TTS and no STT.
composition_wyoming_openai_tts_url: "{{ llm_default_openai_uri }}"

# One model, phonon:40m-multilingual, carries every voice (US/UK English,
# German, French, Spanish, Portuguese), so a single shim instance can offer
# them all — the proxy applies every configured voice to every model, which
# breaks disjoint per-model voice sets. CC BY-NC 4.0 (non-commercial), fine
# for home use.
composition_wyoming_openai_tts_models: "phonon:40m-multilingual"

# US + UK + German catalogue voices. Single-word names only: the shim parses
# TTS_VOICES with .split(), so the multi-word English "character" voices
# (Captain Silas Blackwater, Fairy Godmother, ...) cannot pass through it.
composition_wyoming_openai_tts_voices: >-
  Zoey Juniper Everly Harper Hadley Delia Easton Micah Trevor Russell Preston Miles
  Maeve Freya Pippa Elodie-Rose Imogen Lottie Bryony Alfie Hugh Edwin Spencer Toby Teddy
  Nele Jette Annika Jule Lotta Josefine Svea Anton Mirko Mats Henrik Leon Mika

composition_wyoming_openai_languages: "en de"
