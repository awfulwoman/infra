# Composition name (used by composition-common dependency)
composition_name: open-webui

composition_dns_subdomains:
  - chat

# Ollama API URL. Defaults to the shared llm_default_ollama_base_url (Malcolm).
# Override per-host if Ollama is running elsewhere.
composition_open_webui_ollama_base_url: "{{ llm_default_ollama_base_url }}"

# -------------------------------------------------------------------
# OPENAI-COMPATIBLE ENDPOINTS
# Anything that speaks /v1/models and /v1/chat/completions can be added
# here alongside Ollama - another inference server, or an agent that
# fronts one (see composition-hermes-jarvis' api_server).
#
# A list of {url, key} pairs. Open WebUI takes these as two separate
# semicolon-separated env lists matched up by position, so both fields are
# mandatory - tasks/main.yaml asserts that. Empty list turns the whole
# OpenAI connector off, leaving Ollama as the only backend.
# -------------------------------------------------------------------
composition_open_webui_openai_apis: []

# -------------------------------------------------------------------
# CONFIG PERSISTENCE
# Open WebUI's env vars are only a FIRST-BOOT SEED: it copies them into
# the `config` table in webui.db, and from then on the DB wins
# (models/config.py seed_defaults: "Existing DB values take precedence
# over defaults", inserting only `if key not in existing_keys`).
#
# That silently breaks key rotation - change the vault key, redeploy, and
# Hermes moves to the new key while Open WebUI keeps serving the old one
# out of its database, with the vault, both .environment_vars and
# `printenv` all showing the new value.
#
# False makes persistent_enabled_for() return False for every key, so
# Config.get() falls back to the env-derived default on every boot and
# this role stays authoritative. The trade: settings changed in the admin
# UI no longer survive a restart - all config has to come from here.
# Chats, users, models and prompts are separate tables and unaffected.
# -------------------------------------------------------------------
composition_open_webui_persistent_config: false

# Open WebUI's own login. On: Tailscale decides who can reach the host, not
# who may drive what is behind it, and an entry in
# composition_open_webui_openai_apis can be an agent with a shell (Hermes'
# terminal toolset runs inside its container). The first account created
# becomes the admin.
#
# This only travels one way on a live install - Open WebUI refuses to
# disable auth once any user exists - so going back to false means clearing
# the data directory first.
composition_open_webui_auth: true
