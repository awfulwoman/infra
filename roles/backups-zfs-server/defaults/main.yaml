backups_zfs_server_debug: false
backups_zfs_server_cron_hour: "10,12,16,20,0"
backups_zfs_server_cron_minute: "0"
backups_zfs_server_logging_dir: /opt/zfsbackup/logs
backups_zfs_server_logging_successfile: backups.log
backups_zfs_server_logging_errorfile: error.log
backups_zfs_server_script_path: /opt/zfsbackup
backups_zfs_server_local_dataset: slowpool/encryptedbackups
backups_zfs_server_pull_group: zfs_backup_clients # The ansible group that we try to pull backup data from

# Offsite push configuration
backups_zfs_server_offsite_enabled: false # Set to true to enable offsite replication
backups_zfs_server_offsite_group: zfs-backup-offsite # The ansible group containing offsite hosts
backups_zfs_server_offsite_cron_hour: "2" # Run offsite push at 2 AM (after pull completes)
backups_zfs_server_offsite_cron_minute: "30"
backups_zfs_server_offsite_bwlimit: "" # Bandwidth limit (e.g., "10m" for 10MB/s), empty for unlimited

# Healthchecks.io integration
# When enabled, creates one check per client host and pings after each successful pull.
backups_zfs_server_healthchecksio_enabled: false
backups_zfs_server_healthchecksio_api_key: "{{ vault_healthchecks_rw_apikey }}"

# MQTT staleness alerting
# When enabled, publishes pull status to MQTT after each successful pull.
backups_zfs_server_mqtt_enabled: false
backups_zfs_server_mqtt_host: "mqtt.{{ domainname_infra }}"
backups_zfs_server_mqtt_topic_prefix: "homeinfra/monitoring/zfs"
backups_zfs_server_stale_threshold_multiplier: 2
backups_zfs_server_mqtt_expire_after: 93600 # 26h, matching the healthchecks grace; longest cron gap is 10h
backups_zfs_server_stale_lock_hours: 24 # a pull still holding the lock past this is wedged, not merely slow

# ZFS holds on the client's snapshots.
#
# The pull keeps one hold per dataset, on the snapshot the replica currently
# sits on, so the client's retention cannot prune the common base out from
# under an incremental send. Without this, an outage longer than retention
# ends replication for that dataset permanently and silently.
#
# The cost: if this backup server is retired, its holds stay behind and pin
# one snapshot per dataset on every client. Release them with
# `zfs release <tag> <snapshot>` before decommissioning.
backups_zfs_server_hold_enabled: true
backups_zfs_server_hold_tag: "zfsbackup-{{ inventory_hostname }}"

# Minutes between each client's pull. Seven clients at 7 minutes spans 42
# minutes, well inside the smallest gap in the schedule.
backups_zfs_server_cron_stagger_minutes: 7

# One lock shared by every pull and push, so only one replication job runs on
# this host at a time. The stagger alone spaces out the starts, but a pull
# that outlasts its slot still overlaps the next client's. A job that cannot
# get the lock within the wait gives up without running, sends no healthcheck
# ping, and is caught by the healthcheck grace. 90 minutes sits inside the
# smallest gap in the pull schedule (10:00 to 12:00).
backups_zfs_server_global_lock: /run/zfs-backups.lock
backups_zfs_server_global_lock_wait_seconds: 5400
