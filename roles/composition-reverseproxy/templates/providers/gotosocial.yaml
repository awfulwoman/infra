tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  routers:
    gotosocial:
      service: gotosocial
      rule: "Host(`gts.awfulwoman.com`)"
      tls:
        certresolver: letsencrypt
      entrypoints:
        - web
        - websecure
      middlewares:
        - secHeaders
        - https-redirect

  middlewares:
    secHeaders:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
    https-redirect:
      redirectScheme:
        scheme: https

  services:
    gotosocial:
      loadBalancer:
        passHostHeader: true
        servers:
          # composition-gotosocial runs on storage and publishes 8085. Reached
          # over the tailnet, by inventory fact rather than a literal 100.x, so
          # a re-addressed device does not silently break the public site.
          - url: "http://{{ hostvars['server-64gb-storage']['host_tailscale_ipv4'] }}:8085"
