tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  routers:
    gotosocial:
      service: gotosocial
      rule: "Host(`gts.awfulwoman.com`)"
      # Certificate comes from reverseproxy_extra_cert_dirs, matched by SNI.
      tls: {}
      entrypoints:
        - web
        - websecure
      middlewares:
        - secHeaders
        - https-redirect

  middlewares:
    secHeaders:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
    https-redirect:
      redirectScheme:
        scheme: https

  services:
    gotosocial:
      loadBalancer:
        passHostHeader: true
        servers:
          # composition-gotosocial runs on this host, same docker network.
          - url: "http://gotosocial:8080"
