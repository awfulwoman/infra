tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  routers:
    gateway:
      service: gateway
      rule: "Host(`gateway.{{ domainname_infra }}`)"
{% if reverseproxy_use_letsencrypt and not reverseproxy_wildcard_cert %}
      tls:
        certresolver: letsencrypt
{% else %}
      # Empty mapping, not an omitted key: the router still terminates TLS,
      # it just takes the default cert (the internal wildcard) instead of
      # asking ACME. Guarded because this is an internal name; the public
      # providers (gotosocial, personalsite) stay unguarded. See #276.
      tls: {}
{% endif %}
      entrypoints:
        - web
        - websecure
      middlewares:
        - secHeaders
        - https-redirect

  middlewares:
    secHeaders:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
    https-redirect:
      redirectScheme:
        scheme: https

  services:
    gateway:
      loadBalancer:
        responseForwarding:
          flushInterval: "100ms"
        passHostHeader: true
        servers:
          - url: "http://{{ llm_default_host }}:4000"
