tls:
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  routers:
    immich:
      service: immich
      rule: "Host(`immich.{{ domainname_infra }}`)"
{% if reverseproxy_use_letsencrypt and not reverseproxy_wildcard_cert %}
      tls:
        certresolver: letsencrypt
{% else %}
      # Empty mapping, not an omitted key: the router still terminates TLS,
      # it just takes the default cert (the internal wildcard) instead of
      # asking ACME. Guarded because this is an internal name; the public
      # providers (gotosocial, personalsite) stay unguarded. See #276.
      tls: {}
{% endif %}
      entrypoints:
        - websecure
        # websecure:
        #   address: :443
        #   transport:
        #     respondingTimeouts:
        #       readTimeout: 600s
        #       idleTimeout: 600s
        #       writeTimeout: 600s
      middlewares:
        - secHeaders
        - https-redirect

  middlewares:
    secHeaders:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
    https-redirect:
      redirectScheme:
        scheme: https

  services:
    immich:
      loadBalancer:
        passHostHeader: true
        servers:
          # - url: "http://172.17.0.1:8123"
          - url: "http://172.20.0.5:2283"
