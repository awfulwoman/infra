# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# ----------------------------
# Specific tasks
# ----------------------------

- name: "Template out config file"
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: "{{ composition_config }}/traefik.yaml"

- name: "Create providers dir"
  ansible.builtin.file:
    dest: "{{ composition_config }}/providers"
    state: directory
  when: traefik_providers is defined

- name: "Template out providers file"
  become: true
  ansible.builtin.template:
    src: "templates/providers/{{ traefik_provider }}.yaml"
    dest: "{{ composition_config }}/providers/{{ traefik_provider }}.yaml"
  loop: "{{ traefik_providers }}"
  loop_control:
    loop_var: traefik_provider
  when: traefik_providers is defined

- name: "Template out VM routes provider file"
  become: true
  ansible.builtin.template:
    src: "providers/vm-routes.yaml.j2"
    dest: "{{ composition_config }}/providers/vm-routes.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: reverseproxy_vm_routes is defined

- name: "Create letsencrypt dir"
  become: true
  ansible.builtin.file:
    dest: "{{ composition_config }}/letsencrypt"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: "Touch letsencrypt file"
  become: true
  ansible.builtin.copy:
    content: ""
    dest: "{{ composition_config }}/letsencrypt/acme.json"
    force: false
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

# Dual-mode hosts only (#276). Where the wildcard is the default cert but the
# ACME resolver is still alive for genuinely public names, certificates issued
# for internal names before the flip have to be evicted from the store:
# Traefik's renewal loop walks the whole store regardless of what any router
# references, and an exact-name match beats the wildcard during SNI selection.
# Nothing re-creates them - the internal certresolver labels are guarded.
- name: "Prune internal-domain certs from the ACME store"
  when:
    - reverseproxy_use_letsencrypt
    - reverseproxy_wildcard_cert
  block:
    - name: "Check the ACME store for internal-domain certs"
      become: true
      ansible.builtin.script:
        cmd: >-
          files/prune-acme-internal-certs.py
          {{ composition_config }}/letsencrypt/acme.json
          {{ domainname_infra }}
      register: _acme_prune_check
      changed_when: false

    - name: "Stop Traefik before rewriting the ACME store"
      # Traefik holds the store in memory and flushes it back on any
      # certificate change, so it would undo an edit made underneath it.
      become: true
      ansible.builtin.command:
        cmd: docker stop traefik
      register: _acme_prune_stop
      changed_when: _acme_prune_stop.rc == 0
      failed_when:
        - _acme_prune_stop.rc != 0
        - "'No such container' not in _acme_prune_stop.stderr"
      when: "'REMOVED=0' not in _acme_prune_check.stdout"

    - name: "Remove internal-domain certs from the ACME store"
      become: true
      ansible.builtin.script:
        cmd: >-
          files/prune-acme-internal-certs.py
          {{ composition_config }}/letsencrypt/acme.json
          {{ domainname_infra }}
          --apply
      register: _acme_prune_apply
      changed_when: "'REMOVED=0' not in _acme_prune_apply.stdout"
      when: "'REMOVED=0' not in _acme_prune_check.stdout"
      notify: Restart Traefik

# Custom http responses

- name: Create directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ create_items }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop_control:
    loop_var: create_items
  loop:
    - nginx
    - www-catch-all
    - www-status-pages

- name: Copy content of directory 'files'
  ansible.builtin.copy:
    src: "files/{{ dir_item }}/"
    dest: "{{ composition_config }}/{{ dir_item }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop_control:
    loop_var: dir_item
  loop:
    - nginx
    - www-catch-all
    - www-status-pages

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: always
    remove_orphans: true
