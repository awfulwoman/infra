# code: language=ansible
---
- name: "Assert macOS"
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Darwin'
    fail_msg: "system-apple-calendar-server is macOS-only"

- name: "Ensure uv is installed"
  community.general.homebrew:
    name: uv
    state: present

- name: "Check if git host is in known_hosts"
  ansible.builtin.command:
    cmd: "ssh-keygen -F {{ system_apple_calendar_server_git_host }}"
  register: calendar_known_hosts_check
  changed_when: false
  failed_when: false

- name: "Add git host to known_hosts"
  ansible.builtin.shell: >
    ssh-keyscan {{ system_apple_calendar_server_git_host }}
    >> {{ ansible_facts.user_dir }}/.ssh/known_hosts
  when: calendar_known_hosts_check.rc != 0
  changed_when: true

- name: "Ensure repo parent directory exists"
  ansible.builtin.file:
    path: "{{ system_apple_calendar_server_repo_dir | dirname }}"
    state: directory
    mode: "0755"

- name: "Clone/update apple-calendar-server repo"
  ansible.builtin.git:
    repo: "git@{{ system_apple_calendar_server_git_host }}:{{ system_apple_calendar_server_repo }}.git"
    dest: "{{ system_apple_calendar_server_repo_dir }}"
    version: "{{ system_apple_calendar_server_repo_version }}"
    update: "{{ system_apple_calendar_server_repo_update }}"

- name: "Sync Python dependencies"
  ansible.builtin.command:
    cmd: /opt/homebrew/bin/uv sync
    chdir: "{{ system_apple_calendar_server_repo_dir }}"
  changed_when: false
  when: not ansible_check_mode

# TCC keys the Calendar grant to a *code identity* (identifier + signing cert),
# not the interpreter's cdhash, so it survives `uv sync` / Python bumps. That
# identity is SHARED with apple-reminders-server and apple-contacts-server: all
# three pin the same .python-version, so uv hard-links them to one CPython file,
# and `codesign --force` replaces the whole signature - if each signed with its
# own identifier the last deploy would break the other two grants. The
# system-apple-reminders-server role (deploys first) owns provisioning + trusting
# the shared cert; here we only re-sign. See the service repos' README and
# scripts/{setup_signing_cert,sign_runtime}.sh.
- name: "Check the shared code-signing identity is trusted"
  ansible.builtin.command:
    cmd: security find-certificate -c awfulwoman-apple-reminders-server-signing /Library/Keychains/System.keychain
  register: calendar_shared_cert
  changed_when: false
  failed_when: false

- name: "Fail if the shared code-signing identity is missing"
  ansible.builtin.fail:
    msg: >-
      Shared signing cert 'awfulwoman-apple-reminders-server-signing' is not
      trusted in the System keychain. Deploy system-apple-reminders-server first -
      it provisions and trusts the identity all three apple-*-server roles share.
  when:
    - not ansible_check_mode
    - calendar_shared_cert.rc != 0

- name: "Re-sign interpreter with the shared stable identity"
  ansible.builtin.command:
    cmd: ./scripts/sign_runtime.sh
    chdir: "{{ system_apple_calendar_server_repo_dir }}"
  environment:
    KEYCHAIN_PASSWORD: "{{ system_apple_calendar_server_keychain_password }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - calendar_shared_cert.rc == 0

- name: "Write .env file"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ system_apple_calendar_server_repo_dir }}/.env"
    mode: "0600"

- name: "Ensure log directory exists"
  ansible.builtin.file:
    path: "{{ system_apple_calendar_server_repo_dir }}/logs"
    state: directory
    mode: "0755"

- name: "Deploy LaunchAgent plist"
  ansible.builtin.template:
    src: apple-calendar-server.plist.j2
    dest: "{{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_calendar_server_plist_label }}.plist"
    mode: "0644"
  notify: Reload apple-calendar-server launchd agent

- name: "Check if launchd agent is bootstrapped"
  ansible.builtin.shell: launchctl print gui/$(id -u)/{{ system_apple_calendar_server_plist_label }}
  register: launchd_check
  failed_when: false
  changed_when: false

- name: "Bootstrap launchd agent"
  ansible.builtin.shell: launchctl bootstrap gui/$(id -u) {{ ansible_facts.user_dir }}/Library/LaunchAgents/{{ system_apple_calendar_server_plist_label }}.plist
  when: launchd_check.rc != 0
