# code: language=ansible
# GitHub account that owns the GHCR packages this host pulls.
# The password is vault_github_ghcr_read_token (a classic PAT with read:packages).
docker_ghcr_username: awfulwoman

# Weekly prune of images no container uses. Pinned tags (bumped by Renovate and
# deployed by Ansible) leave the old image behind, and Watchtower only cleans up
# images it replaced itself. Anything pulled within the window is kept.
docker_image_prune_enabled: true
docker_image_prune_keep_hours: 168
docker_image_prune_schedule: "Sun *-*-* 04:00:00"
