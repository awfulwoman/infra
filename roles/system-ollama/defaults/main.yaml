system_ollama_models: []
system_ollama_env: {}
system_ollama_bin: "{{ '/opt/homebrew/bin/ollama' if ansible_facts['os_family'] == 'Darwin' else '/usr/local/bin/ollama' }}"
# Plists Homebrew may create for its own ollama service (old and current
# naming). Removed on every run so only com.awfulwoman.ollama serves.
system_ollama_brew_plists:
  - homebrew.mxcl.ollama
  - sh.brew.ollama
