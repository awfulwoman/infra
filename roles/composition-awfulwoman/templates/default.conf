# Managed by Ansible (composition-awfulwoman).
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Docker's own resolver. The name below is looked up when a request needs it, so a webmention-server
    # that is down or not yet started never stops nginx from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # error_page normally works once per request. @missing below has its own, so allow it to chain.
    recursive_error_pages on;

    location / {
        error_page 404 = @missing;
    }

    # A page that is not here may have been deleted on purpose. webmention-server knows which, and says
    # 410 Gone for those, so that other sites drop their copies of our replies (Webmention section
    # 3.1.5). Everything else is a plain 404, shown with the site's own 404 page. If webmention-server
    # cannot be reached, that is also a 404.
    location @missing {
        set $webmention_server http://webmention-server:8000;
        proxy_pass $webmention_server/gone;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 404 /404.html;
        error_page 502 503 504 =404 /404.html;
    }

    location = /404.html {
        internal;
    }

    error_page   500  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
