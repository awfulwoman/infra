---
- name: Install dependencies (macOS)
  ansible.builtin.include_tasks: install-macos.yaml
  when: ansible_facts['os_family'] == 'Darwin'

- name: Install dependencies (Ubuntu/Debian)
  ansible.builtin.include_tasks: install-ubuntu.yaml
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure Claude settings path exists
  become: true
  ansible.builtin.file:
    path: "{{ system_claude_settings_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ system_claude_settings_group }}"
    mode: "0755"

- name: Check if Claude CLI is already installed
  ansible.builtin.command: which claude
  register: claude_installed
  changed_when: false
  failed_when: false

- name: Install Claude CLI
  when: claude_installed.rc != 0
  block:
    - name: Check if Homebrew is installed
      ansible.builtin.command: which brew
      register: brew_installed
      changed_when: false
      failed_when: false

    - name: Install Claude CLI via Homebrew
      community.general.homebrew:
        name: claude
        state: present
      when: brew_installed.rc == 0
      register: brew_claude_install
      failed_when: false

    - name: Install Claude CLI via install script
      when: brew_installed.rc != 0 or brew_claude_install.failed
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL {{ system_claude_install_url }} | bash -s -- {{ system_claude_channel }}
      args:
        creates: "{{ ansible_facts.user_dir }}/.local/bin/claude"
        executable: /bin/bash
      environment:
        HOME: "{{ ansible_facts.user_dir }}"
        # The installer runs over a non-interactive shell, so it cannot pick
        # this up from the profile. Without it the installer writes its
        # settings and state to ~/.claude and the configured directory is
        # left empty.
        CLAUDE_CONFIG_DIR: "{{ system_claude_settings_path }}"
      # noqa command-instead-of-module: Using shell to pipe curl to bash for installation script

- name: Ensure .local/bin is in PATH
  when: system_claude_ensure_path
  block:
    - name: Check if PATH export already exists in profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.user_dir }}/{{ system_claude_profile_file }}"
        regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
        state: absent
      check_mode: true
      register: path_check
      changed_when: false

    - name: Add .local/bin to PATH in shell profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.user_dir }}/{{ system_claude_profile_file }}"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        mode: '0644'
      when: path_check.found == 0

- name: Set environment variables
  become: true
  ansible.builtin.lineinfile:
    path: "{{ system_claude_env_file }}"
    # Anchored on the variable name so changing a value rewrites its line
    # instead of appending a second, conflicting entry.
    regexp: "^{{ system_claude_env_export }}{{ item.key }}="
    line: "{{ system_claude_env_export }}{{ item.key }}={{ item.value }}"
    create: true
    mode: '0644'
  loop: "{{ system_claude_environment | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# The env file is read before the interactive profile on both platforms, so a
# stale export left in the profile would override the value just written and
# reintroduce the bug.
- name: Remove Claude environment variables from the interactive profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/{{ system_claude_profile_file }}"
    regexp: "^export {{ item.key }}="
    state: absent
  loop: "{{ system_claude_environment | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Allows scrolling in tmux
- name: Enable tmux mouse mode
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.user_dir }}/.tmux.conf"
    line: "set -g mouse on"
    create: true
    mode: "0644"
