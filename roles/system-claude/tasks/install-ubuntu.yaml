---
- name: Ensure dependencies are installed
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - yt-dlp
      - bubblewrap
      - socat
      - libonig-dev
    state: present

# gh is now a Homebrew formula (system_homebrew_formulae), not an apt package
# here. Remove the apt package, source and key this role used to manage, leaving
# brew's gh as the only one. The source goes before the key so apt never sees a
# source whose signed-by keyring has already been deleted (that would break
# every later `apt update`).
- name: Remove the apt gh package
  become: true
  ansible.builtin.apt:
    name: gh
    state: absent

- name: Remove the GitHub CLI apt source
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent

- name: Remove the GitHub CLI repository key
  become: true
  ansible.builtin.file:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
    state: absent
