---
- name: Ensure dependencies are installed
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - yt-dlp
      - bubblewrap
      - socat
      - libonig-dev
    state: present

# gh is now a Homebrew formula (system_homebrew_formulae), not an apt package
# here. Remove the apt package, repo and key this role used to manage, leaving
# brew's gh as the only one.
- name: Remove the apt gh package
  become: true
  ansible.builtin.apt:
    name: gh
    state: absent

- name: Remove the GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb https://cli.github.com/packages stable main"
    filename: github-cli
    state: absent

- name: Remove the GitHub CLI repository key
  become: true
  ansible.builtin.file:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
    state: absent
