---
# Claude CLI installation URL
system_claude_install_url: "https://claude.ai/install.sh"

# Claude CLI version channel (stable, latest, or specific version)
system_claude_channel: "latest"

# Ensure PATH is set in shell profile
system_claude_ensure_path: true

# Shell profile file to update (set per OS in tasks/main.yaml)
system_claude_profile_file: "{{ '.zshrc' if ansible_facts['os_family'] == 'Darwin' else '.bashrc' }}"

# File that receives the Claude environment variables.
#
# macOS uses .zshenv, NOT .zshrc. zsh sources .zshrc only for interactive
# shells, so anything started outside an interactive terminal — a GUI launch, a
# launchd agent, a non-interactive shell — never sees exports placed there, and
# Claude Code silently falls back to ~/.claude. .zshenv is sourced by every zsh
# invocation, which is what CLAUDE_CONFIG_DIR needs to be honoured however
# Claude Code is started.
system_claude_env_file: "{{ '.zshenv' if ansible_facts['os_family'] == 'Darwin' else system_claude_profile_file }}"

# Environment variables exported for Claude Code. Keyed by name so a changed
# value replaces its old line rather than appending a second export.
system_claude_environment:
  ANTHROPIC_MODEL: claude-sonnet-5
  CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: "false"
  CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
  CLAUDE_CONFIG_DIR: "{{ system_claude_settings_path }}"

# Directory for Claude settings and config
system_claude_settings_path: "{{ ansible_facts.user_dir }}/.config/claude"

# Group owner for the settings directory
# Ubuntu: matches ansible_user (users have an eponymous group)
# macOS: set to "staff" in host_vars
system_claude_settings_group: "{{ ansible_user }}"
