---
# Claude CLI installation URL
system_claude_install_url: "https://claude.ai/install.sh"

# Claude CLI version channel (stable, latest, or specific version)
system_claude_channel: "latest"

# Ensure PATH is set in shell profile
system_claude_ensure_path: true

# Shell profile file to update (set per OS in tasks/main.yaml)
system_claude_profile_file: "{{ '.zshrc' if ansible_facts['os_family'] == 'Darwin' else '.bashrc' }}"

# Absolute path of the file that receives the Claude environment variables.
#
# macOS uses .zshenv, NOT .zshrc. zsh sources .zshrc only for interactive
# shells, so anything started outside an interactive terminal — a GUI launch, a
# launchd agent, a non-interactive shell — never sees exports placed there, and
# Claude Code silently falls back to ~/.claude. .zshenv is sourced by every zsh
# invocation, which is what CLAUDE_CONFIG_DIR needs to be honoured however
# Claude Code is started.
#
# Ubuntu has the same hole and no equivalent file. Non-interactive bash does
# not read ~/.bashrc at all, and Ubuntu's stock .bashrc returns early for
# non-interactive shells even when it is sourced via ~/.profile — so exports
# placed there reach an interactive terminal and nothing else. /etc/environment
# is read by PAM for every login session, interactive or not, which is the
# closest match. It is system-wide rather than per-user; acceptable on these
# single-user hosts.
system_claude_env_file: "{{ (ansible_facts.user_dir ~ '/.zshenv') if ansible_facts['os_family'] == 'Darwin' else '/etc/environment' }}"

# /etc/environment is parsed by PAM, not sourced by a shell, so its lines carry
# no `export`. .zshenv is a shell script and needs it.
system_claude_env_export: "{{ 'export ' if ansible_facts['os_family'] == 'Darwin' else '' }}"

# Environment variables exported for Claude Code. Keyed by name so a changed
# value replaces its old line rather than appending a second export.
system_claude_environment:
  ANTHROPIC_MODEL: claude-sonnet-5-5
  CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: "false"
  CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
  CLAUDE_CONFIG_DIR: "{{ system_claude_settings_path }}"

# Directory for Claude settings and config
system_claude_settings_path: "{{ ansible_facts.user_dir }}/.config/claude"

# Group owner for the settings directory
# Ubuntu: matches ansible_user (users have an eponymous group)
# macOS: set to "staff" in host_vars
system_claude_settings_group: "{{ ansible_user }}"

# --- agentmemory ----------------------------------------------------------
# Connects Claude Code to composition-agentmemory (https://agentmemory.<domain>)
# through the @agentmemory/mcp stdio shim, registered at user scope. Needs
# system-nvm to run first. Off by default; enabled per host.
#
# The secret is NOT put in system_claude_environment: that file is
# /etc/environment on Ubuntu and is world-readable. It goes in a 0600 env file
# that a wrapper sources before starting Claude Code, so the shim (and the
# agentmemory plugin's hooks) inherit it.
system_claude_agentmemory: false
system_claude_agentmemory_url: "https://agentmemory.{{ domainname_infra }}"
system_claude_agentmemory_secret: "{{ vault_composition_agentmemory_secret }}"
# Keep in step with the image tag in composition-agentmemory.
system_claude_agentmemory_version: "0.9.33"
system_claude_agentmemory_env_file: "{{ system_claude_settings_path }}/agentmemory.env"
# `claude` stays the real binary; an alias in .bashrc points at this wrapper.
system_claude_wrapper_path: "{{ ansible_facts.user_dir }}/.local/bin/claude-agentmemory"
system_claude_binary: "{{ ansible_facts.user_dir }}/.local/bin/claude"
