# code: language=ansible

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Create Fluent Bit config directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/fluent-bit"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: Deploy Fluent Bit configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ composition_config }}/fluent-bit/{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0664"
  loop:
    - { src: fluent-bit.conf.j2, dest: fluent-bit.conf }
    - { src: fluent-bit-parsers.conf.j2, dest: parsers.conf }
  notify: Restart fluent-bit

# Container tailing moved to composition-logtide-agent, which owns this
# script now. Removing the copy left behind by earlier runs.
- name: Remove Fluent Bit container-tailing Lua script
  ansible.builtin.file:
    path: "{{ composition_config }}/fluent-bit/extract_container_id.lua"
    state: absent
  notify: Restart fluent-bit

- name: Deploy Fluent Bit Lua scripts
  ansible.builtin.copy:
    src: map_syslog_level.lua
    dest: "{{ composition_config }}/fluent-bit/map_syslog_level.lua"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0664"
  notify: Restart fluent-bit

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: never
    remove_orphans: true
  notify: Restart Traefik
