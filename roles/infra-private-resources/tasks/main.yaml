- name: Ensure Terraform repo exists
  become: true
  ansible.builtin.deb822_repository:
    name: terraform
    types: deb
    uris: "https://apt.releases.hashicorp.com"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: >-
      {% if ansible_facts['architecture'] == 'x86_64' %}amd64
      {% elif ansible_facts['architecture'] == 'aarch64' %}arm64
      {% else -%}ansible_facts['architecture']{% endif %}
    signed_by: "https://apt.releases.hashicorp.com/gpg"

- name: Ensure Terraform is installed
  become: true
  ansible.builtin.apt:
    update_cache: true
    name:
      - terraform

# ===================================================================
# Cloud-init configuration
# ===================================================================

- name: Read Github authorized keys as string
  ansible.builtin.uri:
    url: https://github.com/awfulwoman.keys
    method: GET
    return_content: true
  register: github_keys_string

- name: Ensure Github keys list exists
  ansible.builtin.set_fact:
    github_keys_list: "{{ github_keys_string.content | split('\n') | reject('==', '') }}"

# ===================================================================
# Terraform project
# ===================================================================

# The Terraform state is the record of which guests exist. It belongs on
# ZFS, with the rest of the host's state, so it is snapshotted and
# replicated like everything else.
- name: Read the filesystem type of the Terraform working dir
  ansible.builtin.command:
    cmd: "findmnt --noheadings --output FSTYPE --target {{ infra_privateresources_terraform_working_dir }}"
  register: infra_privateresources_working_dir_mount
  changed_when: false
  failed_when: false

- name: Assert the Terraform working dir is on ZFS
  ansible.builtin.assert:
    that:
      - infra_privateresources_working_dir_mount.stdout | trim == 'zfs'
    fail_msg: >-
      {{ infra_privateresources_terraform_working_dir }} is not on ZFS
      ({{ infra_privateresources_working_dir_mount.stdout | default('nothing there', true) | trim }}).
      The Terraform state would live on the root filesystem, unsnapshotted
      and unreplicated - lose it and there is no record of which guests
      exist. Check the zfs: block in this host's host_vars.
    quiet: true

- name: Ensure Terraform project working dir exists
  become: true
  ansible.builtin.file:
    dest: "{{ infra_privateresources_terraform_working_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Ensure cloud-init file exists
  become: true
  ansible.builtin.template:
    src: cloud-init
    dest: "{{ infra_privateresources_terraform_working_dir }}/cloud-init.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Ensure Terraform templates exist
  become: true
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ infra_privateresources_terraform_working_dir }}/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - main.tf
    - provider.tf
    - variables.tf
    - vms.tf.j2
  register: tf_files

- name: Deploy terraform wrapper script
  become: true
  ansible.builtin.template:
    src: tf.sh
    dest: "{{ infra_privateresources_terraform_working_dir }}/tf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: DEBUG TF files
  ansible.builtin.debug:
    var: tf_files
  when: infra_privateresources_debug | bool

# ===================================================================
# Storage pools
#
# Every VM's libvirt pool is a directory under the pool path, which is
# a ZFS dataset (see the hypervisor's host_vars). The dataset is
# created by system-zfs, which runs earlier in the host's playbook; this
# check makes sure it really is there, because a plain directory would
# put a guest's disk on the root filesystem, unsnapshotted, where
# nothing would ever replicate it.
# ===================================================================

- name: Read the filesystem type of the VM pool path
  ansible.builtin.command:
    cmd: "findmnt --noheadings --output FSTYPE --target {{ infra_privateresources_pool_path }}"
  register: infra_privateresources_pool_mount
  changed_when: false
  failed_when: false

- name: Assert the VM pool path is a ZFS mountpoint
  ansible.builtin.assert:
    that:
      - infra_privateresources_pool_mount.stdout | trim == 'zfs'
    fail_msg: >-
      {{ infra_privateresources_pool_path }} is not a ZFS mountpoint
      ({{ infra_privateresources_pool_mount.stdout | default('nothing there', true) | trim }}).
      The VM disks would land on the root filesystem, unsnapshotted and
      unreplicated. Check the zfs: block in this host's host_vars.
    quiet: true

# ===================================================================
# Run Terraform
# ===================================================================

- name: Run Terraform
  when: infra_privateresources_tf_apply | bool
  block:
    - name: Ensure Terraform plan is tested
      community.general.terraform:
        project_path: "{{ infra_privateresources_terraform_working_dir }}"
        state: present
        force_init: true
        variables:
          libvirt_uri: "{{ infra_privateresources_libvirt_uri }}"
      register: tf_plan
      check_mode: true

    - name: DEBUG TF plan
      ansible.builtin.debug:
        var: tf_plan
      when: infra_privateresources_debug | bool

    - name: Ensure Terraform plan is applied
      when: (tf_plan.changed) and (not tf_plan.failed) and (not infra_privateresources_tf_plan_only)
      community.general.terraform:
        project_path: "{{ infra_privateresources_terraform_working_dir }}"
        state: present
        variables:
          libvirt_uri: "{{ infra_privateresources_libvirt_uri }}"
