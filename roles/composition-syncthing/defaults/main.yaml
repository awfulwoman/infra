# Composition name (used by composition-common dependency)
composition_name: syncthing

# Single label before {host} (hyphen, not dot) - a *.ewwww.eu wildcard cert
# cannot cover a multi-level name like "syncthing.<host>.ewwww.eu". See #271.
composition_dns_subdomains:
  - "syncthing-{host}"

# Host path mounted at /var/syncthing: Syncthing's config plus every folder
# (system-syncthing-config places declared folders under it).
composition_syncthing_data_path: "{{ composition_root }}/data"

composition_syncthing_api_key: "{{ vault_syncthing_api_key }}"
