# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
  loop_control:
    loop_var: dir_item
  loop:
    - postgres
    - data
    - media
    - export
    - consume

# pdf-translate (the webhook sidecar and its post-consume hook) was replaced by
# composition-translation-server, which Paperless calls through a workflow webhook.
- name: Remove old translation files
  ansible.builtin.file:
    path: "{{ old_item }}"
    state: absent
  loop_control:
    loop_var: old_item
  loop:
    - "{{ composition_root }}/.environment_vars_webhook"
    - "{{ composition_root }}/pdf-translate-webhook-compat"
    - "{{ composition_config }}/scripts"
    - "{{ composition_config }}/pdf-translate-webhook"

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  notify: Restart Traefik
