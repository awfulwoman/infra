# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
  loop_control:
    loop_var: dir_item
  loop:
    - postgres
    - data
    - media
    - export
    - consume

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ composition_config }}/scripts"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0774"
  when: paperless_ngx_translate_enabled

- name: Create pdf-translate webhook data directory
  ansible.builtin.file:
    path: "{{ composition_config }}/pdf-translate-webhook"
    state: directory
    mode: "0755"
  when: paperless_ngx_translate_enabled

- name: Create pdf-translate webhook compat directory
  ansible.builtin.file:
    path: "{{ composition_root }}/pdf-translate-webhook-compat"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: paperless_ngx_translate_enabled

- name: Copy pdf-translate webhook Paperless 3.x compat shim
  ansible.builtin.copy:
    src: pdf-translate-webhook/sitecustomize.py
    dest: "{{ composition_root }}/pdf-translate-webhook-compat/sitecustomize.py"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: paperless_ngx_translate_enabled
  register: paperless_ngx_webhook_compat

- name: Render post-consume script
  ansible.builtin.template:
    src: scripts/post_consume.sh.j2
    dest: "{{ composition_config }}/scripts/post_consume.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: paperless_ngx_translate_enabled

- name: Render pdf-translate webhook env file
  ansible.builtin.template:
    src: environment_vars_webhook.j2
    dest: "{{ composition_root }}/.environment_vars_webhook"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  when: paperless_ngx_translate_enabled

# The custom LibreTranslate translator sidecar was replaced by pdf-translate.
- name: Remove old translator files
  ansible.builtin.file:
    path: "{{ composition_root }}/{{ old_item }}"
    state: absent
  loop_control:
    loop_var: old_item
  loop:
    - translator
    - .environment_vars_translator

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  notify: Restart Traefik

- name: Restart pdf-translate webhook after compat shim change
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: restarted
    services:
      - pdf-translate-webhook
  when: paperless_ngx_translate_enabled and paperless_ngx_webhook_compat is changed

# The webhook links each original to its companion through this field.
- name: Ensure translation custom field exists
  when: paperless_ngx_translate_enabled
  block:
    - name: Look up translation custom field
      ansible.builtin.uri:
        url: "https://paperless.{{ domainname_infra }}/api/custom_fields/?name__iexact=translation"
        headers:
          Authorization: "Token {{ paperless_ngx_api_token }}"
        return_content: true
      register: paperless_ngx_translation_field
      retries: 10
      delay: 15
      until: paperless_ngx_translation_field.status == 200
      no_log: true

    - name: Create translation custom field
      ansible.builtin.uri:
        url: "https://paperless.{{ domainname_infra }}/api/custom_fields/"
        method: POST
        headers:
          Authorization: "Token {{ paperless_ngx_api_token }}"
        body_format: json
        body:
          name: translation
          data_type: documentlink
        status_code: 201
      when: paperless_ngx_translation_field.json.count == 0
      no_log: true
