# Composition name (used by composition-common dependency)
composition_name: paperless-ngx

composition_dns_subdomains:
  - paperless

paperless_ngx_db_password: "{{ lookup('onepassword_connect', 'App - Paperless-ngx', 'db password') }}"
paperless_ngx_secret_key: "{{ lookup('onepassword_connect', 'App - Paperless-ngx', 'secret key') }}"
paperless_ngx_admin_user: admin
paperless_ngx_admin_password: "{{ lookup('onepassword_connect', 'Infra - Paperless-ngx', 'password') }}"
paperless_ngx_admin_mail: "{{ vault_paperless_ngx_admin_mail }}"

# ----------------------------
# Storage
# ----------------------------

paperless_ngx_translate_media_path: "{{ composition_config }}/media"

# ----------------------------
# API
# ----------------------------

# Paperless REST API token (admin). Used by composition-translation-server's connector.
paperless_ngx_api_token: "{{ lookup('onepassword_connect', 'App - Paperless-ngx', 'api token') }}"
