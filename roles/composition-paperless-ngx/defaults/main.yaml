# Composition name (used by composition-common dependency)
composition_name: paperless-ngx

composition_dns_subdomains:
  - paperless

paperless_ngx_db_password: "{{ vault_paperless_ngx_db_password }}"
paperless_ngx_secret_key: "{{ vault_paperless_ngx_secret_key }}"
paperless_ngx_admin_user: admin
paperless_ngx_admin_password: "{{ vault_paperless_ngx_admin_password }}"
paperless_ngx_admin_mail: "{{ vault_paperless_ngx_admin_mail }}"

# ----------------------------
# Storage
# ----------------------------

paperless_ngx_translate_media_path: "{{ composition_config }}/media"

# ----------------------------
# Auto-translation
# ----------------------------

# Companion translated PDFs via composition-pdf-translate (Ollama on Malcolm).
paperless_ngx_translate_enabled: true
# pdf-translate and LibreTranslate are reached by container name on the default Docker network.
paperless_ngx_translate_pdf_translate_url: "http://pdf-translate:7860"
# LibreTranslate is only used for language detection; Ollama does the translation.
paperless_ngx_translate_libretranslate_url: "http://libretranslate:5000"
paperless_ngx_translate_ollama_url: "{{ llm_default_ollama_base_url }}"
# Keep in step with composition_pdf_translate_ollama_model and Malcolm's system_ollama_models.
paperless_ngx_translate_ollama_model: "translategemma:4b"
# Only documents detected as this language are translated ("auto" skips detection and translates everything).
paperless_ngx_translate_source_lang: "de"
paperless_ngx_translate_target_lang: "en"
# pdf | sbs (side-by-side) | both
paperless_ngx_translate_output: "pdf"
# Seconds to wait for one document. Local LLM translation of long documents is slow.
paperless_ngx_translate_timeout: 1800
# Paperless REST API token used by the webhook to read documents and upload companions.
paperless_ngx_api_token: "{{ vault_paperless_ngx_api_token }}"
