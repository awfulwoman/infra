# code: language=ansible

# ----------------------------
# Configure the Semaphore project through its API.
#
# ebdruplab.semaphoreui.project_deploy matches every item by name: missing
# ones are created and existing ones updated. project_deploy_variable_delete
# stays false, so anything added by hand in the UI survives.
# ----------------------------

- name: "Set the Semaphore URL"
  ansible.builtin.set_fact:
    _semaphore_url: "https://{{ composition_dns_subdomains[0] }}.{{ domainname_infra }}"

- name: "Read the fleet SSH key"
  ansible.builtin.slurp:
    src: "{{ composition_semaphore_fleet_key_path }}"
  register: _semaphore_fleet_key
  no_log: true

- name: "Reset the template and schedule maps"
  ansible.builtin.set_fact:
    _semaphore_templates: {}
    _semaphore_schedules: {}

# Found on the controller, in the checkout running this play. (fileglob
# cannot wildcard a directory.)
- name: "Find the host playbooks"
  ansible.builtin.find:
    paths: "{{ role_path }}/../../playbooks/hosts"
    patterns: core.yaml
    recurse: true
    depth: 2
  delegate_to: localhost
  become: false
  register: _semaphore_host_playbooks

- name: "Add a core template for every host playbook"
  ansible.builtin.set_fact:
    _semaphore_templates: >-
      {{ _semaphore_templates | combine({
           host ~ ': core': composition_semaphore_template_defaults | combine({
             'name': host ~ ': core',
             'playbook': 'playbooks/hosts/' ~ host ~ '/core.yaml',
           })
         }) }}
  vars:
    host: "{{ host_playbook | dirname | basename }}"
  loop: "{{ _semaphore_host_playbooks.files | map(attribute='path') | sort }}"
  loop_control:
    loop_var: host_playbook
    label: "{{ host_playbook | dirname | basename }}"

- name: "Add the extra templates"
  ansible.builtin.set_fact:
    _semaphore_templates: >-
      {{ _semaphore_templates | combine({
           extra_template.name: composition_semaphore_template_defaults | combine(extra_template)
         }) }}
  loop: "{{ composition_semaphore_templates_extra }}"
  loop_control:
    loop_var: extra_template
    label: "{{ extra_template.name }}"

- name: "Add the schedules"
  ansible.builtin.set_fact:
    _semaphore_schedules: >-
      {{ _semaphore_schedules | combine({
           schedule.template: {
             'name': 'nightly: ' ~ schedule.template,
             'template_name': schedule.template,
             'cron_format': schedule.cron,
             'active': schedule.active | default(true),
           }
         }) }}
  loop: "{{ composition_semaphore_schedules }}"
  loop_control:
    loop_var: schedule
    label: "{{ schedule.cron }} {{ schedule.template }}"

# Semaphore mails project users whose alert flag is set
# (services/tasks/alert.go), so the admin account needs a real address.
# SEMAPHORE_ADMIN_EMAIL only applies when the account is first created.
- name: "Log in to Semaphore"
  ebdruplab.semaphoreui.login:
    host: "{{ _semaphore_url }}"
    port: 443
    username: "{{ composition_semaphore_admin_login }}"
    password: "{{ composition_semaphore_admin_password }}"
  register: _semaphore_login
  no_log: true

- name: "List Semaphore users"
  ebdruplab.semaphoreui.user_list:
    host: "{{ _semaphore_url }}"
    port: 443
    session_cookie: "{{ _semaphore_login.session_cookie }}"
  register: _semaphore_users
  no_log: true

- name: "List Semaphore projects"
  ebdruplab.semaphoreui.project_list:
    host: "{{ _semaphore_url }}"
    port: 443
    session_cookie: "{{ _semaphore_login.session_cookie }}"
  register: _semaphore_projects

- name: "Ensure the admin user has a real address and receives alerts"
  ebdruplab.semaphoreui.user_update:
    host: "{{ _semaphore_url }}"
    port: 443
    session_cookie: "{{ _semaphore_login.session_cookie }}"
    user_id: "{{ _semaphore_admin.id }}"
    name: "{{ _semaphore_admin.name }}"
    username: "{{ _semaphore_admin.username }}"
    email: "{{ composition_semaphore_admin_alert_email }}"
    alert: true
    admin: true
  vars:
    _semaphore_admin: >-
      {{ _semaphore_users.users
         | selectattr('username', 'equalto', composition_semaphore_admin_login)
         | first }}

# project_deploy applies project settings only when it creates the project
# (roles/project_deploy/tasks/project.yml): on an existing project, alert
# and max_parallel_tasks are never updated. Set them here.
- name: "Ensure the project settings"
  ebdruplab.semaphoreui.project_update:
    host: "{{ _semaphore_url }}"
    port: 443
    session_cookie: "{{ _semaphore_login.session_cookie }}"
    project_id: "{{ _semaphore_project.id }}"
    project:
      name: "{{ composition_semaphore_project_name }}"
      alert: true
      max_parallel_tasks: "{{ composition_semaphore_max_parallel_tasks }}"
  vars:
    _semaphore_project: >-
      {{ _semaphore_projects.projects
         | selectattr('name', 'equalto', composition_semaphore_project_name)
         | first }}
  when: _semaphore_projects.projects | selectattr('name', 'equalto', composition_semaphore_project_name) | list | length > 0

- name: "Log out of Semaphore"
  ebdruplab.semaphoreui.logout:
    host: "{{ _semaphore_url }}"
    port: 443
    session_cookie: "{{ _semaphore_login.session_cookie }}"
  no_log: true

- name: "Configure the Semaphore project"
  ansible.builtin.include_role:
    name: ebdruplab.semaphoreui.project_deploy
  vars:
    project_deploy_semaphore_host: "{{ _semaphore_url }}"
    project_deploy_semaphore_port: 443
    project_deploy_semaphore_username: "{{ composition_semaphore_admin_login }}"
    project_deploy_semaphore_password: "{{ composition_semaphore_admin_password }}"
    project_deploy_force_project_update: true
    project_deploy_variable_delete: false
    project_deploy_config:
      project:
        name: "{{ composition_semaphore_project_name }}"
        # Master switch: with it off, no channel sends anything.
        alert: true
        max_parallel_tasks: "{{ composition_semaphore_max_parallel_tasks }}"
      keys:
        fleet:
          name: "{{ composition_semaphore_fleet_key_name }}"
          type: ssh
          # Set on creation only, so re-runs do not rewrite it.
          override_secret: false
          ssh:
            # Required by project_deploy; the inventory's ansible_user wins.
            login: "{{ ansible_user }}"
            passphrase: ""
            private_key: "{{ _semaphore_fleet_key.content | b64decode }}"
      # The repo is public: HTTPS, with Semaphore's built-in "None" key.
      repositories:
        - name: infra
          git_url: https://github.com/awfulwoman/infra.git
          git_branch: main
          key_name: "None"
        # A path with no scheme is used in place, with no clone, so a
        # template can run what is in the working copy right now —
        # uncommitted included.
        - name: infra (local)
          git_url: "{{ composition_semaphore_local_repo_path }}"
          git_branch: main
          key_name: "None"
      views: {}
      inventories:
        # The whole directory, as ansible.cfg loads it: hosts-unmanaged.yaml
        # defines groups that bertha's dhcpd and named templates need.
        infra:
          name: infra
          type: file
          repository_name: infra
          inventory_file: inventory/
          ssh_key_name: "{{ composition_semaphore_fleet_key_name }}"
        # An inventory is bound to one repository, so a run from the
        # working copy needs this one too: with the GitHub inventory, it
        # would clone from GitHub and use that inventory instead.
        infra_local:
          name: infra (local)
          type: file
          repository_name: infra (local)
          inventory_file: inventory/
          ssh_key_name: "{{ composition_semaphore_fleet_key_name }}"
      environments:
        default:
          name: default
      templates: "{{ _semaphore_templates }}"
      schedules: "{{ _semaphore_schedules }}"
      integrations: {}
