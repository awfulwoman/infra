# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# ----------------------------
# Specific tasks
# ----------------------------

- name: "Create data directories"
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
    owner: "{{ composition_semaphore_uid }}"
    group: "0"
    mode: "0700"
  loop_control:
    loop_var: dir_item
  loop:
    - config
    - data

# ansible.cfg hardcodes vault_password_file, so the container needs one at
# that path. The host's copy is 0600 to ansible_user, which the container
# user cannot read.
- name: "Copy the vault password for the container user"
  become: true
  ansible.builtin.copy:
    src: "{{ ansible_vault_password_file }}"
    dest: "{{ composition_config }}/vaultpassword"
    remote_src: true
    owner: "{{ composition_semaphore_uid }}"
    group: "0"
    mode: "0400"

- name: "Ensure the working checkout directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ composition_semaphore_local_repo_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: never
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 180
  notify: Restart Traefik

- name: Configure the Semaphore project
  ansible.builtin.import_tasks: project.yaml
