# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# ----------------------------
# Specific tasks
# ----------------------------

- name: "Create data directories"
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
    owner: "{{ composition_semaphore_uid }}"
    group: "0"
    mode: "0700"
  loop_control:
    loop_var: dir_item
  loop:
    - config
    - data

# ansible.cfg hardcodes vault_password_file, so the container needs one at
# that path. The host's copy is 0600 to ansible_user, which the container
# user cannot read.
- name: "Copy the vault password for the container user"
  become: true
  ansible.builtin.copy:
    src: "{{ ansible_vault_password_file }}"
    dest: "{{ composition_config }}/vaultpassword"
    remote_src: true
    owner: "{{ composition_semaphore_uid }}"
    group: "0"
    mode: "0400"

- name: "Ensure the working checkout directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ composition_semaphore_local_repo_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when: not (composition_semaphore_local_repo_path is exists)

- name: "Read the working checkout's permissions"
  ansible.builtin.stat:
    path: "{{ composition_semaphore_local_repo_path }}"
  register: _semaphore_local_repo_stat

# The mount is read-only but the container still has to read it as
# composition_semaphore_uid, which is neither the owner nor the group of a
# checkout in a home directory. Fail here rather than leaving the container
# to fail at inventory load with a bare "permission denied".
- name: "Refuse a working checkout the container cannot read"
  ansible.builtin.assert:
    that:
      - _semaphore_local_repo_stat.stat.isdir
      - ((_semaphore_local_repo_stat.stat.mode | int(base=8)) % 8) in [5, 7]
    fail_msg: >-
      {{ composition_semaphore_local_repo_path }} is not readable and
      traversable by "other". The Semaphore container runs as uid
      {{ composition_semaphore_uid }}, so it can only read a checkout that
      grants other r-x — chmod o+rx it, or point it at a path outside the
      home directory. It is mounted at
      {{ composition_semaphore_local_repo_container_path }}.
    quiet: true

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: never
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 180
  notify: Restart Traefik

- name: Configure the Semaphore project
  ansible.builtin.import_tasks: project.yaml
