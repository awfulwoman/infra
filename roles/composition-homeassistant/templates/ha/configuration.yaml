#############################################################################
# DEFAULTS
#############################################################################

# Loads default set of integrations. DO. NOT. REMOVE.
default_config:

#############################################################################
# FRONTEND
#############################################################################
# frontend:
#   themes: !include_dir_merge_named themes

#############################################################################
# REQUIRED BY AUTOMATION
#############################################################################

# https://github.com/bramstroker/homeassistant-powercalc
powercalc:

#############################################################################
# NOT SUPPORTED IN UI
#############################################################################

# https://community.home-assistant.io/t/automations-link-in-sidebar/412171/4
panel_custom:
  - name: Automations
    sidebar_title: Automations
    sidebar_icon: mdi:cog-transfer
    js_url: /api/hassio/app/entrypoint.js
    url_path: config/automation/dashboard
    embed_iframe: true
    require_admin: true
    config:
      ingress: core_configurator

# https://www.home-assistant.io/integrations/wake_on_lan/
# `host` is what HA pings to decide whether the switch reads on or off. It takes
# the LAN address from inventory rather than a name: the bare inventory hostname
# is not a resolvable name anywhere, and the FQDN would resolve through bertha's
# `tailscale` view to a 100.80.x address, which is the wrong path for a machine
# that is asleep. Waking is a LAN broadcast either way.
switch:
  - platform: wake_on_lan
    name: Server Storage WOL
    mac: "{{ hostvars['server-64gb-storage']['host_mac'] }}"
    host: "{{ hostvars['server-64gb-storage']['host_ipv4'] }}"
    turn_off:
      service: mqtt.publish
      data:
        qos: 0
        retain: false
        payload: suspend
        topic: servers/server-64gb-storage
  - platform: wake_on_lan
    name: Server Backups WOL
    mac: "{{ hostvars['server-8gb-backups']['host_mac'] }}"
    host: "{{ hostvars['server-8gb-backups']['host_ipv4'] }}"
    turn_off:
      service: mqtt.publish
      data:
        qos: 0
        retain: false
        payload: suspend
        topic: servers/server-8gb-backups

#############################################################################
# TIME/DATE SENSORS
#############################################################################

# Add some additional time date sensors for use in scripts
sensor:
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'
      - 'date_time_iso'

#############################################################################
# CLEAN UP LOGBOOK
#############################################################################
# Exclude these entities from showing in the logbook/Activity stream
# because they're quite spammy.
logbook:
  exclude:
    entities:
      - sensor.time
      - sensor.date
      - sensor.date_time
      - sensor.date_time_iso
      - sensor.fritz_box_7412_ui_connection_uptime
      - sensor.fritz_box_7412_ui_last_restart
    entity_globs:
      - sensor.weather_*
    domains:
      - sun

#############################################################################
# INCLUDES
#############################################################################
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
input_select: !include input_select.yaml
template: !include template.yaml
