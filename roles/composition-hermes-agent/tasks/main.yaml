# code: language=ansible

# ----------------------------
# Remove composition (state: absent)
# ----------------------------

- name: Stop and remove Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: absent
    remove_orphans: true
  register: _hermes_compose_down
  failed_when:
    - _hermes_compose_down is failed
    - "'no such file or directory' not in (_hermes_compose_down.msg | default('') | lower)"
  when: state | default('present') == 'absent'

# The agent's whole state lives here: config.yaml, memories, skills, cron,
# sessions, logs. Removing the composition removes it. The ZFS dataset itself
# is left behind - destroying it is not something a play should do silently.
- name: Remove the Hermes data directory
  become: true
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: absent
  when: state | default('present') == 'absent'

- name: Remove compose and environment files
  become: true
  ansible.builtin.file:
    path: "{{ composition_root }}/{{ absent_file }}"
    state: absent
  loop_control:
    loop_var: absent_file
  loop:
    - docker-compose.yaml
    - .environment_vars
  when: state | default('present') == 'absent'

# ----------------------------
# Preflight
# ----------------------------

- name: Assert dashboard credentials are set
  ansible.builtin.assert:
    that:
      - composition_hermes_agent_dashboard_username | length > 0
      - composition_hermes_agent_dashboard_password | length > 0
      - composition_hermes_agent_dashboard_secret | length > 0
    fail_msg: >-
      The Hermes dashboard binds beyond loopback so Traefik can reach it, and
      Hermes fails closed unless an auth provider is configured. Set
      vault_hermes_agent_dashboard_username, _password and _secret in the
      vault, or set composition_hermes_agent_dashboard to false.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_agent_dashboard

- name: Assert API server key is set when the API server is enabled
  ansible.builtin.assert:
    that:
      - composition_hermes_agent_api_server_key | length > 0
    fail_msg: >-
      composition_hermes_agent_api_server is true but no key is set. Without
      API_SERVER_KEY anything on {{ default_docker_network }} could drive the
      agent. Set vault_hermes_agent_api_server_key.
    quiet: true
  when: state | default('present') == 'present' and composition_hermes_agent_api_server

# The image remaps its internal `hermes` user to HERMES_UID/HERMES_GID, so the
# data directory has to be owned by whoever Ansible connects as.
- name: Look up the deploy user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"
  when: state | default('present') == 'present'

- name: Set the container uid and gid
  ansible.builtin.set_fact:
    composition_hermes_agent_uid: "{{ ansible_facts.getent_passwd[ansible_user][1] }}"
    composition_hermes_agent_gid: "{{ ansible_facts.getent_passwd[ansible_user][2] }}"
  when: state | default('present') == 'present'

# ----------------------------
# Core tasks
# ----------------------------

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: state | default('present') == 'present'

- name: Create .env file
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  # Holds the dashboard password and cookie secret, which --diff would
  # otherwise print in full.
  no_log: true
  when: state | default('present') == 'present'

# ----------------------------
# Specific tasks
# ----------------------------

- name: Ensure the Hermes data directory exists
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes' bootstrap chmods /opt/data to 0700 on every start; match it so
    # the play stays idempotent.
    mode: "0700"
  when: state | default('present') == 'present'

# The built-in "default" profile's config. Always templated - the image keeps
# supervising its gateway even when a named profile is the active one. No MCP
# servers here (those belong to the target profile); keeps api_server on the
# base port.
- name: Deploy Hermes config.yaml (default profile)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ composition_config }}/data/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Hermes normalises this file to 0640 on start; match it for idempotency.
    mode: "0640"
  vars:
    _hermes_mcp_servers: {}
    _hermes_api_port: "{{ composition_hermes_agent_api_server_port }}"
  when: state | default('present') == 'present' and composition_hermes_agent_manage_config
  notify: Restart Hermes

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    remove_orphans: true
  when: state | default('present') == 'present'
  notify: Restart Traefik

# ----------------------------
# Named profile (composition_hermes_agent_profile != "default")
# ----------------------------

- name: Configure the named Hermes profile
  when:
    - state | default('present') == 'present'
    - composition_hermes_agent_manage_config
    - composition_hermes_agent_profile != 'default'
  block:
    - name: Wait for Hermes to accept commands
      ansible.builtin.command:
        cmd: docker exec hermes hermes profile list
      register: _hermes_ready
      until: _hermes_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Create the Hermes profile
      ansible.builtin.command:
        cmd: >-
          docker exec hermes hermes profile create {{ composition_hermes_agent_profile | quote }} --clone
          {{ ('--description ' ~ (composition_hermes_agent_profile_description | quote))
             if composition_hermes_agent_profile_description else '' }}
        creates: "{{ composition_config }}/data/profiles/{{ composition_hermes_agent_profile }}"

    - name: Deploy Hermes config.yaml (named profile)
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ composition_config }}/data/profiles/{{ composition_hermes_agent_profile }}/config.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0640"
      vars:
        _hermes_mcp_servers: "{{ composition_hermes_agent_mcp_servers }}"
        _hermes_api_port: "{{ composition_hermes_agent_profile_api_server_port }}"
      notify: Restart Hermes

    - name: Read the current active profile
      ansible.builtin.command:
        cmd: docker exec hermes cat /opt/data/active_profile
      register: _hermes_active
      changed_when: false
      failed_when: false

    - name: Make the named profile the active one
      ansible.builtin.command:
        cmd: docker exec hermes hermes profile use {{ composition_hermes_agent_profile | quote }}
      when: (_hermes_active.stdout | default('') | trim) != composition_hermes_agent_profile
      changed_when: true
      notify: Restart Hermes
