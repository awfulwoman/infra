# Composition name (used by composition-common dependency)
composition_name: hermes-agent

composition_dns_subdomains:
  - hermes

# Upstream publishes a multi-arch image (amd64/arm64) to Docker Hub. The
# docker-compose.yml in the repo builds from a source checkout instead;
# no host here keeps a checkout, so pull the published image.
composition_hermes_agent_image: "nousresearch/hermes-agent:latest"

# -------------------------------------------------------------------
# MODEL
# Malcolm's Ollama, over its OpenAI-compatible /v1 endpoint. Hermes calls
# an arbitrary OpenAI-compatible endpoint the "custom" provider.
# Docs: https://hermes.nousresearch.com/integrations/providers
# -------------------------------------------------------------------
composition_hermes_agent_model: "{{ llm_default_model }}"
composition_hermes_agent_base_url: "{{ llm_default_openai_uri }}"
# Ollama ignores the key, but the OpenAI client sends one. Not a secret.
composition_hermes_agent_api_key: "ollama"

# Hermes rejects a context window below 64000 at startup: the system prompt,
# tool schemas and conversation state do not fit in less. Ollama applies its
# own OLLAMA_CONTEXT_LENGTH on the server side and silently truncates to it,
# so Malcolm's value must be at least this too. See README.
composition_hermes_agent_context_length: 64000

# Schema version config.yaml is written against, as declared by the image's
# hermes_cli.config.DEFAULT_CONFIG. Verified against
# nousresearch/hermes-agent:latest on 2026-09-10. Re-check when bumping the
# image - the migration warning names an older number than the real one.
composition_hermes_agent_config_version: 42

# Backend for the agent's shell tool. "local" runs commands inside this
# container. "docker" would need the host Docker socket mounted, which hands
# the agent the host - do not set it here.
composition_hermes_agent_terminal_backend: local

# -------------------------------------------------------------------
# PROFILE
# The Hermes profile this deploy targets. "default" (built-in) keeps the
# single-profile model - config at data/config.yaml. Any other name: the
# role runs `hermes profile create <name> --clone`, makes it the sticky
# (active) profile, and templates data/profiles/<name>/config.yaml. The
# built-in "default" profile is always templated too - the image keeps
# supervising its gateway regardless.
# -------------------------------------------------------------------
composition_hermes_agent_profile: default
composition_hermes_agent_profile_description: ""

# -------------------------------------------------------------------
# MCP SERVERS
# Servers offered to the target profile. Keyed by server name; each value
# is written verbatim under mcp_servers: in that profile's config.yaml.
# Keep secrets out of config.yaml: put them in a header as ${ENVVAR} and
# supply the value via composition_hermes_agent_mcp_env, which is rendered
# into .environment_vars (process-wide, so every profile's gateway can
# read it). Empty _mcp_env values are skipped.
#
# Example:
#   composition_hermes_agent_mcp_servers:
#     gateway:
#       url: "https://gateway.{{ domainname_infra }}/mcp"
#       headers:
#         Authorization: "Bearer ${GATEWAY_MCP_TOKEN}"
#   composition_hermes_agent_mcp_env:
#     GATEWAY_MCP_TOKEN: "{{ vault_gateway_mcp_token_hermes }}"
# -------------------------------------------------------------------
composition_hermes_agent_mcp_servers: {}
composition_hermes_agent_mcp_env: {}

# OpenAI-API server port for the *named* profile. The image auto-generates
# an API_SERVER_KEY per profile, and `--clone` copies the default profile's,
# so every profile's gateway would otherwise fight for
# composition_hermes_agent_api_server_port (8642). The named profile takes
# this port instead. Ignored when the target profile is "default".
composition_hermes_agent_profile_api_server_port: 8643

# `hermes setup` writes these into a profile's config.yaml; declare them
# here so the role's template does not drop them on the next play. Empty =
# omit the key (Hermes uses its own default).
composition_hermes_agent_dashboard_theme: ""
composition_hermes_agent_dashboard_font: ""

# -------------------------------------------------------------------
# DASHBOARD
# Traefik fronts it, so it binds 0.0.0.0 inside the container: reachable
# from the shared Docker network only, no host port published.
#
# Hermes' own auth gate engages on any non-loopback bind and fails closed
# without an auth provider (HERMES_DASHBOARD_INSECURE no longer bypasses
# it). The bundled "basic" provider needs a username and password, so both
# are mandatory - tasks/main.yaml asserts they are set.
# -------------------------------------------------------------------
composition_hermes_agent_dashboard: true
composition_hermes_agent_dashboard_port: 9119
composition_hermes_agent_dashboard_username: "{{ vault_hermes_agent_dashboard_username | default(vault_server_username) }}"
composition_hermes_agent_dashboard_password: "{{ vault_hermes_agent_dashboard_password | default('') }}"
# Signs dashboard session cookies. Without it every container restart
# invalidates open sessions.
composition_hermes_agent_dashboard_secret: "{{ vault_hermes_agent_dashboard_secret | default('') }}"

# -------------------------------------------------------------------
# API SERVER
# The OpenAI-compatible endpoint Hermes can expose on 8642. Off by default:
# with it on, anything on the shared Docker network can drive the agent.
# Enabling it requires a key - the assert in tasks/main.yaml enforces that.
# -------------------------------------------------------------------
composition_hermes_agent_api_server: false
composition_hermes_agent_api_server_port: 8642
composition_hermes_agent_api_server_key: "{{ vault_hermes_agent_api_server_key | default('') }}"

# Ansible owns config.yaml. Set false to template it once and then leave a
# hand-edited or `hermes setup`-written file alone on later runs.
composition_hermes_agent_manage_config: true
