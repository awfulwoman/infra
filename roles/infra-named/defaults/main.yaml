bind_domain: "{{ domainname_infra }}"
bind_default_ttl: 604800 # 1 week
# Addresses BIND binds to (BIND address-match-list syntax). Default `any;`
# matches BIND's own default. Override per host to exclude untrusted interfaces.
bind_listen_on: "any;"
bind_listen_on_v6: "any;"
# Legacy/aliased domains to serve as DNAME redirects onto bind_domain, so devices
# still searching an old internal domain resolve to current records. Empty = none.
bind_dname_aliases: []
bind_iprange_segment: 192.168
bind_iprange_reversed: "{{ bind_iprange_segment | string | split('.') | reverse | join('.') }}"
bind_ansible_group: infra
bind_unmanaged_group: unmanaged

# -------------------------------------------------------------------
# TAILSCALE RECORDS
# -------------------------------------------------------------------
# Publish each managed host's Tailscale address (`host_tailscale_ipv4` in
# host_vars, held there by the network-tailscale-address role) as
# `<prefix>.<host_pfqdn>.<bind_domain>`, alongside the LAN A record. That gives
# every host a name for each path to it: the bare pfqdn over the LAN, the `ts.`
# name over the tailnet — useful from a host that has no LAN route, and stable
# in a way a raw 100.x address in a config file is not.
# Hosts with no `host_tailscale_ipv4` are skipped.
# No PTRs are generated: Tailscale addresses reverse under 100.in-addr.arpa,
# which this role does not serve — MagicDNS already handles that.
bind_tailscale_records_enabled: true
bind_tailscale_record_prefix: ts

# -------------------------------------------------------------------
# SPLIT-HORIZON DNS (BIND views)
# -------------------------------------------------------------------
# Off by default: this role also serves hosts where there is nothing to split,
# and enabling it restructures named.conf (see below). Turn it on in host_vars
# for the resolver the tailnet actually points at.
#
# The problem it solves: every name in this zone is a CNAME onto a host's
# `host_pfqdn`, which resolves to that host's LAN address. A client on the
# tailnet — a phone away from home — gets 192.168.1.x back and cannot reach it.
#
# With views on, the same zone is rendered twice from the same template. The
# only difference is which inventory variable the host A records are taken from:
# `host_ipv4` for LAN clients, `host_tailscale_ipv4` for tailnet clients. Every
# CNAME is byte-identical between the two, so a name resolves to whichever
# address the asking client can actually route to. Traefik listens on all
# interfaces and the certificates come from Let's Encrypt over DNS-01, so a
# request works the same whichever address it lands on.
#
# Views are matched in the order declared and the first match wins, so the
# specific view (Tailscale) must come before the catch-all. That ordering is
# also a hard requirement of BIND's `in-view`, which the zones that are
# identical in both views (reverse, DNAME aliases) use to load the data once and
# share it. The RPZ blocklists cannot: named rejects an in-view reference as a
# response-policy target, so each view loads its own copy and the memory cost of
# filtering doubles. See "Costs" in the role README.
#
# BIND requires that when ANY view exists, EVERY zone lives inside one. Debian's
# stock named.conf includes named.conf.default-zones at the top level, which
# breaks that rule, so enabling views also makes the role take over
# /etc/bind/named.conf and move that include inside each view. Disabling views
# again does not restore Debian's file — see the role README.
bind_views_enabled: false
bind_views:
  - name: tailscale
    match_clients: "Tailscale;"
    address_var: host_tailscale_ipv4
    zone_file: "db.{{ bind_domain }}.tailscale.zone"
  - name: internal
    match_clients: "any;"
    address_var: host_ipv4
    zone_file: "db.{{ bind_domain }}.zone"

# Which forward zones actually get rendered. With views off, only the internal
# one — so the zone file on disk keeps the name and content it has always had.
bind_zone_renders: >-
  {{ bind_views if (bind_views_enabled | bool)
     else (bind_views | rejectattr('name', 'equalto', 'tailscale') | list) }}

# Which inventory variable the forward-zone A records are read from. Set per
# render by the loop in tasks/main.yaml; this default is what a non-view
# deployment gets.
bind_zone_address_var: host_ipv4

# Define ACL groups for using this DNS server
bind_acl_groups:
  - name: LAN
    iprange: 192.168.1.0/24
  - name: Tailscale
    iprange: 100.64.0.0/10
# Forwarding DNS servers (if any)
bind_forwarders:
  - 1.1.1.1 # Cloudflare
# Manually created NS records
bind_records_nameservers:
  - name: "dns01"
    ip: 192.168.1.2
  # - name: "dns02"
  #   ip: 172.16.0.3
# Manually created A records — deployment-specific zone data, so set these where
# the topology lives (e.g. group_vars/infra), not in this generic role default.
# The db.zone/db.reverse.zone templates guard on `is defined`, so leaving it
# unset here is safe. Example shape:
# bind_records_a:
#   - name: "@"     # zone apex
#     ip: 192.0.2.10
#   - name: "www"
#     ip: 192.0.2.10
# bind_dnssec_keys:
#   - name: "{{ bind_domain }}."
#     algorithm: "HMAC-SHA512"
#     secret: ""
# Manually created MX records
# bind_records_mx:
# Manually created TXT records
# bind_records_txt:

# -------------------------------------------------------------------
# DNS FILTERING — Response Policy Zones (RPZ)
# -------------------------------------------------------------------
# Pi-hole-style ad/tracker blocking done natively in BIND. Off by default: this
# role also serves hosts that are not the LAN's resolver, and filtering is only
# meaningful where every client's DNS actually lands. Enable in host_vars.
# When false, no response-policy block is emitted and no timer is installed, so
# the rendered config is byte-identical to before.
bind_rpz_enabled: false

# Blocklists to fetch, in the order BIND should consult them. Each needs a
# `name` (the zone origin — arbitrary, but must be unique and stable, since it
# is also the `rndc reload` target) and a `url` serving a ready-made RPZ zone.
# HaGeZi publishes native .rpz files, so nothing needs converting. Tiers:
#   light.txt     ~42k domains  (relaxed)
#   multi.txt    ~181k domains  (balanced — the sane default)
#   pro.txt      ~216k domains  (more aggressive telemetry blocking)
#   tif.mini.txt          (malware/phishing threat intel, layer alongside)
# Mirror if raw.githubusercontent is unreachable:
#   https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/rpz/multi.txt
bind_rpz_zones:
  - name: rpz.hagezi-multi
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/multi.txt

bind_rpz_dir: /etc/bind/zones/rpz
bind_rpz_refresh_script: /usr/local/sbin/bind-rpz-refresh
bind_rpz_service_name: bind-rpz-refresh

# Domains that must NEVER be blocked. Rendered into a local RPZ zone that is
# listed FIRST in response-policy, so a passthru match wins over any blocklist.
# The defaults protect our own authoritative names: a public blocklist has no
# business shadowing the internal zone or the legacy DNAME subtree.
bind_rpz_allowlist: "{{ [bind_domain] + (bind_dname_aliases | default([])) + (bind_rpz_allowlist_extra | default([])) }}"
# Set this in host_vars to allowlist a blocklist false positive without having
# to restate the protected defaults above.
bind_rpz_allowlist_extra: []

# systemd OnCalendar expression for the refresh timer. Upstream lists change
# daily; the script does a conditional GET, so a no-op run costs ~nothing.
bind_rpz_refresh_schedule: daily

# Floor for a plausible blocklist download, in bytes. A proxy error page or a
# truncated transfer is far smaller than any real list; anything under this is
# rejected before it can reach named-checkzone.
bind_rpz_min_bytes: 100000

# Blocked-query log. Separate from the general named log so "why is this site
# broken?" is one grep away.
bind_rpz_log_file: /var/log/named/rpz.log
