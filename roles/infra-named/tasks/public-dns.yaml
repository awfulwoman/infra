# Publishes the same derived record set used for the internal zone
# (dns_records_derived, computed above) to the public Hetzner zone: one A per
# host (the pinned Tailscale IP, not a live snapshot) plus one CNAME per
# composition-derived label. This is what lets a remote client with no
# special DNS configuration - a phone on cellular data, still connected to
# the tailnet - resolve a service name at all (#262's original outage).
#
# Add-only by design: this task only ever creates/updates names that come
# from dns_records_derived. It never deletes a name that isn't in that set,
# so any legacy record from the old per-composition self-registration
# mechanism (network-register-subdomain) is left untouched unless a
# composition's own current label collides with it.
#
# A CNAME can't coexist with an A record at the same name (invalid DNS), so
# any A record the old self-registration mechanism left at a derived label is
# cleared before that label's CNAME is created.
#
# The zone is read once and diffed against the derived set (dns_public_changes
# filter), so each run only writes the records that are missing or changed. An
# unchanged zone costs one API call, not two per label.
- name: Read the public zone's current RRSets
  hetzner.hcloud.zone_rrset_info:
    api_token: "{{ vault_hetzner_api_key_rw }}"
    zone: "{{ domainname_infra }}"
  register: public_dns_current

- name: Work out which public records need writing
  ansible.builtin.set_fact:
    public_dns_changes: >-
      {{ dns_records_derived | dns_public_changes(public_dns_current.hcloud_zone_rrset_info,
         domainname_infra, bind_public_dns_ttl | int) }}

- name: Publish one A record per host to the public zone
  hetzner.hcloud.zone_rrset:
    api_token: "{{ vault_hetzner_api_key_rw }}"
    zone: "{{ domainname_infra }}"
    name: "{{ host_record.name }}"
    type: A
    ttl: "{{ bind_public_dns_ttl }}"
    records:
      - value: "{{ host_record.value }}"
    state: present
  loop: "{{ public_dns_changes.a_upserts }}"
  loop_control:
    loop_var: host_record
    label: "{{ host_record.name }}"

- name: Clear any legacy A record at a name this label now owns
  hetzner.hcloud.zone_rrset:
    api_token: "{{ vault_hetzner_api_key_rw }}"
    zone: "{{ domainname_infra }}"
    name: "{{ dns_cname_label }}"
    type: A
    state: absent
  loop: "{{ public_dns_changes.a_deletes }}"
  loop_control:
    loop_var: dns_cname_label

- name: Publish one CNAME per derived label to the public zone
  hetzner.hcloud.zone_rrset:
    api_token: "{{ vault_hetzner_api_key_rw }}"
    zone: "{{ domainname_infra }}"
    name: "{{ dns_cname.name }}"
    type: CNAME
    ttl: "{{ bind_public_dns_ttl }}"
    records:
      - value: "{{ dns_cname.value }}"
    state: present
  loop: "{{ public_dns_changes.cname_upserts }}"
  loop_control:
    loop_var: dns_cname
    label: "{{ dns_cname.name }}"
  register: public_dns_cname_result

- name: Healthchecks block (reached only after every record above succeeded)
  when: bind_public_dns_healthcheck
  block:
    - name: Ensure that Healthchecks.io check is present
      community.healthchecksio.checks:
        state: present
        api_key: "{{ vault_healthchecks_rw_apikey }}"
        name: "Public DNS registration"
        unique: ["name"]
        tags:
          - autogenerated
          - infra-named
        schedule: "0 8 * * *"
        grace: 86400 # one day
        tz: Europe/Berlin
      register: public_dns_healthcheck

    - name: Ping Healthchecks.io
      community.healthchecksio.ping:
        state: present
        api_key: "{{ vault_healthchecks_rw_apikey }}"
        signal: success
        uuid: "{{ public_dns_healthcheck.uuid }}"
      when: public_dns_healthcheck is defined and public_dns_healthcheck.uuid is defined and public_dns_healthcheck.uuid is not false
      changed_when: false
  rescue:
    - name: All is good if the first task failed
      when: ansible_failed_task.name == 'Ensure that Healthchecks.io check is present'
      ansible.builtin.debug:
        msg: "Healthchecks.io module couldn't run"
