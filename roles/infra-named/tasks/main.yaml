- name: Ensure BIND packages are installed
  become: true
  ansible.builtin.apt:
    name:
      - bind9
      - bind9-dnsutils
      - bind9-doc
      - bind9-host
      - bind9-libs
      - bind9-utils
    state: present

- name: Ensure zones dir exists
  become: true
  ansible.builtin.file:
    dest: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0755"

- name: Ensure key file exist
  become: true
  ansible.builtin.template:
    src: keys.conf
    dest: /etc/bind/keys.conf
    owner: root
    group: bind
    mode: "0644"

# --- DNS filtering (RPZ) ----------------------------------------------------
# These run BEFORE named.conf.options is templated, and that order is
# load-bearing: named refuses to load a policy zone whose file is missing, so
# the zones must exist on disk before the config can reference them.

- name: Ensure RPZ zone dir exists
  become: true
  ansible.builtin.file:
    dest: "{{ bind_rpz_dir }}"
    state: directory
    owner: root
    group: bind
    mode: "0755"
  when: bind_rpz_enabled

- name: Ensure named log dir exists
  become: true
  ansible.builtin.file:
    dest: "{{ bind_rpz_log_file | dirname }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"
  when: bind_rpz_enabled

- name: Deploy RPZ blocklist refresh script
  become: true
  ansible.builtin.template:
    src: bind-rpz-refresh.sh.j2
    dest: "{{ bind_rpz_refresh_script }}"
    owner: root
    group: root
    mode: "0755"
  when: bind_rpz_enabled

- name: Check which RPZ blocklists are already on disk
  become: true
  ansible.builtin.stat:
    path: "{{ bind_rpz_dir }}/db.{{ item.name }}"
  loop: "{{ bind_rpz_zones }}"
  loop_control:
    label: "{{ item.name }}"
  register: bind_rpz_existing
  when: bind_rpz_enabled

# Run the script rather than fetching with get_url, so there is a single code
# path for downloading, validating and installing a policy zone. It is a no-op
# (conditional GET) once the lists are current, so this is cheap on every run.
- name: Fetch and validate RPZ blocklists
  become: true
  ansible.builtin.command:
    cmd: "{{ bind_rpz_refresh_script }}"
  register: bind_rpz_refresh
  changed_when: "'updated' in bind_rpz_refresh.stdout"
  # A failed refresh is only fatal while a policy zone has no file yet — named
  # refuses to load a zone whose file is missing, so the config below must not
  # reference it. Once a validated copy exists, a transient upstream outage just
  # means a stale blocklist, which is no reason to fail the whole play. The
  # systemd timer is what surfaces ongoing refresh failures.
  failed_when:
    - bind_rpz_refresh.rc != 0
    - bind_rpz_existing.results | rejectattr('stat.exists') | list | length > 0
  when: bind_rpz_enabled

- name: Ensure RPZ allowlist zone exists
  become: true
  ansible.builtin.template:
    src: db.rpz.allowlist
    dest: "{{ bind_rpz_dir }}/db.rpz.allowlist"
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkzone -q rpz.allowlist %s
  when: bind_rpz_enabled
  notify:
    - Restart named

- name: Ensure RPZ refresh timer is scheduled
  become: true
  ansible.builtin.template:
    src: "bind-rpz-refresh.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ bind_rpz_service_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - service
    - timer
  when: bind_rpz_enabled

- name: Ensure RPZ refresh timer is enabled
  become: true
  ansible.builtin.systemd:
    name: "{{ bind_rpz_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when: bind_rpz_enabled

- name: Ensure config file exist
  become: true
  ansible.builtin.template:
    src: named.conf.options
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify:
    - Restart named

# named-checkconf %s above only validates named.conf.options in isolation -
# it can't see cross-file errors that only exist once merged with sibling
# includes (named.conf.local, named.conf.default-zones). Managing named.conf
# itself, written after named.conf.options above, closes that gap: this
# template omits the default-zones include when split-horizon is on (see
# named.conf's own comment for why), and its own validate: sees the true
# merged picture since named.conf.options has already landed on disk by now.
- name: Ensure top-level named.conf includes the right files
  become: true
  ansible.builtin.template:
    src: named.conf
    dest: /etc/bind/named.conf
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify:
    - Restart named

# Every host's internal CNAMEs are derived by the dns_records filter from its
# compositions: list. A host can also declare cnames_additional: for a name
# with no owning composition (see inventory/host_vars/server-64gb-storage).
- name: Build dns_records filter input from hosts using data-driven compositions
  ansible.builtin.set_fact:
    dns_records_hosts: >-
      {{
        (dns_records_hosts | default({})) | combine({
          item: {
            'fqdn': hostvars[item].host_pfqdn,
            'tailscale_ipv4': hostvars[item].host_tailscale_ipv4,
            'compositions': hostvars[item].compositions,
          }
        })
      }}
  loop: "{{ groups[bind_ansible_group] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].compositions is defined

- name: Derive DNS records for data-driven hosts
  ansible.builtin.set_fact:
    dns_records_derived: "{{ (dns_records_hosts | default({})) | dns_records(lookup('composition_dns_subdomains')) }}"

# A CNAME is a singleton RR type: two CNAMEs at the same owner name make named
# reject the ENTIRE zone ("multiple RRs of singleton type"), taking down all
# DNS. The forward zone aggregates `cnames_additional` from every host in
# bind_ansible_group plus every label the dns_records filter derives, so a
# name declared twice (hand-written or derived, on any host) collides. Catch
# it here, before rendering.
- name: Collect all CNAMEs contributed to the forward zone
  ansible.builtin.set_fact:
    bind_all_cnames: >-
      {{
        (bind_all_cnames | default([]) + (hostvars[item].cnames_additional | default([])))
      }}
  loop: "{{ groups[bind_ansible_group] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Add derived CNAMEs to the duplicate-check set
  ansible.builtin.set_fact:
    bind_all_cnames: "{{ (bind_all_cnames | default([])) + (dns_records_derived.cnames.keys() | map('regex_replace', '$', '.' + bind_domain) | list) }}"

- name: Fail early if duplicate CNAMEs would make named reject the zone
  ansible.builtin.assert:
    that:
      - (bind_all_cnames | default([])) | length == (bind_all_cnames | default([]) | unique | length)
    fail_msg: >-
      Duplicate CNAME(s) declared across hosts in group '{{ bind_ansible_group }}':
      {{ bind_all_cnames | community.general.counter | dict2items
         | selectattr('value', 'gt', 1) | map(attribute='key') | list | join(', ') }}.
      A CNAME is a singleton RR type, so named would reject the whole zone.
      Remove each duplicate from all but the one host that actually serves it.
    success_msg: "No duplicate CNAMEs across group '{{ bind_ansible_group }}'."
    quiet: true

# One iteration when split-horizon is off (today's exact dest/ip_field -
# byte-identical output), two ("lan"/"tailscale") when it's on. See
# bind_split_horizon_enabled in defaults/main.yaml.
- name: Determine zone views to render
  ansible.builtin.set_fact:
    bind_zone_views: >-
      {{
        [{'name': 'default', 'ip_field': 'host_ipv4', 'dest': '/etc/bind/zones/db.' + bind_domain + '.zone'}]
        if not bind_split_horizon_enabled else
        [
          {'name': 'lan', 'ip_field': 'host_ipv4', 'dest': '/etc/bind/zones/db.' + bind_domain + '.lan.zone'},
          {'name': 'tailscale', 'ip_field': 'host_tailscale_ipv4', 'dest': '/etc/bind/zones/db.' + bind_domain + '.tailscale.zone'},
        ]
      }}

- name: Check for zone changes
  become: true
  ansible.builtin.template:
    src: db.zone
    dest: "{{ item.dest }}"
    owner: root
    group: bind
    mode: "0644"
  vars:
    bind_zone_ip_field: "{{ item.ip_field }}"
  loop: "{{ bind_zone_views }}"
  loop_control:
    label: "{{ item.name }}"
  register: zone_check

- name: Check for reverse zone changes
  become: true
  ansible.builtin.template:
    src: db.reverse.zone
    dest: "/etc/bind/zones/db.{{ bind_domain }}.reverse.zone"
    owner: root
    group: bind
    mode: "0644"
  register: reverse_zone_check

- name: Ensure zone file exists
  become: true
  ansible.builtin.template:
    src: db.zone
    dest: "{{ item.item.dest }}"
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkzone {{ bind_domain }} %s
  vars:
    bind_zone_ip_field: "{{ item.item.ip_field }}"
  loop: "{{ zone_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.changed
  notify:
    - Restart named

- name: Ensure reverse zone file exists
  become: true
  ansible.builtin.template:
    src: db.reverse.zone
    dest: "/etc/bind/zones/db.{{ bind_domain }}.reverse.zone"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkzone {{ bind_iprange_reversed }}.in-addr.arpa %s"
  when: reverse_zone_check.changed
  notify:
    - Restart named

- name: Replace serial in zone file if changed
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item.item.dest }}"
    regexp: "^  1234567890 ; Serial"
    line: "  {{ now(utc=true, fmt='%y%m%d%H%M') }} ; Serial"
  loop: "{{ zone_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.changed
  notify:
    - Restart named

- name: Replace serial in reverse zone file if changed
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/bind/zones/db.{{ bind_domain }}.reverse.zone"
    regexp: "^  1234567890 ; Serial"
    line: "  {{ now(utc=true, fmt='%y%m%d%H%M') }} ; Serial"
  when: reverse_zone_check.changed
  notify:
    - Restart named

- name: Deploy legacy-domain DNAME alias zones
  become: true
  ansible.builtin.template:
    src: db.dname.zone
    dest: "/etc/bind/zones/db.{{ item }}.zone"
    owner: root
    group: bind
    mode: "0644"
    validate: "named-checkzone {{ item }} %s"
  loop: "{{ bind_dname_aliases | default([]) }}"
  notify:
    - Restart named

# Every write above is validated in isolation (named-checkconf/checkzone on
# that one file), but none of them can see errors that only exist once
# everything is merged together the way named actually loads it - that gap
# is exactly what took named down once already while building split-horizon
# views (a stock zone left outside the new view blocks). This is the one
# check that mirrors named's real startup: run against the true top-level
# file, after every other config/zone write above has already landed. If
# this fails, the play aborts here and the notified handler never fires -
# named keeps running on its last-known-good config instead of restarting
# into a broken one.
- name: Validate the full merged named configuration
  become: true
  ansible.builtin.command:
    cmd: named-checkconf
  changed_when: false

- name: Ensure services are started and enabled
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - named

- name: Publish the derived record set to the public zone
  ansible.builtin.include_tasks: public-dns.yaml
  when: bind_public_dns_enabled
