// MANAGED BY ANSIBLE (roles/infra-named) — local edits will be overwritten.
//
// This replaces Debian's stock /etc/bind/named.conf, and differs from it in
// exactly one way: it does NOT include named.conf.default-zones at the top
// level. BIND refuses to start if any zone sits outside a view while views
// exist, and split horizon (bind_views_enabled) puts every zone in a view.
// named.conf.options includes that same file inside each view instead, so the
// root hints and localhost zones are still served — once per view.
//
// Only deployed when bind_views_enabled is true. Turning views back off does
// not restore Debian's original file; put the include back by hand, or
// reinstall it with `apt-get install --reinstall bind9`.

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
