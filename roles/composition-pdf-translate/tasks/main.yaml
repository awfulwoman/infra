# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .environment_vars file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create data directory
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    mode: "0755"

# The UI reads config.json for its defaults (Ollama URL, model, languages).
# Seed once: the UI's "Save configuration" button writes to the same file.
- name: Seed UI config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ composition_config }}/data/config.json"
    mode: "0644"
    force: false

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: missing
    remove_orphans: true
  notify: Restart Traefik
