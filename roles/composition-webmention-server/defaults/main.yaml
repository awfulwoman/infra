# code: language=ansible
composition_name: webmention-server

# Public name (webmention.<personal domain>) lives in the public Hetzner zone
# (infra-public-resources), not in internal DNS, so no internal labels.
composition_dns_subdomains: []
composition_webmention_server_hostname: "webmention.{{ domainname_personal }}"

# Our own image, built and tested by GitHub Actions. Tracks latest (pulled on every run);
# pin a sha-<short> tag to roll back.
composition_webmention_server_image: ghcr.io/awfulwoman/webmention-server:latest

# The site that receives Webmentions, and its sitemap.
composition_webmention_server_site_url: "https://{{ domainname_personal }}/"
composition_webmention_server_site_hosts:
  - "{{ domainname_personal }}"
  - "www.{{ domainname_personal }}"

# Salts the hashes that rate limiting keys on.
composition_webmention_server_ip_hash_salt: "{{ vault_composition_webmention_server_ip_hash_salt }}"

# Needs `seed` to have run in the container first (see README); without it passes refuse to run.
composition_webmention_server_send_enabled: true
# Post permalinks only, matching the url patterns in the site's data/micropub.yaml.
composition_webmention_server_send_source_paths:
  - '^/(notes|bookmarks|likes|replies|reposts|photos|quotes|checkins)/\d{4}/\d{2}/\d{2}/[^/]+/$'
  - '^/posts/[^/]+/$'
# Pages we never send to: our own syndication copies (Bridgy covers those), the Wayback Machine
# link that every bookmark carries, and sites that have no Webmention (old bookmarks and likes
# are mostly twitter.com; checkins link to a map).
composition_webmention_server_send_skip_hosts:
  - gts.awfulwoman.com
  - bsky.app
  - web.archive.org
  - twitter.com
  - x.com
  - www.openstreetmap.org

# Shared with the GitHub webhook on the site repo (Workflow runs). Empty: the endpoint is off.
composition_webmention_server_github_webhook_secret: "{{ vault_composition_webmention_server_github_webhook_secret | default('') }}"

# Who may sign in to /admin, and where they sign in: micropub-server is the IndieAuth server.
composition_webmention_server_admin_me: "{{ composition_webmention_server_site_url }}"
composition_webmention_server_authorization_endpoint: "https://indie.{{ domainname_personal }}/auth"
# Sign the admin session cookie. Empty: /admin is off.
composition_webmention_server_session_secret: "{{ vault_composition_webmention_server_session_secret | default('') }}"
# Bearer token for /admin/api (the gateway, scripts). Empty: the API is off.
composition_webmention_server_admin_api_token: "{{ vault_composition_webmention_server_admin_api_token | default('') }}"
# A Home Assistant webhook, for "new mentions to review" and alerts. Empty: no notices.
composition_webmention_server_ha_webhook_url: "{{ vault_composition_webmention_server_ha_webhook_url | default('') }}"

# Backfeed: likes, boosts and replies on our GoToSocial copies come back as mentions.
# The token is a GoToSocial application with read:notifications, read:statuses and
# read:accounts only. Empty: backfeed is off.
composition_webmention_server_backfeed_host: "gts.{{ domainname_personal }}"
composition_webmention_server_backfeed_account: charlie
composition_webmention_server_gts_access_token: "{{ vault_composition_webmention_server_gts_access_token | default('') }}"
