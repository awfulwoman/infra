# code: language=ansible

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: "Create .environment_vars file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  notify: Restart webmention-server

# ----------------------------
# Specific tasks
# ----------------------------

# The container runs as uid 1000 and writes its SQLite database here.
- name: Create data directory
  ansible.builtin.file:
    path: "{{ composition_config }}/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  become: true

- name: "Create config.yaml"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ composition_config }}/config.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: Restart webmention-server

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    pull: always
    remove_orphans: true
  notify: Restart Traefik
