# code: language=ansible

- name: "Assert account names are safe to use as directories/systemd instances"
  ansible.builtin.assert:
    that: item.name is regex("^[a-z0-9][a-z0-9_-]*$")
    fail_msg: >-
      emailbackup_accounts name '{{ item.name }}' must match ^[a-z0-9][a-z0-9_-]*$
      — it becomes a Maildir subdirectory, a systemd instance name
      (emailbackup@{{ item.name }}.service), and the account name reported by
      mail-archive-server.
    quiet: true
  loop: "{{ emailbackup_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Install isync (mbsync)"
  become: true
  ansible.builtin.apt:
    name: isync
    state: present

- name: "Verify email backup storage path exists (provisioned by system-zfs)"
  ansible.builtin.stat:
    path: "{{ emailbackup_storage_path }}"
  register: emailbackup_storage_check

- name: "Fail if email backup storage path does not exist"
  ansible.builtin.fail:
    msg: "{{ emailbackup_storage_path }} does not exist. Ensure system-zfs has provisioned the dataset."
  when: not emailbackup_storage_check.stat.exists

- name: "Ensure email backup storage ownership"
  become: true
  ansible.builtin.file:
    path: "{{ emailbackup_storage_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# --- Retire the old single-account, non-templated units -------------------
# These are fully superseded by emailbackup@<account>.service/.timer below. Only
# ONE account's data can have lived under the old layout (emailbackup_storage_path
# with folders directly inside it, e.g. .../INBOX) — see the role README for the
# one-time, manually-run migration that moves it into emailbackup_storage_path/
# <account>/ BEFORE this role is applied to an already-populated host. This block
# only removes the old unit files; it never touches Maildir data.

- name: "Check for old non-templated emailbackup units"
  ansible.builtin.stat:
    path: "/etc/systemd/system/emailbackup.{{ item }}"
  loop: [service, timer]
  register: _emailbackup_old_units

- name: "Stop and disable old non-templated emailbackup units"
  become: true
  ansible.builtin.systemd_service:
    name: "emailbackup.{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ _emailbackup_old_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: "Remove old non-templated emailbackup unit files"
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/emailbackup.{{ item.item }}"
    state: absent
  loop: "{{ _emailbackup_old_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  notify: Reload systemd daemon

# --- Per-account directories -------------------------------------------------

- name: "Ensure per-account Maildir directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ emailbackup_storage_path }}/{{ item.name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ emailbackup_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Ensure per-account mbsync SyncState directory exists"
  ansible.builtin.file:
    path: "{{ emailbackup_storage_path }}/.mbsync/{{ item.name }}"
    state: directory
    mode: "0755"
  loop: "{{ emailbackup_accounts }}"
  loop_control:
    label: "{{ item.name }}"

# --- Healthchecks.io dead-man's-switch, one check per account ---------------
# A missed OR failed run for any one account now reports on its own — the
# original single-check design let one account's daily failure hide behind
# another account's success indefinitely (see the role README).

- name: "Create healthchecks.io checks per account"
  when: emailbackup_healthchecksio_enabled
  vars:
    _hc_cron: >-
      {{ {"hourly": "0 * * * *", "daily": "15 0 * * *", "weekly": "15 0 * * 1"}
         [emailbackup_sync_schedule] | default("15 0 * * *") }}
    _hc_grace: >-
      {{ {"hourly": 5400, "daily": 21600, "weekly": 43200}
         [emailbackup_sync_schedule] | default(21600) }}
  block:
    - name: "Ensure HC check exists per account"
      community.healthchecksio.checks:
        state: present
        api_key: "{{ emailbackup_healthchecksio_api_key }}"
        name: "{{ inventory_hostname }} - Email backup ({{ item.name }})"
        unique: ["name"]
        tags:
          - autogenerated
          - email-backup
          - "{{ inventory_hostname }}"
          - "{{ item.name }}"
        schedule: "{{ _hc_cron }}"
        grace: "{{ _hc_grace }}"
        tz: "{{ emailbackup_healthchecksio_tz }}"
      loop: "{{ emailbackup_accounts }}"
      loop_control:
        label: "{{ item.name }}"
      register: _emailbackup_hc_checks

    - name: "Build HC UUID map"
      ansible.builtin.set_fact:
        emailbackup_hc_uuids: >-
          {{ emailbackup_hc_uuids | default({}) | combine({item.item.name: item.uuid}) }}
      loop: "{{ _emailbackup_hc_checks.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.uuid is defined and item.uuid is not false

# --- Config, scripts, units --------------------------------------------------

- name: "Create mbsync config"
  ansible.builtin.template:
    src: mbsyncrc.j2
    dest: "/home/{{ ansible_user }}/.mbsyncrc"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: "Ensure emailbackup script directory exists"
  become: true
  ansible.builtin.file:
    path: "{{ emailbackup_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Deploy per-account run script"
  become: true
  ansible.builtin.template:
    src: emailbackup-run.sh.j2
    dest: "{{ emailbackup_script_dir }}/emailbackup-run-{{ item.name }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ emailbackup_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Create systemd instance service template"
  become: true
  ansible.builtin.template:
    src: "emailbackup@.service.j2"
    dest: /etc/systemd/system/emailbackup@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: "Create systemd instance timer template"
  become: true
  ansible.builtin.template:
    src: "emailbackup@.timer.j2"
    dest: /etc/systemd/system/emailbackup@.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: "Reload systemd now so the per-account timers below can be enabled"
  ansible.builtin.meta: flush_handlers

- name: "Enable and start per-account timer"
  become: true
  ansible.builtin.systemd_service:
    name: "emailbackup@{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: false
  loop: "{{ emailbackup_accounts }}"
  loop_control:
    label: "{{ item.name }}"
