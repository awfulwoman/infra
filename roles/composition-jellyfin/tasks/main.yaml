# code: language=ansible

# ----------------------------
# Hardware transcoding
#
# Jellyfin transcodes on the host's Intel QuickSync GPU. /dev/dri/renderD128 is
# root:render 0660, and the container is not guaranteed to run as root, so the
# render group's GID is passed in as well. The GID differs between systems, so
# it is read from the host rather than hardcoded as 107.
#
# A host with no render device gets neither key: Docker refuses to create a
# container that names a device the host does not have.
# ----------------------------

- name: Check for a render device
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: composition_jellyfin_render_device

- name: Look up the render group
  ansible.builtin.getent:
    database: group
    key: render
  when: composition_jellyfin_render_device.stat.exists

- name: Record the render group gid
  ansible.builtin.set_fact:
    composition_jellyfin_render_gid: >-
      {{ ansible_facts.getent_group.render[2] }}
  when: composition_jellyfin_render_device.stat.exists

# ----------------------------
# Core tasks
# ----------------------------

- name: "Create compose file"
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ composition_root }}/docker-compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Create .env file"
  ansible.builtin.template:
    src: environment_vars.j2
    dest: "{{ composition_root }}/.environment_vars"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# ----------------------------
# Specific tasks
# ----------------------------

- name: Create directories
  ansible.builtin.file:
    path: "{{ composition_config }}/{{ dir_item }}"
    state: directory
  loop_control:
    loop_var: dir_item
  loop:
    - config
    - cache

# - name: Copy over files
#   become: true
#   ansible.builtin.copy:
#     src: filename.txt
#     dest: "{{ composition_config }}/filename.txt

# ----------------------------
# Start composition
# ----------------------------

- name: Start Docker Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ composition_root }}"
    state: present
    build: always
    remove_orphans: true
  notify: Restart Traefik
