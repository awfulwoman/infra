- name: DeeDee - aw man, we're off to Yonkers
  hosts: raspberry-pi4-2gb-deedee
  roles:
  - role: monitoring-healthchecksio
    monitoring_healthchecksio_ping_type: start
    tags: [monitoring, monitoring-healthchecksio]
  - role: hardware-raspberry-pi
    tags: [hardware, hardware-raspberry-pi]
  - role: bootstrap-ubuntu-server
    tags: [bootstrap, bootstrap-ubuntu-server]
  - role: network-netplan
    tags: [network, network-netplan]
  - role: infothrill.nullmailer
    become: true
  - role: system-sshkey
    tags: [system, system-sshkey]
  - role: system-repos
    tags: [system, system-repos]
  - role: system-zfs
    tags: [system, zfs, system-zfs]
  - role: infra-public-resources
    tags: [infra, infra-public-resources]
  - role: infra-private-resources
    tags: [infra, infra-private-resources]
  - role: infra-named
    tags: [infra, infra-named]
  - role: infra-certbot
    tags: [infra, infra-certbot]
  - role: system-claude
    tags: [system, system-claude]

  # roles: always executes before tasks:, regardless of position in this file,
  # so everything that ran after the composition roles in the old static list
  # — including the final success ping — has to move here too, in the same
  # order, or it would silently start reporting deploy success before
  # compositions actually ran.
  tasks:
    # tags: cannot reference inventory vars (host_vars/group_vars) — confirmed
    # by testing: even a plain group_vars/all.yaml var is 'undefined' under
    # --list-tags, since that pass runs before per-host variables are loaded.
    # Deriving this list from `compositions` is therefore not viable; it's
    # written out explicitly, matching what the old static role entries
    # carried. If compositions changes, update this list to match.
    - name: Deploy compositions
      ansible.builtin.include_role:
        name: "composition-{{ item.composition | default(item) }}"
      loop: "{{ compositions }}"
      tags: [composition, composition-reverseproxy, composition-container-management, zfs, composition-zfs-api]

    - name: backups-zfs-client
      ansible.builtin.include_role:
        name: backups-zfs-client
      tags: [backups, zfs, backups-zfs-client]

    - name: script-share-personal-site
      ansible.builtin.include_role:
        name: script-share-personal-site
      tags: [script, script-share-personal-site]

    - name: system-promtail
      ansible.builtin.include_role:
        name: system-promtail
      tags: [system, promtail, system-promtail]

    - name: monitoring-healthchecksio (success)
      ansible.builtin.include_role:
        name: monitoring-healthchecksio
      vars:
        monitoring_healthchecksio_ping_type: success
      tags: [monitoring, monitoring-healthchecksio]

  handlers:
  - name: Reboot host
    become: true
    ansible.builtin.reboot:
