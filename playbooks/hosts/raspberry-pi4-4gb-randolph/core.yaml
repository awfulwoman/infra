- name: RANDOLPH!
  hosts: raspberry-pi4-4gb-randolph
  roles:
  - role: monitoring-healthchecksio
    monitoring_healthchecksio_ping_type: start
    tags: [monitoring, monitoring-healthchecksio]
  - role: hardware-raspberry-pi
    tags: [hardware, hardware-raspberry-pi]
  - role: bootstrap-ubuntu-server
    tags: [bootstrap, bootstrap-ubuntu-server]
  - role: network-netplan
    tags: [network, network-netplan]
  - role: infothrill.nullmailer
    become: true
  - role: system-sshkey
    tags: [system, system-sshkey]
  - role: system-zfs
    tags: [system, zfs, system-zfs]
  - role: system-zfs-policy
    tags: [system, zfs, system-zfs-policy]
  - role: system-docker
    tags: [system, docker, system-docker]
  tasks:
    # tags: cannot reference inventory vars (host_vars/group_vars) — confirmed by
    # testing: even a plain group_vars/all.yaml var is 'undefined' under
    # --list-tags, since that pass runs before per-host variables are loaded.
    # Deriving this list from `compositions` is therefore not viable; it's
    # written out explicitly, matching what the old static role entry carried.
    # If compositions changes, update this list to match.
    - name: Deploy compositions
      ansible.builtin.include_role:
        name: "composition-{{ item }}"
      loop: "{{ compositions }}"
      tags: [composition, composition-1password-connect, connect]
