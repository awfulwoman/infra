- name: Camina — Ansible control node and 1Password Connect host
  hosts: minipc-8gb-camina
  roles:
  - role: preflight-onepassword
    tags: [always, preflight-onepassword]
  - role: bootstrap-ubuntu-server
    tags: [bootstrap, bootstrap-ubuntu-server]
  - role: network-netplan
    tags: [network, network-netplan]
  - role: system-zfs
    tags: [system, zfs, system-zfs]
  - role: system-zfs-policy
    tags: [system, zfs, system-zfs-policy]
  - role: infothrill.nullmailer
    become: true
  - role: system-homebrew
    tags: [system, system-homebrew]
  - role: system-claude
    tags: [system, system-claude]
  - role: system-nvm
    tags: [system, system-nvm]
  - role: system-opencode
    tags: [system, system-opencode]
  - role: hardware-brother-ptouch
    tags: [hardware, hardware-brother-ptouch]
  - role: hardware-rtl-sdr
    vars: {rtl_sdr_mode: openwebrx}
    tags: [hardware, hardware-rtl-sdr]
  - role: ansible-core
    tags: [ansible, ansible-core]
  - role: system-known-hosts
    tags: [system, system-known-hosts]
  - role: system-ssh-aliases
    tags: [system, system-ssh-aliases]
  - role: client-cert-distribution
    tags: [infra, client-cert-distribution]
  - role: system-compositions
    tags: [composition, zfs]
  # Configures every Syncthing instance over its API (syncthing_folders).
  - role: system-syncthing-config
    tags: [syncthing, system-syncthing-config]
  - role: backups-zfs-client
    tags: [backups, zfs, backups-zfs-client]
  - role: system-logtide-syslog
    tags: [system, system-logtide-syslog]

  tasks:
  # Feeds the domain-guard pre-commit hook. Outside every repo, so the names
  # never reach git; 0600 because they come from the vault.
  - name: Create the domain-guard directory
    ansible.builtin.file:
      path: "{{ ansible_facts.user_dir }}/.config/domain-guard"
      state: directory
      mode: "0700"
    tags: [system, domain-guard]

  - name: Write the domain-guard list
    ansible.builtin.copy:
      content: "{{ domain_guard_domains | join('\n') }}\n"
      dest: "{{ ansible_facts.user_dir }}/.config/domain-guard/domains"
      mode: "0600"
    no_log: true
    tags: [system, domain-guard]

  handlers:
  - name: Reboot host
    become: true
    ansible.builtin.reboot:
