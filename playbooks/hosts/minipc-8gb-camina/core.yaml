- name: Camina — Ansible control node and 1Password Connect host
  hosts: minipc-8gb-camina
  roles:
  - role: bootstrap-ubuntu-server
    tags: [bootstrap, bootstrap-ubuntu-server]
  - role: network-netplan
    tags: [network, network-netplan]
  - role: system-zfs
    tags: [system, zfs, system-zfs]
  - role: system-zfs-policy
    tags: [system, zfs, system-zfs-policy]
  - role: infothrill.nullmailer
    become: true
  - role: system-claude
    tags: [system, system-claude]
  - role: ansible-core
    tags: [ansible, ansible-core]
  - role: system-known-hosts
    tags: [system, system-known-hosts]
  - role: client-cert-distribution
    tags: [infra, client-cert-distribution]
  - role: system-compositions
    tags: [composition, zfs]
  - role: backups-zfs-client
    tags: [backups, zfs, backups-zfs-client]
  - role: system-logtide-syslog
    tags: [system, system-logtide-syslog]

  handlers:
  - name: Reboot host
    become: true
    ansible.builtin.reboot:
