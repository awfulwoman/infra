# Belinda was the second ZFS backup server. Her disks died (infra#300), so the
# ZFS, backup and composition roles are gone. She is a bare host until she is
# given a new job.
- name: Belinda, awaiting a new role
  hosts: raspberry-pi5-4gb-belinda
  roles:
  - role: bootstrap-ubuntu-server
    tags: [bootstrap, bootstrap-ubuntu-server]
  - role: network-netplan
    tags: [network, network-netplan]
  - role: hardware-raspberry-pi
    tags: [hardware, hardware-raspberry-pi]
  - role: client-nut
    state: absent
    tags: [client, client-nut]
  - role: infothrill.nullmailer
    become: true
  - role: system-promtail
    tags: [system, promtail, system-promtail]
    vars: {state: absent}

  handlers:
  - name: Reboot host
    become: true
    ansible.builtin.reboot:
