# Set one host's account password to its staged vault_password_next.
#
# Phase two of the rotation described in scripts/rotate-host-password.py:
#
#   1. scripts/rotate-host-password.py stage <host>
#   2. ansible-playbook playbooks/utility/rotate-account-password.yaml -e rotate_target=<host>
#   3. scripts/rotate-host-password.py promote <host>
#   4. ansible <host> -b -m ping        (proves become with the new vault_password)
#   5. commit and push the same day: the nightly Semaphore run deploys `main`
#
# Do not leave a host between steps 2 and 5 across the nightly run window
# (01:30-05:00 Europe/Berlin).
#
# Safe by construction:
# - Refuses unless the account password matches the CURRENT vault_password
#   (or already matches the staged one, which makes a re-run a no-op).
#   -e rotate_allow_mismatch=true skips that check. Use it only on a host with
#   passwordless sudo, where Ansible does not need the password.
# - Verifies the new password against /etc/shadow before it finishes. Verify
#   tasks use vault_password_next for `become`, so a host with passworded sudo
#   (bertha) is still reachable after the change.
# - Checks run in --check mode too and change nothing.
# - Linux only. malcolm (macOS) needs its own procedure: its password also
#   unlocks three keychains. pikvm has a read-only root filesystem: run
#   `rw` there first.
#
# Never prints a secret: every task that touches one has no_log.

- name: Set the account password to the staged vault_password_next
  hosts: "{{ rotate_target }}"
  gather_facts: true
  serial: 1
  vars:
    rotate_user: "{{ vault_server_username }}"
    rotate_allow_mismatch: false
    # Reads the account hash from /etc/shadow and recomputes it from the
    # candidate password on stdin, using openssl so no extra package is needed.
    # Prints MATCH, MISMATCH, UNSUPPORTED_HASH or UNSUPPORTED_ROUNDS.
    rotate_check_script: |
      set -eu
      hash=$(awk -F: -v u="{{ rotate_user }}" '$1==u{print $2}' /etc/shadow)
      case "$hash" in
        '$6$rounds='*) echo UNSUPPORTED_ROUNDS; exit 0 ;;
        '$6$'*) ;;
        *) echo UNSUPPORTED_HASH; exit 0 ;;
      esac
      salt=$(printf '%s' "$hash" | cut -d'$' -f3)
      [ "$(openssl passwd -6 -salt "$salt" -stdin)" = "$hash" ] && echo MATCH || echo MISMATCH
  tasks:
    - name: Refuse anything but exactly one named host
      ansible.builtin.assert:
        that:
          - rotate_target == inventory_hostname
          - ansible_play_hosts_all | length == 1
        fail_msg: "Pass one inventory host name as rotate_target, not a group or pattern."
      run_once: true

    - name: Refuse a host that is not Linux
      ansible.builtin.assert:
        that: ansible_facts['system'] == 'Linux'
        fail_msg: "Linux only. macOS (malcolm) needs its own procedure: the password also unlocks keychains."

    - name: Refuse without a usable staged value
      ansible.builtin.assert:
        that:
          - vault_password_next is defined
          - vault_password_next | length >= 32
          - vault_password_next != vault_password
        fail_msg: "Run scripts/rotate-host-password.py stage {{ inventory_hostname }} first."
      no_log: true

    - name: Check the account password against the current vault_password
      become: true
      ansible.builtin.shell:
        cmd: "{{ rotate_check_script }}"
        executable: /bin/bash
        stdin: "{{ vault_password }}"
      register: rotate_current
      changed_when: false
      check_mode: false
      no_log: true
      # `become` itself fails on a passworded host that is already rotated
      # (the old password no longer works). failed_when does not catch that;
      # ignore_errors does.
      ignore_errors: true

    - name: Check the account password against the staged vault_password_next
      become: true
      ansible.builtin.shell:
        cmd: "{{ rotate_check_script }}"
        executable: /bin/bash
        stdin: "{{ vault_password_next }}"
      register: rotate_staged
      changed_when: false
      check_mode: false
      no_log: true
      vars:
        ansible_become_password: "{{ vault_password_next }}"
      # On a passworded host that is not rotated yet, only the old password
      # works for become, so a failure here is read as "not rotated yet".
      ignore_errors: true

    - name: Say where this host stands
      ansible.builtin.debug:
        msg: >-
          current={{ rotate_current.stdout | default('not reachable with the current password') | trim }}
          staged={{ rotate_staged.stdout | default('not reachable with the staged password') | trim }}

    - name: Refuse when the account matches neither password
      ansible.builtin.assert:
        that: >-
          rotate_allow_mismatch | bool
          or (rotate_current.stdout | default('') | trim) == 'MATCH'
          or (rotate_staged.stdout | default('') | trim) == 'MATCH'
        fail_msg: >-
          The account password matches neither vault_password nor
          vault_password_next. Nothing was changed. Find out why before
          rotating. With passwordless sudo you can force it with
          -e rotate_allow_mismatch=true.
      no_log: true

    # Hash with openssl and apply with `chpasswd -e`, not plain `chpasswd`: on
    # Ubuntu 22.04+ PAM makes plain chpasswd store yescrypt ($y$), which the
    # check above and system-security's become-password guard cannot read.
    # sha512crypt ($6$) is what they expect, and it is no weaker for a random
    # 64-character hex password.
    - name: Set the account password
      become: true
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          hash=$(openssl passwd -6 -stdin)
          printf '%s:%s\n' "{{ rotate_user }}" "$hash" | chpasswd -e
        executable: /bin/bash
        stdin: "{{ vault_password_next }}"
      when: (rotate_staged.stdout | default('') | trim) != 'MATCH'
      no_log: true

    - name: Verify the account password is now vault_password_next
      become: true
      ansible.builtin.shell:
        cmd: "{{ rotate_check_script }}"
        executable: /bin/bash
        stdin: "{{ vault_password_next }}"
      register: rotate_verify
      changed_when: false
      check_mode: false
      no_log: true
      # In --check nothing was set, so the new password cannot verify yet.
      when: not ansible_check_mode
      vars:
        ansible_become_password: "{{ vault_password_next }}"

    - name: Fail loudly unless the new password is in place
      ansible.builtin.assert:
        that: (rotate_verify.stdout | trim) == 'MATCH'
        fail_msg: >-
          The account password does not match vault_password_next after the
          change. Do NOT promote. Result: {{ rotate_verify.stdout | trim }}
      when: not ansible_check_mode
      no_log: true

    - name: Next steps
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} now has the staged password. Run
          scripts/rotate-host-password.py promote {{ inventory_hostname }},
          check with `ansible {{ inventory_hostname }} -b -m ping`, then
          commit and push the same day.
