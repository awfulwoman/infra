- name: Check the Enable Banking credentials are readable via 1Password Connect
  hosts: apple-macmini-m4-16gb-malcolm
  connection: local
  gather_facts: false
  vars:
    firefly_enablebanking_item_id: fisnhyavlrcztjznla55kuzdu4
  tasks:
    - name: Fetch the item
      ansible.builtin.uri:
        url: >-
          {{ onepassword_connect_host }}/v1/vaults/{{ onepassword_connect_vault_id
          }}/items/{{ firefly_enablebanking_item_id }}
        headers:
          Authorization: "Bearer {{ onepassword_connect_token }}"
        status_code: [200, 404]
      register: item
      no_log: true

    - name: Fail with a pointer to the fix when the item is not visible
      ansible.builtin.assert:
        that:
          - item.status == 200
        fail_msg: >-
          Item {{ firefly_enablebanking_item_id }} is not in the Infra vault,
          which is the only vault the Connect read token can see. Move it there
          in 1Password, then re-run.
        success_msg: "Item is visible to the Connect read token."

    - name: Confirm both fields are present
      vars:
        fields: "{{ item.json.fields | selectattr('label', 'defined') }}"
        app_id: "{{ fields | selectattr('label', 'eq', 'App ID') | map(attribute='value') | list }}"
        priv: "{{ fields | selectattr('label', 'eq', 'Private Key') | map(attribute='value') | list }}"
      ansible.builtin.assert:
        that:
          - app_id | length == 1
          - app_id | first | length > 0
          - priv | length == 1
          - priv | first | length > 0
        fail_msg: "Expected fields 'App ID' and 'Private Key' on the item."
        success_msg: "Both fields present."

    # composition-finances passes the key straight through, so it must already be
    # an ordinary multi-line PEM. Checked without ever printing it.
    - name: Confirm the key is stored as an ordinary multi-line PEM
      vars:
        fields: "{{ item.json.fields | selectattr('label', 'defined') }}"
        priv: "{{ fields | selectattr('label', 'eq', 'Private Key') | map(attribute='value') | first | trim }}"
      ansible.builtin.assert:
        that:
          - priv.startswith('-----BEGIN')
          - "'-----END' in priv"
          # Real line breaks, not the \n escapes the tutorial shows: Compose
          # preserves the former and passes the latter through as literal
          # characters that openssl cannot parse. The escaped form is one line,
          # so counting real newlines is enough to tell them apart.
          - priv | regex_findall('\n') | length >= 2
        fail_msg: >-
          The private key must be stored as an ordinary multi-line PEM, with
          real line breaks rather than \n escapes. Re-save the .pem file
          contents verbatim into the 1Password field.
        success_msg: "Private key is stored as an ordinary multi-line PEM."
