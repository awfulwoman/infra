- name: Check the Enable Banking credentials are readable via 1Password Connect
  hosts: minipc-8gb-camina
  connection: local
  gather_facts: false
  vars:
    # Keep in step with the composition-finances role default.
    firefly_enablebanking_item: External - Enable Banking (old)
  tasks:
    # The lookup raises if the item is missing, ambiguous or the field is empty.
    - name: Read both fields through the lookup plugin
      ansible.builtin.set_fact:
        app_id: "{{ lookup('onepassword_connect', firefly_enablebanking_item, 'App ID') }}"
        priv: "{{ lookup('onepassword_connect', firefly_enablebanking_item, 'Private Key') }}"
      no_log: true

    - name: Confirm both fields have a value
      ansible.builtin.assert:
        that:
          - app_id | length > 0
          - priv | length > 0
        success_msg: "'{{ firefly_enablebanking_item }}' is visible to the Connect read token with both fields set."
