- name: Export every declared service name across infra hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    output_path: "{{ playbook_dir }}/../../scripts/snapshot-domains-names.json"
  tasks:
    - name: Collect hand-written cnames_additional declared on each infra host
      ansible.builtin.set_fact:
        service_names: "{{ (service_names | default([])) + (hostvars[item].cnames_additional | default([])) }}"
      loop: "{{ groups['infra'] }}"

    # Composition-derived names aren't visible above (cnames_additional is
    # only for names with no owning composition) — derive them the same way
    # infra-named does, via the dns_records filter.
    - name: Build dns_records filter input from hosts using data-driven compositions
      ansible.builtin.set_fact:
        dns_records_hosts: >-
          {{
            (dns_records_hosts | default({})) | combine({
              item: {
                'fqdn': hostvars[item].host_pfqdn,
                'tailscale_ipv4': hostvars[item].host_tailscale_ipv4,
                'compositions': hostvars[item].compositions,
              }
            })
          }}
      loop: "{{ groups['infra'] }}"
      loop_control:
        label: "{{ item }}"
      when: hostvars[item].compositions is defined

    - name: Add derived service names, fully qualified to match the hand-written ones
      ansible.builtin.set_fact:
        service_names: >-
          {{
            (service_names | default([]))
            + ((dns_records_hosts | default({})) | dns_records(lookup('composition_dns_subdomains')))
              .cnames.keys() | map('regex_replace', '$', '.' + domainname_infra) | list
          }}

    - name: Write sorted, de-duplicated service name list
      ansible.builtin.copy:
        content: "{{ (service_names | unique | sort) | to_nice_json }}\n"
        dest: "{{ output_path }}"
        mode: "0644"
