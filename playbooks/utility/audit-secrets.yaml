# Audit the 1Password Infra vault against the naming scheme and this repo:
#   - every title a lookup('onepassword_connect', ...) names exists once, with
#     that field, and the item is tagged ansible
#   - every field with a value on an ansible-tagged item has a consumer
#   - every item has exactly one group tag and the matching title prefix
# Prints names only, never values. Category and stray-tag findings are
# warnings. Fails if there are errors.
#
#   ansible-playbook playbooks/utility/audit-secrets.yaml
- name: Audit 1Password Infra vault
  hosts: minipc-8gb-camina
  gather_facts: false
  roles:
    - role: preflight-onepassword
  tasks:
    - name: Run the audit
      ansible.builtin.command: "python3 {{ playbook_dir }}/../../scripts/audit-secrets.py"
      environment:
        OP_CONNECT_HOST: "{{ onepassword_connect_host }}"
        OP_CONNECT_TOKEN: "{{ onepassword_connect_token }}"
        OP_CONNECT_VAULT: "{{ onepassword_connect_vault_id }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: audit.rc not in [0, 1]
      register: audit

    - name: Report
      ansible.builtin.debug:
        msg: "{{ audit.stdout_lines }}"

    - name: Fail on errors
      ansible.builtin.fail:
        msg: The audit found errors (above).
      when: audit.rc == 1
