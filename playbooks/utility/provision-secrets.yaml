# Create or update items in the 1Password Infra vault, without printing a value.
# Idempotent: a generated field is made once, in 1Password, and left alone after.
#
# Needs a write token in the shell (never in the repo, Ansible Vault or Semaphore):
#   export OP_CONNECT_TOKEN_WRITE='<token>'
#
#   ansible-playbook playbooks/utility/provision-secrets.yaml -e subject=<name>
#   ansible-playbook playbooks/utility/provision-secrets.yaml -e subject=<name> --check
#
# <name> picks playbooks/utility/provision-secrets/<name>.yaml, which defines
# `provision_items`: the spec format is described in scripts/onepassword.py.
# To copy an existing vault value, give the field `value: "{{ vault_x }}"`.
- name: Provision 1Password items
  hosts: minipc-8gb-camina
  gather_facts: false
  vars_files:
    - "provision-secrets/{{ subject }}.yaml"
  roles:
    - role: preflight-onepassword
  tasks:
    - name: Apply the items
      ansible.builtin.command: "python3 {{ playbook_dir }}/../../scripts/onepassword.py apply - --json {{ '--check' if ansible_check_mode else '' }}"
      args:
        stdin: "{{ {'items': provision_items} | to_json }}"
      environment:
        OP_CONNECT_HOST: "{{ onepassword_connect_host }}"
        OP_CONNECT_VAULT: "{{ onepassword_connect_vault_id }}"
        OP_CONNECT_TOKEN_WRITE: "{{ lookup('ansible.builtin.env', 'OP_CONNECT_TOKEN_WRITE') }}"
      delegate_to: localhost
      run_once: true
      check_mode: false
      register: provision_result
      changed_when: (provision_result.stdout | from_json).changed
      no_log: true

    - name: Report (names and actions only)
      ansible.builtin.debug:
        msg: "{{ (provision_result.stdout | from_json)['items'] | map(attribute='action') | zip((provision_result.stdout | from_json)['items'] | map(attribute='title')) | map('join', ': ') | list }}"
      run_once: true
