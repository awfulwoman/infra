# Only for hosts that still define vault_password (pikvm, malcolm). The six
# migrated hosts keep their password only in 1Password (infra#339).
# Store a host's vault_password on its `Host - <Name>` item in 1Password.
# Needs the write token in the shell: export OP_CONNECT_TOKEN_WRITE=...
# (never stored in the repo, vault or Semaphore; revoke it afterwards).
# Never prints the value.
#
#   ansible-playbook playbooks/utility/store-host-password.yaml -e store_host=server-8gb-backups
#   ansible-playbook playbooks/utility/store-host-password.yaml -e store_host=localhost -e inspect=true
- name: Store host password in 1Password
  hosts: "{{ store_host }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Inspect host items (no values)
      ansible.builtin.command: "python3 {{ playbook_dir }}/../../scripts/op-host-password.py --inspect"
      environment:
        OP_CONNECT_HOST: "{{ onepassword_connect_host }}"
        OP_CONNECT_TOKEN_WRITE: "{{ lookup('ansible.builtin.env', 'OP_CONNECT_TOKEN_WRITE') }}"
        OP_CONNECT_VAULT: "{{ onepassword_connect_vault_id }}"
      changed_when: false
      register: store_inspect
      when: inspect | default(false) | bool
      run_once: true

    - name: Show items
      ansible.builtin.debug:
        var: store_inspect.stdout_lines
      when: inspect | default(false) | bool
      run_once: true

    - name: Write the password
      ansible.builtin.command: "python3 {{ playbook_dir }}/../../scripts/op-host-password.py 'Host - {{ host_name_short | capitalize }}'"
      environment:
        OP_CONNECT_HOST: "{{ onepassword_connect_host }}"
        OP_CONNECT_TOKEN_WRITE: "{{ lookup('ansible.builtin.env', 'OP_CONNECT_TOKEN_WRITE') }}"
        OP_CONNECT_VAULT: "{{ onepassword_connect_vault_id }}"
        HOST_PASSWORD: "{{ vault_password }}"
      register: store_result
      changed_when: "'created' in store_result.stdout or 'updated' in store_result.stdout"
      no_log: true
      when: not (inspect | default(false) | bool)

    - name: Read it back and compare (booleans only)
      ansible.builtin.assert:
        that:
          - lookup('onepassword_connect', 'Host - ' ~ (host_name_short | capitalize), 'password') == vault_password
        quiet: true
      no_log: true
      when: not (inspect | default(false) | bool)
